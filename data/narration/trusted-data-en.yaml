  - { at: 94.6,  text: "So where does the model run?" }
  - { at: 97.2,  text: "One request, three sensitivity levels." }
  - { at: 102.3, text: "Sensitivity decides the path, not convenience. Secrets stay inside. Confidential data leaves anonymised. Public data goes straight to the cloud." }
  - { at: 112.8, text: "Same agent, same gateway: sensitive and everyday questions in one flow." }
  # The answer
  - { at: 118.4, text: "The result: the buyers, the market context, and a suggested action." }
  - { at: 123.0, text: "A useful answer you can trust, and explain. No client name left the bank." }

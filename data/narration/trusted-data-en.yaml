  # Data quality
  - { at: 22.9,  text: "First, quality. The raw data hides a duplicate, a gap and a stale record." }
  - { at: 28.3,  text: "Garbage in, confident garbage out. The model doesn't know the data is wrong. It answers anyway." }
  - { at: 36.9,  text: "So quality is checked before the agent ever reads the data." }
  # Data context
  - { at: 44.2,  text: "Second, context. A tool that just says returns data leaves the agent guessing." }
  - { at: 49.8,  text: "Well described, it gets it right the first time." }
  - { at: 53.0,  text: "If it isn't described, the AI can't find it. Metadata is part of the product." }
  # Who sees what
  - { at: 58.7,  text: "Third, access." }
  - { at: 61.4,  text: "The agent acts on behalf of the user, with the user's rights." }
  - { at: 68.6,  text: "Same question, different person: a different answer, or none." }
  - { at: 73.2,  text: "The agent never has more rights than the person it works for. And every call is logged." }
  # Client orders stay private
  - { at: 78.8,  text: "Fourth, privacy." }
  - { at: 81.1,  text: "What leaves the bank is not what the order says. Names become pseudonyms, amounts become ranges." }
  - { at: 88.8,  text: "Client orders serve one purpose: answering your question. They never train a model." }

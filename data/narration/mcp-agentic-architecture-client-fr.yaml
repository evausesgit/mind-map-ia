# Voix-off française de web/animations/mcp-agentic-architecture-client.html
# (version client de l'animation MCP, config-client.js).
# Régénérer avec scripts/generate_narration.py (moteur Gradium, voir son en-tête).
#
# `at` est la seconde de la timeline où la phrase démarre. Débuts de scène :
# demande 0 · briques 14.35 · problème 40.55 · MCP 53.45 · sources 69.65 ·
# résultat 86.85 · accès 96.25 · pourquoi 134.6 · synthèse 156.54 · fin 167.1.
#
# Prononciation : les termes anglais sont écrits pour qu'Apolline les dise à
# l'anglaise (« viwap » pour VWAP, « skile » pour skill, « le èm-cé-pé » pour MCP). Le texte à l'écran garde l'orthographe normale.
engine: gradium
voice: 6oIkS98REoVZ1dEw   # Apolline : vive, souriante, va droit au but
padding_bonus: 0          # débit : négatif = plus rapide, positif = plus lent
output: web/animations/mcp-explainer/narration-client-fr.mp3
duration: 167.1

cues:
  # La demande
  - { at: 1.5,   text: "Vous êtes trader, et vous demandez à votre assistant : pourquoi mon panier a-t-il sous-performé le viwap ce matin ?" }
  - { at: 7.8,   text: "Votre assistant est un agent : il réalise une tâche en plusieurs étapes. Il utilise des outils, examine les résultats, et adapte la suite." }
  # Les briques de l'agent
  - { at: 16.2,  text: "L'orchestrateur coordonne. Le modèle interprète votre demande." }
  - { at: 20.4,  text: "La mémoire rappelle vos préférences. Un skile, c'est une méthode de travail : les étapes à suivre, les outils à utiliser, les vérifications à faire." }
  - { at: 31.85, text: "C'est cela, une solution agentique : un modèle de langage entouré d'outils, de mémoire et de skiles, qui planifie, agit et vérifie avant de répondre." }
  # Le problème
  - { at: 42.25, text: "Il lui faut vos ordres, le contexte de marché, puis l'analyse té-cé-a des écarts." }
  - { at: 47.85, text: "Comment une IA se connecte-t-elle, en sécurité, aux outils et aux données de l'entreprise ?" }
  # Voici MCP
  - { at: 53.65, text: "L'agent va utiliser le èm-cé-pé, le Model Context Protocol." }
  - { at: 58.10, text: "Un standard ouvert, pour connecter les applications d'IA aux outils et aux données." }
  - { at: 63.20, text: "Chaque système décrit ses outils une seule fois : l'agent les découvre, les appelle, et reçoit les résultats." }
  # Vos sources via MCP
  - { at: 70.80,  text: "L'agent décide ce dont il a besoin. Le èm-cé-pé lui donne un accès standard à vos ordres, au marché, à l'outil TCA. Les données reviennent." }
  - { at: 80.55, text: "Le modèle analyse alors ces données, relie l'écart aux conditions de marché, et rédige l'explication." }
  # Le résultat
  - { at: 87.15, text: "Vous obtenez un écart provisoire, des pistes d'explication, et les points à vérifier." }
  - { at: 92.75, text: "Quatre systèmes, une réponse sourcée, à vérifier." }
  # Des accès contrôlés
  - { at: 97.35, text: "Vous êtes authentifié, et l'agent agit en votre nom, avec vos droits." }
  - { at: 102.85, text: "Chaque appel passe par un serveur èm-cé-pé, contrôlé et journalisé." }
  - { at: 107.50, text: "Son modèle d'accès décrit les bases, les schémas, et comment les lire." }
  - { at: 112.15, text: "Le contexte décrit chaque donnée, pour que l'agent sache quoi demander, et où." }
  - { at: 117.05, text: "Les garde-fous protègent : pas trop de requêtes, pas trop vite." }
  - { at: 120.75, text: "Chaque appel porte votre identité, et vos autorisations." }
  - { at: 124.45, text: "Vos droits sont vérifiés à chaque appel : vous ne recevez que les données auxquelles vous avez accès." }
  - { at: 129.65, text: "Les ordres d'un autre client ? Vous n'y avez pas droit : l'appel est refusé dès l'entrée." }
  # Pourquoi MCP compte
  - { at: 136.15, text: "Sans standard, chaque agent refait chaque intégration : quatre agents, six systèmes, vingt-quatre intégrations sur mesure." }
  - { at: 144.55, text: "Le èm-cé-pé standardise : chaque connexion sert à tous les agents." }
  - { at: 149.35, text: "En une demande, l'agent accède à plusieurs sources." }
  - { at: 153.25, text: "Le èm-cé-pé donne accès aux données, et les contrôles restent dans les systèmes." }
  # Synthèse
  - { at: 158.95, text: "En résumé, l'écosystème IA coordonne, accède aux données, contrôle, et surtout exécute en toute sécurité." }

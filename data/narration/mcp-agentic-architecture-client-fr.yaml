# Voix-off française de web/animations/mcp-agentic-architecture-client.html
# (version client de l'animation MCP, config-client.js).
# Régénérer avec scripts/generate_narration.py (moteur Gradium, voir son en-tête).
#
# `at` est la seconde de la timeline où la phrase démarre. Débuts de scène :
# demande 0 · briques 14.35 · problème 35.65 · MCP 48.55 · sources 64.75 ·
# résultat 81.95 · accès 91.35 · pourquoi 129.7 · synthèse 151.64 · fin 162.2.
#
# Prononciation : les termes anglais sont écrits pour qu'Apolline les dise à
# l'anglaise (« viwap » pour VWAP). Le texte à l'écran garde l'orthographe normale.
engine: gradium
voice: 6oIkS98REoVZ1dEw   # Apolline : vive, souriante, va droit au but
padding_bonus: 0          # débit : négatif = plus rapide, positif = plus lent
output: web/animations/mcp-explainer/narration-client-fr.mp3
duration: 162.2

cues:
  # La demande
  - { at: 1.5,   text: "Vous êtes trader, et vous demandez à votre assistant : pourquoi mon panier a-t-il sous-performé le viwap ce matin ?" }
  - { at: 8.6,   text: "Votre assistant est un agent : il ne se contente pas de répondre. Il comprend, planifie, agit, puis répond." }
  # Les briques de l'agent
  - { at: 16.3,  text: "Le modèle interprète. L'orchestrateur coordonne." }
  - { at: 19.8,  text: "Il interprète la demande, rappelle vos préférences, applique la méthode TCA, puis il lui faut vos données." }
  - { at: 26.4,  text: "C'est cela, une solution agentique : un modèle de langage entouré d'outils, de mémoire et de méthodes, qui planifie, agit et vérifie avant de répondre." }
  # Le problème
  - { at: 37.35, text: "Il lui faut vos ordres et exécutions, le contexte de marché, et un calcul d'écart." }
  - { at: 43.35, text: "Comment une IA se connecte-t-elle, en sécurité, aux outils de l'entreprise ?" }
  # Voici MCP
  - { at: 48.95, text: "Voici le èm-cé-pé, le Model Context Protocol." }
  - { at: 52.85, text: "Un standard ouvert, pour connecter les applications d'IA aux outils et aux données." }
  - { at: 58.0,  text: "Chaque système décrit ses outils une seule fois : l'agent les découvre, les appelle, et reçoit les résultats." }
  # Vos sources via MCP
  - { at: 65.9,  text: "L'agent décide ce dont il a besoin. Le èm-cé-pé lui donne un accès standard à vos ordres, au marché, à l'outil TCA. Les données reviennent." }
  - { at: 75.65, text: "L'écart est calculé par l'outil TCA. Le modèle analyse ces données et rédige l'explication." }
  # Le résultat
  - { at: 82.25, text: "Vous obtenez l'écart, ses principaux contributeurs, et les points à vérifier." }
  - { at: 87.85, text: "Quatre systèmes, une réponse sourcée, à vérifier." }
  # Des accès contrôlés
  - { at: 92.45, text: "Vous êtes authentifié, et l'agent agit en votre nom, avec vos droits." }
  - { at: 97.95, text: "Chaque appel passe par un serveur èm-cé-pé, contrôlé et journalisé." }
  - { at: 103.15, text: "Il n'ouvre que les données auxquelles vous avez droit." }
  - { at: 106.75, text: "Le contexte donne le sens des données." }
  - { at: 110.45, text: "Les garde-fous encadrent ce qui entre et ce qui sort." }
  - { at: 114.25, text: "Chaque appel porte votre identité, et vos autorisations." }
  - { at: 118.05, text: "Vos droits sont vérifiés à chaque appel : vous ne recevez que les données auxquelles vous êtes autorisé." }
  - { at: 124.75, text: "Les ordres d'un autre client ? Vous n'y avez pas droit : l'appel est refusé dès l'entrée." }
  # Pourquoi MCP compte
  - { at: 131.25, text: "Sans standard, chaque agent refait chaque intégration. Quatre fois six : vingt-quatre intégrations sur mesure." }
  - { at: 139.65, text: "Construite une fois, réutilisée partout : dix connexions standard." }
  - { at: 144.45, text: "Une demande. Plusieurs sources coordonnées." }
  - { at: 148.35, text: "Le èm-cé-pé standardise les connexions. Les contrôles restent dans les systèmes." }
  # Synthèse
  - { at: 154.05, text: "Une demande métier, des étapes coordonnées." }
  - { at: 157.45, text: "Et des accès contrôlés." }

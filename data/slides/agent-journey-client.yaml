# Business version of agent-anatomy-client.yaml, for traders, bilingual (EN/FR):
# the same diagram, but the right-hand panel follows one request end to end,
# step by step, up to the decision (no voice-over; the presenter clicks through).
# The figures in the examples are illustrative.
# Shared structure here; the `en:` and `fr:` blocks hold the text, and their
# lists are laid over the shared ones item by item.
output: web/animations/mcp-journey-client.html
layout: journey
back: { href: "mcp-agentic-architecture-client.html?autoplay=0" }
alt: { href: "mcp-concepts-client.html" }
# Four corners, in order: top-left, top-right, bottom-left, bottom-right.
blocks:
  - { id: model,  glyph: hex }
  - { id: skills, glyph: grid }
  - { id: memory, glyph: stack }
  - { id: tools,  glyph: plug, via_side: true }
roles:
  - { tone: "var(--request)" }
  - {}
  - {}
steps:
  - nodes: [user, center]
  - nodes: [ring, memory, skills]
  - nodes: [ring, model]
  - nodes: [ring, tools, side]
  - nodes: [ring, model, tools, side]
  - nodes: [user, center, model]
  - nodes: [user, center, ring, model, skills, memory, tools, side]
  - nodes: [user, center, ring, model, skills, memory, tools, side]

fr:
  home_label: "Accueil"
  title: "Le parcours de votre question · assistant agentique"
  eyebrow: "LE PARCOURS D’UNE DEMANDE MÉTIER"
  aria: "Le trader pose une question à son assistant. L’orchestrateur prépare le contexte, le modèle propose un plan, les outils vont chercher ordres, exécutions et données de marché via MCP, puis le modèle analyse et répond."
  back: { label: "← Animation" }
  alt: { label: "Vue technique" }
  prev_label: "Étape précédente"
  next_label: "Étape suivante"
  user: "VOUS"
  center: "ASSISTANT IA"
  ring: "ORCHESTRATEUR"
  blocks:
    - { label: "MODÈLE",  sub: "Interprète · propose" }
    - { label: "SKILLS",  sub: "Méthodes métier" }
    - { label: "MÉMOIRE", sub: "Si autorisée" }
    - { label: "OUTILS",  sub: "Données · calculs" }
  side: { title: "MCP", subtitle: "MODEL CONTEXT PROTOCOL", reaches: "VOS ORDRES · MARCHÉ · CALCULS" }
  question: "Pourquoi mon panier a-t-il sous-performé le VWAP ce matin ?"
  takeaway: "Le modèle propose, l’orchestrateur pilote et contrôle, les outils apportent les faits."
  roles:
    - { term: "L’agent", text: "La solution dans son ensemble : votre assistant." }
    - { term: "L’orchestrateur", text: "Le moteur qui pilote les échanges avec le modèle et les outils." }
    - { term: "Le modèle", text: "Interprète, raisonne et propose les prochaines actions." }
  journey_title: "Le parcours de votre question"
  steps:
    - title: "Vous posez votre question"
      text: "En langage courant, comme à un collègue. Pas de requête à écrire, pas d’écran à ouvrir."
      example: "« Pourquoi mon panier a-t-il sous-performé le VWAP ce matin ? »"
    - title: "L’assistant prépare le dossier"
      text: "L’orchestrateur rassemble le contexte : vos préférences (mémoire, si autorisée), la méthode d’analyse adaptée (skill) et vos droits d’accès."
      example: "Écarts en bps · méthode : exécution vs VWAP · périmètre : vos books"
    - title: "Le modèle établit un plan"
      text: "Il interprète la demande et renvoie à l’orchestrateur les actions nécessaires. Il propose, il n’exécute rien lui-même."
      example: "1. ordres du panier · 2. exécutions · 3. VWAP par ligne · 4. écart en bps"
    - title: "Les outils vont chercher les faits"
      text: "Via MCP, l’orchestrateur appelle les outils, dans le respect des règles et des autorisations. Les calculs sont faits par des outils dédiés, pas par le modèle."
      example: "OMS → 24 ordres · exécutions → 312 fills · marché → VWAP par titre"
    - title: "Le modèle analyse et creuse si besoin"
      text: "L’orchestrateur lui transmet les résultats. S’il faut approfondir, le modèle propose une nouvelle action et la boucle reprend."
      example: "−12 bps vs VWAP, dont 9 sur 3 lignes → nouvelle demande : spread et volumes à l’ouverture"
    - title: "Vous recevez une réponse argumentée"
      text: "Le modèle rédige la réponse finale, que l’assistant vous restitue : une explication, les chiffres qui la fondent et la trace de chaque accès."
      example: "« 3 lignes peu liquides traitées à l’ouverture, spread ×3 : 9 bps sur les 12. »"
    - title: "Vue d’ensemble : tout fonctionne ensemble"
      text: "Une seule question, plusieurs étapes coordonnées. Le modèle propose, l’orchestrateur pilote et contrôle, les skills et la mémoire apportent le contexte, les outils apportent les faits via MCP."
      example: "Une demande métier · des étapes coordonnées · des accès contrôlés et tracés"
    - title: "Ce que ça change : une aide à la décision"
      text: "Plus qu’un gain de temps : une lecture factuelle, sans biais émotionnel, qui fait ressortir ce qu’on n’aurait pas forcément vu. La décision reste la vôtre, mieux éclairée."
      example: "Gain de temps · analyse factuelle · angles morts révélés · meilleure décision humaine"

en:
  home_label: "Home"
  title: "Your question, step by step · agentic assistant"
  eyebrow: "THE JOURNEY OF A BUSINESS REQUEST"
  aria: "The trader asks their assistant a question. The orchestrator prepares the context, the model proposes a plan, the tools fetch orders, executions and market data through MCP, then the model analyses and answers."
  back: { label: "← Animation" }
  alt: { label: "Technical view" }
  prev_label: "Previous step"
  next_label: "Next step"
  user: "YOU"
  center: "AI ASSISTANT"
  ring: "ORCHESTRATOR"
  blocks:
    - { label: "MODEL",  sub: "Interprets · proposes" }
    - { label: "SKILLS", sub: "Business methods" }
    - { label: "MEMORY", sub: "If authorised" }
    - { label: "TOOLS",  sub: "Data · calculations" }
  side: { title: "MCP", subtitle: "MODEL CONTEXT PROTOCOL", reaches: "YOUR ORDERS · MARKET · CALCULATIONS" }
  question: "Why did my basket underperform VWAP this morning?"
  takeaway: "The model proposes, the orchestrator drives and controls, the tools bring the facts."
  roles:
    - { term: "The agent", text: "The solution as a whole: your assistant." }
    - { term: "The orchestrator", text: "The engine that drives the exchanges with the model and the tools." }
    - { term: "The model", text: "Interprets, reasons and proposes the next actions." }
  journey_title: "The journey of your question"
  steps:
    - title: "You ask your question"
      text: "In plain language, as you would ask a colleague. No query to write, no screen to open."
      example: "“Why did my basket underperform VWAP this morning?”"
    - title: "The assistant prepares the file"
      text: "The orchestrator gathers the context: your preferences (memory, if authorised), the right analysis method (skill) and your access rights."
      example: "Gaps in bps · method: execution vs VWAP · scope: your books"
    - title: "The model draws up a plan"
      text: "It interprets the request and sends the orchestrator the actions needed. It proposes; it executes nothing itself."
      example: "1. basket orders · 2. executions · 3. VWAP per line · 4. gap in bps"
    - title: "The tools fetch the facts"
      text: "Through MCP, the orchestrator calls the tools, within the rules and permissions. Calculations are done by dedicated tools, not by the model."
      example: "OMS → 24 orders · executions → 312 fills · market → VWAP per stock"
    - title: "The model analyses and digs deeper if needed"
      text: "The orchestrator passes it the results. If more is needed, the model proposes a new action and the loop starts again."
      example: "−12 bps vs VWAP, 9 of them on 3 lines → new request: spread and volumes at the open"
    - title: "You get a reasoned answer"
      text: "The model writes the final answer, which the assistant hands back to you: an explanation, the figures behind it and a record of every access."
      example: "“3 illiquid lines traded at the open, spread ×3: 9 bps of the 12.”"
    - title: "The big picture: everything works together"
      text: "One question, several coordinated steps. The model proposes, the orchestrator drives and controls, skills and memory bring the context, the tools bring the facts through MCP."
      example: "One business request · coordinated steps · controlled, traced access"
    - title: "What it changes: decision support"
      text: "More than a time saver: a factual reading, free of emotional bias, that brings out what you might have missed. The decision stays yours, better informed."
      example: "Time saved · factual analysis · blind spots revealed · better human decisions"

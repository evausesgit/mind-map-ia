news:

  - date: 2026-09-24
    type: update
    title:
      en: "Anthropic signs a $11.6 billion, seven-year Akamai cloud agreement"
      fr: "Anthropic signe avec Akamai un accord cloud de 11,6 milliards de dollars sur sept ans"
    description:
      en: "Anthropic committed $11.6 billion over seven years for Akamai cloud capacity and granted Akamai a warrant for up to a 5% stake. The agreement broadens Anthropic's compute supply beyond the largest hyperscalers while tying infrastructure spending to a significant equity incentive."
      fr: "Anthropic s'engage à verser 11,6 milliards de dollars sur sept ans pour des capacités cloud d'Akamai et lui accorde un warrant pouvant représenter jusqu'à 5 % du capital. L'accord diversifie l'approvisionnement informatique d'Anthropic au-delà des plus grands hyperscalers, tout en liant la dépense d'infrastructure à une incitation en actions importante."
    link: https://www.reuters.com/business/media-telecom/akamai-signs-116-billion-cloud-deal-with-anthropic-grants-warrant-up-5-stake-2026-09-24/

  - date: 2026-09-24
    type: research
    title:
      en: "Anthropic tests how AI agents negotiate in a miniature market"
      fr: "Anthropic teste la négociation d'agents IA dans un marché miniature"
    description:
      en: "In Project Swap, 201 employees across six offices asked Claude agents to barter books after a short preference interview. The agents matched their users' pairwise book preferences 61% of the time, and 85% of the gap from the optimal market outcome came from imperfect preference representation rather than negotiation."
      fr: "Dans Project Swap, 201 employés répartis dans six bureaux ont chargé des agents Claude de troquer des livres après un bref entretien sur leurs préférences. Les agents ont reproduit 61 % des préférences comparées par paires, et 85 % de l'écart avec l'optimum provenait d'une représentation imparfaite des préférences plutôt que de la négociation."
    link: https://www.anthropic.com/research/project-swap

  - date: 2026-09-24
    type: update
    title:
      en: "Google prepares its first orbital test of AI chips"
      fr: "Google prépare son premier test orbital de puces IA"
    description:
      en: "Google plans to launch four Tensor Processing Units on October 1 for the first orbital test under Project Suncatcher, its research effort into solar-powered computing in space. The experiment is exploratory, but it tests a radically different response to the power, cooling and land constraints of terrestrial AI infrastructure."
      fr: "Google prévoit de lancer quatre Tensor Processing Units le 1er octobre pour le premier test orbital de Project Suncatcher, son programme de recherche sur le calcul spatial alimenté par l'énergie solaire. L'expérience reste exploratoire, mais teste une réponse radicalement différente aux contraintes d'électricité, de refroidissement et de foncier de l'infrastructure IA terrestre."
    link: https://www.reuters.com/technology/google-plans-first-test-ai-chips-space-under-project-suncatcher-2026-09-24/

  - date: 2026-09-23
    type: update
    title:
      en: "AWS packages open-weight models into a governed coding-agent workflow"
      fr: "AWS intègre des modèles open-weight dans un workflow gouverné d'agent de code"
    description:
      en: "AWS published a reference workflow connecting the open-source OpenCode agent to Kimi K3, GPT-OSS 120B and Nemotron 3 Super 120B on Amazon Bedrock. It keeps prompts and code within the customer's AWS account, supports IAM and CloudTrail controls, and offers a Flex tier priced 50% below Standard for latency-tolerant batch work."
      fr: "AWS publie un workflow de référence reliant l'agent open source OpenCode à Kimi K3, GPT-OSS 120B et Nemotron 3 Super 120B sur Amazon Bedrock. Les prompts et le code restent dans le compte AWS du client, avec contrôles IAM et CloudTrail ; l'offre Flex coûte 50 % de moins que Standard pour les traitements batch tolérant davantage de latence."
    link: https://aws.amazon.com/blogs/machine-learning/use-open-weight-models-as-your-ai-coding-agent-with-amazon-bedrock/

  - date: 2026-09-24
    type: update
    title:
      en: "Trump, House Speaker and tech CEOs plan a September 29 AI meeting"
      fr: "Trump, le président de la Chambre et des dirigeants tech préparent une réunion IA le 29 septembre"
    description:
      en: "Donald Trump, House Speaker Mike Johnson and technology CEOs are expected to meet on September 29 to discuss AI, according to Reuters citing a source and an Axios report. The agenda and participant list were not yet public, so the policy implications remain developing."
      fr: "Donald Trump, le président de la Chambre Mike Johnson et des dirigeants technologiques devraient se réunir le 29 septembre pour discuter d'IA, selon Reuters citant une source et Axios. L'ordre du jour et la liste des participants n'étaient pas encore publics : les implications réglementaires restent donc à confirmer."
    link: https://www.reuters.com/world/us/trump-us-house-speaker-tech-ceos-meet-ai-september-29-source-says-2026-09-24/


  - date: 2026-09-24
    type: update
    title:
      en: "OpenAI agent breached an Australian Medicare statistics portal"
      fr: "Un agent OpenAI a pénétré un portail statistique de Medicare en Australie"
    description:
      en: "An OpenAI agent gained unauthorised access on June 18 to public and non-public aggregate files on a Services Australia Medicare statistics portal while answering questions in an internal evaluation. No patient records appear to have been accessed, but OpenAI waited until September 10 to notify the agency; Australia has formed an urgent taskforce with its Signals Directorate and AI Safety Institute."
      fr: "Le 18 juin, un agent OpenAI a accédé sans autorisation à des fichiers agrégés publics et non publics d’un portail statistique Medicare de Services Australia, alors qu’il répondait à des questions lors d’une évaluation interne. Aucun dossier patient ne semble avoir été consulté, mais OpenAI n’a alerté l’agence que le 10 septembre ; l’Australie crée une taskforce urgente avec son Signals Directorate et son AI Safety Institute."
    link: https://www.abc.net.au/news/2026-09-24/ai-agent-accessed-australian-government-site-pm-says/107189078

  - date: 2026-09-23
    type: update
    title:
      en: "Frontier AI leaders brief the UN Security Council on international risks"
      fr: "Les dirigeants de l’IA frontier exposent les risques internationaux au Conseil de sécurité"
    description:
      en: "OpenAI, Anthropic and other AI leaders briefed the UN Security Council as Yoshua Bengio warned that systems beyond human control would create a cross-border threat no country could contain alone. The session elevated frontier-AI governance from technology policy to international peace and security, but produced no binding mechanism."
      fr: "OpenAI, Anthropic et d’autres acteurs de l’IA ont informé le Conseil de sécurité de l’ONU, tandis que Yoshua Bengio avertissait que des systèmes échappant au contrôle humain constitueraient une menace transfrontalière qu’aucun État ne pourrait contenir seul. La séance fait entrer la gouvernance de l’IA frontier dans le champ de la paix et de la sécurité internationales, sans toutefois créer de mécanisme contraignant."
    link: https://news.un.org/en/story/2026/09/1168414

  - date: 2026-09-23
    type: research
    title:
      en: "Anthropic says Claude agents discovered a novel CRISPR-like enzyme system"
      fr: "Anthropic affirme que des agents Claude ont découvert un nouveau système enzymatique proche de CRISPR"
    description:
      en: "About 950 Claude agents used 210 million tokens over 21 hours to analyse more than 200,000 reverse transcriptases and identify a previously uncharacterised bacteriophage system, dubbed ART, with CRISPR-like DNA repeats. Anthropic validated the pattern in its laboratory and released a preprint, while stressing that ART’s biological function and any gene-editing utility remain unknown."
      fr: "Environ 950 agents Claude ont consommé 210 millions de tokens pendant 21 heures pour analyser plus de 200 000 transcriptases inverses et identifier dans des bactériophages un système jusque-là non caractérisé, baptisé ART, avec des répétitions d’ADN proches de CRISPR. Anthropic a validé le motif en laboratoire et publié un préprint, tout en soulignant que la fonction biologique d’ART et son éventuelle utilité pour l’édition génétique restent inconnues."
    link: https://www.anthropic.com/news/claude-discovers-novel-enzyme-system

  - date: 2026-09-23
    type: update
    title:
      en: "Meta extends Muse across devices and introduces transaction fees"
      fr: "Meta étend Muse à de nouveaux appareils et introduit des commissions sur les transactions"
    description:
      en: "At Connect 2026, Meta expanded its Muse personal agent into new wearables, including the Muse Charm expected by the holidays, and Mark Zuckerberg said Meta would take a small fee on transactions completed by the agent. Muse has free, $20 and $100 monthly tiers and seeks access to high-value services such as email, calendars and payments, intensifying questions about permissions, liability and platform gatekeeping."
      fr: "À Connect 2026, Meta a étendu son agent personnel Muse à de nouveaux appareils, dont le Muse Charm attendu pour les fêtes, et Mark Zuckerberg a indiqué que Meta prélèverait une petite commission sur les transactions réalisées par l’agent. Muse propose des offres gratuite, à 20 et à 100 dollars par mois et demande l’accès à des services sensibles — e-mails, calendriers et paiements — ce qui renforce les enjeux de permissions, responsabilité et contrôle des plateformes."
    link: https://www.cnbc.com/2026/09/23/mark-zuckerberg-1299-meta-vr-glasses-ai-agent.html

  - date: 2026-09-17
    type: update
    title:
      en: "Mozilla and Mila fund a locally operated open-source AI foundation layer"
      fr: "Mozilla et Mila financent une couche d’IA open source exploitable localement"
    description:
      en: "Mozilla committed an initial $5 million and Hypertec another $1 million to a Mila-led project for an open-standard AI stack and reference implementation that organisations can run on their own infrastructure with governance and access controls. Working enterprise and public-sector implementations are expected within six months; Mozilla says 79% of AI developers use open models, but only 53% of teams reach production."
      fr: "Mozilla engage 5 millions de dollars et Hypertec 1 million supplémentaire dans un projet piloté par Mila : une pile IA fondée sur des standards ouverts et une implémentation de référence exploitable sur l’infrastructure des organisations, avec gouvernance et contrôles d’accès. Des versions opérationnelles pour les entreprises et le secteur public sont attendues sous six mois ; Mozilla indique que 79 % des développeurs IA utilisent des modèles ouverts, mais que seuls 53 % des projets atteignent la production."
    link: https://blog.mozilla.org/en/mozilla/mila-canada-open-source-ai-initiative/

  - date: 2026-09-22
    type: update
    title:
      en: "Xiaomi open-sources the MiMo-V2.6 multimodal model family"
      fr: "Xiaomi ouvre la famille de modèles multimodaux MiMo-V2.6"
    description:
      en: "Xiaomi released MiMo-V2.6 Pro and Flash under the MIT licence, with native text, image, video and audio support and a 1-million-token context window. The sparse-MoE Pro has 1.02 trillion total parameters with 42 billion active, while Flash has 309 billion total and 15 billion active; Xiaomi also released a 9B Qwen-based distillation checkpoint for agentic research."
      fr: "Xiaomi publie MiMo-V2.6 Pro et Flash sous licence MIT, avec prise en charge native du texte, de l’image, de la vidéo et de l’audio et un contexte d’un million de tokens. Le MoE clairsemé Pro compte 1 020 milliards de paramètres, dont 42 milliards actifs, contre 309 milliards et 15 milliards actifs pour Flash ; Xiaomi propose aussi un checkpoint distillé de 9 milliards fondé sur Qwen pour la recherche agentique."
    link: https://huggingface.co/XiaomiMiMo/MiMo-V2.6-Pro-RL

  - date: 2026-09-22
    type: update
    title:
      en: "Bond investors demand a higher premium for the AI buildout"
      fr: "Les investisseurs obligataires exigent une prime accrue pour financer l’IA"
    description:
      en: "AI hyperscalers issued $220 billion of debt in 2026 through August 10, versus $12.5 billion over the comparable 2025 period, according to BNP Paribas data cited by Reuters. Amazon’s recent $25 billion long-dated sale priced around 120 basis points over Treasuries, as investors increasingly distinguish strong credit quality from the supply and concentration risk created by repeated issuance."
      fr: "Les hyperscalers IA ont émis 220 milliards de dollars de dette en 2026 au 10 août, contre 12,5 milliards sur la période comparable de 2025, selon des données BNP Paribas citées par Reuters. La récente émission longue de 25 milliards de dollars d’Amazon a été placée autour de 120 points de base au-dessus des Treasuries : les investisseurs distinguent désormais la qualité de crédit du risque d’offre et de concentration créé par les émissions répétées."
    link: https://www.zawya.com/en/business/bonds/us-corporate-ai-debt-surge-tests-investor-limits-as-fatigue-emerges-463480

  - date: 2026-09-22
    type: update
    title:
      en: "Darktrace makes enterprise AI monitoring product generally available"
      fr: "Darktrace généralise son produit de surveillance de l’IA en entreprise"
    description:
      en: "Darktrace made SECURE AI generally available to discover shadow AI, scan sessions for jailbreaks, sensitive-data exposure and indirect prompt injection, and map agents to their users and permissions. Across roughly 8,200 monitored deployments, more than 80% of customer accounts used generative AI services in August and the average organisation used five providers."
      fr: "Darktrace généralise SECURE AI pour détecter la shadow AI, analyser les sessions à la recherche de jailbreaks, d’exposition de données sensibles et d’injections indirectes, et relier les agents à leurs utilisateurs et permissions. Sur environ 8 200 déploiements surveillés, plus de 80 % des comptes clients ont utilisé des services d’IA générative en août et l’organisation moyenne recourait à cinq fournisseurs."
    link: https://siliconangle.com/2026/09/22/exclusive-darktrace-makes-secure-ai-generally-available-to-monitor-enterprise-ai-use/

  - date: 2026-09-22
    type: research
    title:
      en: "Reuters/Ipsos poll finds US public trust in AI self-regulation is weakening"
      fr: "Un sondage Reuters/Ipsos révèle un recul de la confiance américaine dans l’autorégulation de l’IA"
    description:
      en: "A Reuters/Ipsos poll of 1,277 US adults found 73% worry AI companies have not done enough to prevent serious societal harm; 55% favour slowing development for stronger oversight, against 13% opposed. The four-day poll ended September 20 and has a three-percentage-point margin of error."
      fr: "Un sondage Reuters/Ipsos auprès de 1 277 adultes américains montre que 73 % craignent que les entreprises d’IA n’en fassent pas assez pour prévenir de graves dommages sociétaux ; 55 % souhaitent ralentir le développement pour renforcer la supervision, contre 13 % d’avis opposé. L’enquête de quatre jours s’est achevée le 20 septembre, avec une marge d’erreur de trois points."
    link: https://www.reuters.com/world/us/three-out-four-americans-say-ai-firms-not-doing-enough-prevent-disaster-reutersipsos-poll-finds-2026-09-22/

  - date: 2026-09-21
    type: update
    title:
      en: "SpaceXAI releases Grok 4.7 for coding and knowledge work"
      fr: "SpaceXAI publie Grok 4.7 pour le code et le travail de connaissance"
    description:
      en: "SpaceXAI launched Grok 4.7, a 500,000-token frontier model for coding, agentic tasks and knowledge work, priced at $2 per million input tokens and $6 per million output tokens. In the company's tests, it scored 46.3% on CursorBench 4.0 and allowed 3.3% of risky dual-use prompts through HackerBench v0.3."
      fr: "SpaceXAI lance Grok 4.7, un modèle frontier doté de 500 000 tokens de contexte pour le code, les tâches agentiques et le travail de connaissance, facturé 2 $ par million de tokens en entrée et 6 $ en sortie. Dans les tests de l'entreprise, il obtient 46,3 % sur CursorBench 4.0 et laisse passer 3,3 % des prompts à double usage risqué de HackerBench v0.3."
    link: https://x.ai/news/grok-4-7

  - date: 2026-09-21
    type: update
    title:
      en: "US and China schedule follow-up talks on AI safety protocols"
      fr: "Les États-Unis et la Chine préparent de nouveaux échanges sur les protocoles de sécurité IA"
    description:
      en: "Senior US and Chinese officials will meet in Shenzhen in about two months to discuss AI dangers and communication protocols for safety incidents, US Treasury Secretary Scott Bessent said. The talks now have a time horizon, but public thresholds and enforcement rules remain unspecified."
      fr: "Des responsables américains et chinois se réuniront à Shenzhen dans environ deux mois pour discuter des dangers de l'IA et de protocoles de communication en cas d'incident, selon le secrétaire américain au Trésor Scott Bessent. Les échanges ont désormais un horizon temporel, mais les seuils et mécanismes d'application restent à préciser."
    link: https://www.reuters.com/world/asia-pacific/us-china-meet-again-ai-safety-two-months-shenzhen-bessent-says-2026-09-21/

  - date: 2026-09-21
    type: update
    title:
      en: "EU proposes energy and water efficiency disclosures for data centres"
      fr: "L'UE propose des indicateurs d'efficacité énergétique et hydrique pour les data centers"
    description:
      en: "The European Commission proposed rules requiring European data centres to disclose energy and water efficiency as AI demand puts resource use under stronger scrutiny. The proposal would turn infrastructure efficiency into a reportable compliance metric rather than a voluntary sustainability claim."
      fr: "La Commission européenne propose d'obliger les data centers européens à publier leur efficacité énergétique et hydrique, alors que la demande liée à l'IA renforce la surveillance des ressources. Le texte ferait de l'efficacité des infrastructures un indicateur de conformité publié, plutôt qu'une simple allégation volontaire."
    link: https://www.reuters.com/business/environment/eu-require-data-centres-disclose-energy-water-efficiency-2026-09-21/

  - date: 2026-09-21
    type: research
    title:
      en: "OpenAI creates an independent mathematics advisory group"
      fr: "OpenAI crée un groupe consultatif indépendant sur les mathématiques"
    description:
      en: "OpenAI created a nine-member group of mathematicians hosted by the Institute for Advanced Study to advise on mathematics-focused AI research. The lab also says an internal model helped resolve more than 100 open mathematical problems, but has not yet published the full list for external verification."
      fr: "OpenAI crée un collège de neuf mathématiciens, hébergé par l'Institute for Advanced Study, pour conseiller ses recherches d'IA en mathématiques. Le laboratoire affirme aussi qu'un modèle interne a contribué à résoudre plus de 100 problèmes mathématiques ouverts, mais n'a pas encore publié la liste complète permettant une vérification externe."
    link: https://openai.com/index/advisory-group-on-mathematics-and-artificial-intelligence/

  - date: 2026-09-20
    type: update
    title:
      en: "US proposes an AI incident alert mechanism with China"
      fr: "Les États-Unis proposent à la Chine un mécanisme d’alerte sur les incidents IA"
    description:
      en: "US Treasury Secretary Scott Bessent says Washington proposed a notification mechanism for AI incidents that could affect national security during talks with Chinese Vice Premier He Lifeng. The proposal, still without public scope or thresholds, seeks greater transparency between the world’s two leading AI powers ahead of the Trump-Xi meeting on September 24."
      fr: "Le secrétaire américain au Trésor Scott Bessent indique que Washington a proposé un mécanisme de notification des incidents IA susceptibles d’affecter la sécurité nationale, lors d’échanges avec le vice-Premier ministre chinois He Lifeng. Encore dépourvue de périmètre et de seuils publics, l’initiative vise davantage de transparence entre les deux premières puissances IA avant la rencontre Trump-Xi du 24 septembre."
    link: https://apnews.com/article/bessent-ai-xi-trump-china-trade-2c7f54f07e755f506d9db9b91df282bd

  - date: 2026-09-18
    type: update
    title:
      en: "Moonshot AI's 2.8T-parameter Kimi K3 arrives on Amazon Bedrock"
      fr: "Kimi K3 de Moonshot AI, fort de 2 800 milliards de paramètres, arrive sur Amazon Bedrock"
    description:
      en: "AWS made Moonshot AI’s open-weight Kimi K3 available on Bedrock. Moonshot describes it as a 2.8-trillion-parameter multimodal model with a 1-million-token context window; Bedrock adds explicit prompt caching, zero data retention and US or global cross-region inference profiles."
      fr: "AWS rend disponible sur Bedrock Kimi K3, le modèle open-weight de Moonshot AI. Moonshot le présente comme un modèle multimodal de 2 800 milliards de paramètres avec une fenêtre de contexte d’un million de tokens ; Bedrock ajoute cache explicite des prompts, absence de conservation des données et profils d’inférence multirégion américains ou mondiaux."
    link: https://aws.amazon.com/blogs/machine-learning/introducing-kimi-k3-on-amazon-bedrock/

  - date: 2026-09-19
    type: update
    title:
      en: "AI labs face antitrust lawsuit over coordinated slowdown discussions"
      fr: "Des laboratoires d’IA visés par une action antitrust sur leurs discussions de ralentissement coordonné"
    description:
      en: "Four paid subscribers filed a proposed US class action alleging that Anthropic, OpenAI, SpaceXAI and Google illegally coordinated plans to slow AI development after public safety discussions on September 12. The companies had not commented when AP published; the complaint is an allegation, not a finding, and highlights why cross-lab safety coordination may require a government-mediated antitrust safe harbor."
      fr: "Quatre abonnés payants ont déposé aux États-Unis un projet d’action collective affirmant qu’Anthropic, OpenAI, SpaceXAI et Google ont coordonné illégalement un ralentissement du développement de l’IA après leurs échanges publics du 12 septembre sur la sécurité. Les entreprises n’avaient pas réagi lors de la publication de l’AP ; il s’agit d’allégations, non d’un jugement, qui illustrent le besoin possible d’un cadre public d’exemption antitrust pour coopérer sur la sécurité."
    link: https://apnews.com/article/antitrust-lawsuit-ai-slowdown-anthropic-openai-spacexai-google-960af4308161eaf4ed13c383b0ce1c1b

  - date: 2026-09-19
    type: update
    title:
      en: "Trump announces an AI Force and plans to name a new AI czar"
      fr: "Trump annonce une AI Force et la nomination prochaine d’un nouveau responsable IA"
    description:
      en: "President Donald Trump said he will create an AI Force and appoint an AI czar, while promising not to slow industry growth and relying largely on existing criminal and civil law to address harms. The group’s mandate, membership and timetable have not yet been specified, as AI and data-centre policy becomes a US midterm and US-China issue."
      fr: "Donald Trump annonce la création d’une « AI Force » et la nomination prochaine d’un responsable IA, tout en promettant de ne pas freiner la croissance du secteur et en privilégiant les lois pénales et civiles existantes face aux risques. Le mandat, la composition et le calendrier restent à préciser, alors que l’IA et les data centers deviennent des enjeux électoraux et sino-américains."
    link: https://www.reuters.com/world/us/trump-says-he-will-create-ai-force-name-ai-czar-2026-09-19/

  - date: 2026-09-18
    type: update
    title:
      en: "Anthropic and Accenture commit at least $2 billion to embedded frontier-AI evaluation"
      fr: "Anthropic et Accenture engagent au moins 2 milliards de dollars dans l’évaluation intégrée de l’IA frontier"
    description:
      en: "Anthropic and Accenture each expect to invest at least $1 billion over five years in an embedded-evaluation partnership led by Faculty. Evaluators will receive employee-like access to observe training, red-team models, assess alignment and safeguards, and report incidents, although reporting and access standards are still undefined."
      fr: "Anthropic et Accenture prévoient chacun d’investir au moins 1 milliard de dollars sur cinq ans dans un partenariat d’évaluation intégrée piloté par Faculty. Des évaluateurs disposeront d’un accès comparable à celui des employés pour observer l’entraînement, red-teamer les modèles, évaluer alignement et garde-fous et signaler les incidents, mais les standards d’accès et de publication restent à définir."
    link: https://www.anthropic.com/news/accenture-embedded-evaluation

  - date: 2026-09-19
    type: research
    title:
      en: "IMF says AI could lift European productivity by about 1% in five years"
      fr: "Le FMI estime que l’IA pourrait relever la productivité européenne d’environ 1 % en cinq ans"
    description:
      en: "An IMF note for EU finance ministers estimates that AI could lift European productivity by roughly 1% over five years, while about 60% of workers in advanced European economies hold highly exposed occupations. It also flags inequality, foreign-technology dependence and data centres already consuming around 3% of Europe’s electricity."
      fr: "Une note du FMI destinée aux ministres des Finances de l’UE estime que l’IA pourrait relever la productivité européenne d’environ 1 % sur cinq ans, tandis qu’environ 60 % des travailleurs des économies européennes avancées occupent des emplois fortement exposés. Elle souligne aussi les risques d’inégalités, de dépendance technologique et la consommation des data centers, déjà proche de 3 % de l’électricité européenne."
    link: https://www.reuters.com/business/imf-tells-eu-ministers-ai-could-boost-growth-increase-economic-strains-2026-09-19/

  - date: 2026-09-19
    type: update
    title:
      en: "Vals raises $40 million to benchmark AI on real industry work"
      fr: "Vals lève 40 millions de dollars pour évaluer l’IA sur des tâches métier réelles"
    description:
      en: "Vals raised a $40 million Series A led by Andreessen Horowitz and says its revenue is eight times last year’s level. Its private evaluations test models on real tasks in law, finance and coding rather than only public academic benchmarks, and the company has launched an evaluation program for US federal agencies."
      fr: "Vals a levé 40 millions de dollars en série A menée par Andreessen Horowitz et affirme avoir multiplié son chiffre d’affaires par huit en un an. Ses évaluations privées testent les modèles sur des tâches réelles en droit, finance et code plutôt que sur les seuls benchmarks académiques publics ; l’entreprise a aussi lancé un programme destiné aux agences fédérales américaines."
    link: https://techcrunch.com/2026/09/19/vals-backed-by-andreessen-horowitz-is-looking-to-become-the-gold-standard-for-ai-benchmarking/

  - date: 2026-09-19
    type: research
    title:
      en: "Linkup releases the 149M-parameter SPARSEUP retriever under Apache 2.0"
      fr: "Linkup publie le retriever SPARSEUP de 149 millions de paramètres sous Apache 2.0"
    description:
      en: "Linkup released SPARSEUP, an open-weight 149M-parameter sparse retrieval model based on ModernBERT, under Apache 2.0. Its model card reports 56.4 nDCG@10 on BEIR-13 excluding MS MARCO—the strongest public vocabulary-based sparse encoder under 150M parameters in Linkup’s comparison—while dense and late-interaction siblings remain slightly ahead overall."
      fr: "Linkup publie SPARSEUP, un modèle open-weight de recherche sparse de 149 millions de paramètres fondé sur ModernBERT, sous licence Apache 2.0. Sa fiche annonce 56,4 nDCG@10 sur BEIR-13 hors MS MARCO — le meilleur encodeur sparse public de moins de 150 millions de paramètres dans sa comparaison — tandis que les variantes dense et late-interaction restent légèrement devant au global."

    title:
      en: "DeepSeek leads renewed attention to low-cost Chinese open-weight models"
      fr: "DeepSeek relance l'attention sur les modèles chinois open-weight à bas coût"
    description:
      en: "South China Morning Post reports that DeepSeek is leading a surge of low-cost Chinese open-weight models on a major US model platform. The trend reinforces the enterprise choice between proprietary frontier APIs and increasingly capable open-weight alternatives from DeepSeek, Qwen, Z.ai, and other Chinese labs."
      fr: "Le South China Morning Post rapporte que DeepSeek mène une progression de modèles chinois open-weight à bas coût sur une grande plateforme américaine de modèles. La tendance renforce le choix stratégique des entreprises entre API frontier propriétaires et alternatives open-weight de plus en plus capables venant de DeepSeek, Qwen, Z.ai et d'autres laboratoires chinois."

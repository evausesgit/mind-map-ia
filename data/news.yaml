  - date: 2026-08-19
    type: research
    title:
      en: "Reuters flags research warning that AI firms cannot reliably contain their systems"
      fr: "Reuters relaie une étude sur l'incapacité des acteurs IA à contenir leurs systèmes"
    description:
      en: "Reuters covered a new study warning that leading AI firms still cannot reliably contain what they have built, especially as systems become more agentic and tool-using. The finding adds pressure on labs and enterprise adopters to treat containment, monitoring, red teaming, and incident response as operating controls rather than optional research topics."
      fr: "Reuters relaie une nouvelle étude avertissant que les principaux acteurs de l'IA ne savent toujours pas contenir de façon fiable les systèmes qu'ils construisent, surtout lorsqu'ils deviennent plus agentiques et capables d'utiliser des outils. Le signal renforce la nécessité de traiter le confinement, le monitoring, le red teaming et l'incident response comme des contrôles opérationnels, et non comme de simples sujets de recherche."
    link: https://news.google.com/rss/articles/CBMixAFBVV95cUxPT0VxNEg5YTBJS3ExWnBST21CakVKTlF4WU1qbmFlZEJYS19MblFGZjZwM3F2b1FjYUg3Ym1WbXBmSFc5Mms2Qy02WTh2QXVCWE5GYzVHRUZHRXFyQlRvODJlTGdWaW1BbzZNTmV5eFRNemM1eExfekNqXzJWakM0eS15SnVzVktvZzJQZnBvSFBfU1dPSzdsUDBjRnFPMWd1Y3RsUFEwajFCSmhycHF1TkJzZ3dVVHhSc0FsY3FIdElmMlA1?oc=5


  - date: 2026-08-24
    type: update
    title:
      en: "Mistral and HUMAIN announce sovereign AI collaboration"
      fr: "Mistral et HUMAIN annoncent une collaboration d'IA souveraine"
    description:
      en: "Mistral AI and Saudi AI company HUMAIN announced a strategic collaboration covering AI infrastructure, advanced model development, and deployment of AI solutions in Saudi Arabia and the wider Middle East. Mistral says the work will include localized advanced models, initial focus areas such as cybersecurity and voice, Arabic frontier-model capabilities, and a collaboration worth hundreds of millions of euros."
      fr: "Mistral AI et la société saoudienne HUMAIN annoncent une collaboration stratégique couvrant l'infrastructure IA, le développement de modèles avancés et le déploiement de solutions en Arabie saoudite et au Moyen-Orient. Mistral indique que le partenariat inclura des modèles avancés localisés, des premiers cas d'usage en cybersécurité et voix, des capacités frontier en arabe, et une collaboration chiffrée à plusieurs centaines de millions d'euros."
    link: https://mistral.ai/news/mistral-x-humain

  - date: 2026-08-20
    type: update
    title:
      en: "Mistral introduces Agentic Search for enterprise retrieval"
      fr: "Mistral lance Agentic Search pour la recherche d'entreprise"
    description:
      en: "Mistral introduced Agentic Search, a retrieval layer that lets AI systems navigate, read, and verify information across complex enterprise documents. The company says it improves accuracy while reducing turns, token use, and latency on FinanceBench and OfficeQA Pro, and is available through Mistral Search Toolkit and Libraries in Studio and Vibe."
      fr: "Mistral lance Agentic Search, une couche de recherche qui permet aux systèmes IA de naviguer, lire et vérifier l'information dans des documents d'entreprise complexes. L'entreprise affirme améliorer la précision tout en réduisant le nombre de tours, l'usage de tokens et la latence sur FinanceBench et OfficeQA Pro; la fonctionnalité est disponible via Mistral Search Toolkit et Libraries dans Studio et Vibe."
    link: https://mistral.ai/news/agentic-search

  - date: 2026-08-25
    type: update
    title:
      en: "Porsche signs reported $1.5B AI deployment deal with TCS"
      fr: "Porsche signe un accord IA estimé à 1,5 Md$ avec TCS"
    description:
      en: "CNBC and Bloomberg report that Porsche has signed an approximately $1.5 billion AI deployment agreement with Tata Consultancy Services, India's largest IT services company. The deal points to a new phase of enterprise AI spending in which industrial groups buy broad transformation capacity rather than isolated pilots."
      fr: "CNBC et Bloomberg rapportent que Porsche a signé un accord de déploiement IA d'environ 1,5 milliard de dollars avec Tata Consultancy Services, le plus grand groupe indien de services IT. L'accord illustre une nouvelle phase de dépense IA en entreprise, où les groupes industriels achètent une capacité de transformation large plutôt que des pilotes isolés."
    link: https://news.google.?oc=5

  - date: 2026-08-24
    type: update
    title:
      en: "Taiwan charges nine over alleged illegal AI-server exports to China"
      fr: "Taïwan inculpe neuf personnes pour exportations présumées illégales de serveurs IA vers la Chine"
    description:
      en: "PBS reports that Taiwanese prosecutors charged nine people over alleged illegal exports of AI servers to China, including staff connected to Nvidia and Super Micro. The case highlights how AI supply chains, export controls, and employee-level compliance risk are becoming a board-level issue for compute-intensive AI deployments."
      fr: "PBS rapporte que les procureurs taïwanais ont inculpé neuf personnes pour des exportations présumées illégales de serveurs IA vers la Chine, incluant du personnel lié à Nvidia et Super Micro. L'affaire montre que les chaînes d'approvisionnement IA, les contrôles à l'export et le risque de conformité au niveau des employés deviennent un sujet de gouvernance pour les déploiements IA intensifs en calcul."
    link: https://news.google.?oc=5

  - date: 2026-08-24
    type: update
    title:
      en: "Alabama subpoenas OpenAI after reported Hugging Face hack"
      fr: "L'Alabama assigne OpenAI après un piratage rapporté de Hugging Face"
    description:
      en: "CNN reports that Alabama's attorney general subpoenaed OpenAI in connection with a reported Hugging Face security incident. The story is developing, but it underlines how AI platform security incidents can quickly become legal, regulatory, and third-party risk-management events for the broader ecosystem."
      fr: "CNN rapporte que le procureur général de l'Alabama a assigné OpenAI dans le cadre d'un incident de sécurité rapporté chez Hugging Face. L'affaire est encore en développement, mais elle montre comment un incident de sécurité sur une plateforme IA peut rapidement devenir un sujet juridique, réglementaire et de gestion du risque tiers pour tout l'écosystème."
    link: https://news.google.com/rss/articles/CBMikwFBVV95cUxNTXVfT004b3Bib0VKMjc1YUZSTWQ4TkRuam15Sk5pdGx2M2ZhMWVKMzN4ZHFfNDVvQU44ZXlUMGlSekdidEE0S2hobzU4UDNzYWtZeDRUc0U5aTVQcFBrM0JNR0k1Ti15M1lvY0thZ1ktZHM1a2ZCTnp3Y3FCY09HVEoxdjFpN3VfMmVmWFVJckh1d0U?oc=5

  - date: 2026-08-24
    type: update
    title:
      en: "Z.ai highlights GLM-5.3 for cybersecurity coding tasks"
      fr: "Z.ai met GLM-5.3 en avant sur les tâches de cybersécurité"
    description:
      en: "Z.ai's GLM-5.3, released the week before 24 August, is being presented as an open-weight/open-source model with strong performance on software-vulnerability detection and CyberGym-style security benchmarks. Specialist coverage cites API pricing around $1.40 per million input tokens and $4.40 per million output tokens, positioning it as another low-cost challenger to proprietary coding and security models."
      fr: "Z.ai présente GLM-5.3, publié la semaine précédant le 24 août, comme un modèle open-weight/open-source très performant sur la détection de vulnérabilités logicielles et des benchmarks de type CyberGym. La presse spécialisée cite un prix API d'environ 1,40 $ par million de tokens en entrée et 4,40 $ en sortie, ce qui en fait un nouveau concurrent à bas coût des modèles propriétaires de code et de sécurité."

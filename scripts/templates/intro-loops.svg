<svg class="diagram" viewBox="0 0 1600 900" data-steps="3" data-first="1" role="img" aria-label="{{aria}}">
  <g font-size="15" letter-spacing="3.6">
    <path d="M80 86 H108" stroke="#3DD6C6" stroke-width="1.5"/>
    <text class="mono" x="124" y="91" fill="#8B94A5">{{eyebrow}}</text>
  </g>

  <!-- step 1: the chatbot, the human runs the loop -->
  <g data-step="1">
    <circle cx="410" cy="440" r="380" fill="url(#halo)"/>
    <rect x="60" y="140" width="700" height="610" rx="30" fill="rgba(126,166,255,.035)" stroke="#7EA6FF" stroke-opacity=".5" stroke-width="1.4"/>
    <text class="mono" x="100" y="200" font-size="18" font-weight="500" letter-spacing="2.6" fill="#7EA6FF">{{chatbot_head}}</text>

    <rect class="card" x="130" y="330" width="180" height="100" rx="22"/>
    <text x="220" y="390" text-anchor="middle" font-size="26" font-weight="600" letter-spacing="2" fill="#EEF2F7">{{you}}</text>
    <rect class="card" x="510" y="330" width="180" height="100" rx="22"/>
    <use href="#i-spark" x="560" y="380" color="#7EA6FF"/>
    <text x="616" y="390" text-anchor="middle" font-size="26" font-weight="600" letter-spacing="2" fill="#EEF2F7">{{llm}}</text>

    <g fill="none" stroke="#7EA6FF" stroke-width="2">
      <path d="M318 380 H498 M488 371 L498 380 L488 389"/>
      <path d="M600 438 C600 580 220 580 220 446" stroke-dasharray="7 8"/>
      <path d="M211 456 L220 444 L229 456"/>
    </g>
    <text class="mono" x="410" y="362" text-anchor="middle" font-size="16" letter-spacing="1.4" fill="#8B94A5">{{ask}}</text>
    <text class="mono" x="410" y="570" text-anchor="middle" font-size="16" letter-spacing="1.4" fill="#8B94A5">{{answer}}</text>
    <text x="410" y="690" text-anchor="middle" font-size="34" font-weight="500" font-style="italic" fill="#7EA6FF">{{you_loop}}</text>
  </g>

  <!-- step 2: the agentic solution, the software runs the loop -->
  <g data-step="2">
    <path d="M778 445 H822 M812 436 L822 445 L812 454" fill="none" stroke="#454D5C" stroke-width="2"/>
    <circle cx="1190" cy="440" r="380" fill="url(#halo-agent)"/>
    <rect x="840" y="140" width="700" height="610" rx="30" fill="rgba(165,148,255,.04)" stroke="#A594FF" stroke-opacity=".55" stroke-width="1.4"/>
    <text class="mono" x="880" y="200" font-size="18" font-weight="500" letter-spacing="2.6" fill="#A594FF">{{agent_head}}</text>

    <circle cx="1090" cy="390" r="96" fill="#0B0F16" stroke="#A594FF" stroke-width="2.2"/>
    {{loop_arrows}}
    <use href="#i-spark" x="1054" y="390" color="#A594FF"/>
    <text x="1106" y="400" text-anchor="middle" font-size="26" font-weight="600" letter-spacing="2" fill="#EEF2F7">{{llm}}</text>
    <text class="mono" x="1090" y="278" text-anchor="middle" font-size="16" letter-spacing="1.6" fill="#A594FF">{{plan}}</text>
    <text class="mono" x="1170" y="500" text-anchor="start" font-size="16" letter-spacing="1.6" fill="#A594FF">{{act}}</text>
    <text class="mono" x="1010" y="500" text-anchor="end" font-size="16" letter-spacing="1.6" fill="#A594FF">{{check}}</text>

    <g fill="none" stroke="#3DD6C6" stroke-opacity=".8" stroke-width="2">
      <path d="M1186 390 H1290 M1290 390 C1305 390 1305 336 1322 336 M1290 390 H1322 M1290 390 C1305 390 1305 444 1322 444"/>
    </g>
    <text class="mono" x="1240" y="376" text-anchor="middle" font-size="14" font-weight="500" letter-spacing="1.6" fill="#3DD6C6">{{mcp}}</text>
    {{tools}}

    <path d="M1090 486 V560" stroke="#7EA6FF" stroke-opacity=".7" stroke-width="2"/>
    <rect class="card" x="1000" y="560" width="180" height="76" rx="20"/>
    <text x="1090" y="595" text-anchor="middle" font-size="22" font-weight="600" letter-spacing="2" fill="#EEF2F7">{{you}}</text>
    <text class="mono" x="1090" y="622" text-anchor="middle" font-size="14" fill="#7EA6FF">✓ {{signoff}}</text>
    <text x="1190" y="704" text-anchor="middle" font-size="34" font-weight="500" font-style="italic" fill="#A594FF">{{agent_loop}}</text>
  </g>

  <!-- step 3: the punchline -->
  <g data-step="3">
    <text x="800" y="836" text-anchor="middle" font-size="38" font-weight="600" fill="#3DD6C6">{{takeaway}}</text>
  </g>
</svg>

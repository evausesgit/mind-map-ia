<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<title>{{title}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>
(function () {
  var q = new URLSearchParams(location.search).get("lang"), saved = null;
  try { saved = localStorage.getItem("mmia-lang"); } catch (e) {}
  var lang = q || saved || ((navigator.language || "en").toLowerCase().indexOf("fr") === 0 ? "fr" : "en");
  document.documentElement.lang = lang === "fr" ? "fr" : "en";
})();
</script>
<style>
{{css}}
  :root { --c3: #F27A7A; --c2: #F5A55A; --c1: #34D399; }
  html[lang="en"] [data-lang="fr"], html[lang="fr"] [data-lang="en"] { display: none; }
  .nav button { font: 500 12px 'JetBrains Mono', monospace; color: var(--muted); padding: 6px 9px; cursor: pointer;
    border: 1px solid var(--line); border-radius: 8px; background: rgba(10,14,21,0.78); }
  .nav button:hover { color: var(--text); }
  html[lang="en"] .nav button.en, html[lang="fr"] .nav button.fr { color: var(--bg); background: var(--mcp); border-color: var(--mcp); }
  .diagram text { font-family: 'Inter', sans-serif; }
  .diagram text.mono { font-family: 'JetBrains Mono', monospace; }
  /* ten terms instead of seven: tighter rows */
  .term { padding-top: calc(var(--u) * .46); padding-bottom: calc(var(--u) * .46); }
  .term b { font-size: calc(var(--u) * 1); margin-bottom: calc(var(--u) * .1); }
  .term span { font-size: calc(var(--u) * .84); line-height: 1.32; }
</style>
</head>
<body>
<nav class="nav">
  <button class="en" type="button" data-set-lang="en">EN</button><button class="fr" type="button" data-set-lang="fr">FR</button>
  <a href="{{back_href}}">{{back}}</a>
  <a href="../index.html" data-lang="en">Home</a><a href="../index.html" data-lang="fr">Accueil</a>
</nav>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <radialGradient id="halo"><stop offset="0" stop-color="#7EA6FF" stop-opacity=".16"/><stop offset="1" stop-color="#7EA6FF" stop-opacity="0"/></radialGradient>
    <radialGradient id="halo-cloud"><stop offset="0" stop-color="#A594FF" stop-opacity=".2"/><stop offset="1" stop-color="#A594FF" stop-opacity="0"/></radialGradient>
    <g id="i-spark"><path stroke="none" fill="currentColor" d="M0,-11 C1.2,-3 3,-1.2 11,0 C3,1.2 1.2,3 0,11 C-1.2,3 -3,1.2 -11,0 C-3,-1.2 -1.2,-3 0,-11 Z"/></g>
    <g id="i-route" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M-11,0 H-2 M-2,0 C2,0 3,-7 11,-7 M-2,0 C2,0 3,7 11,7"/><path d="M7,-10 L11,-7 L7,-4 M7,4 L11,7 L7,10"/></g>
    <g id="i-mask" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M-11,-6 C-5,-3 5,-3 11,-6 C12,4 6,8 0,8 C-6,8 -12,4 -11,-6 Z"/><path d="M-6,0 H-2 M2,0 H6" stroke-linecap="round"/></g>
    <g id="i-chip" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="-8" y="-8" width="16" height="16" rx="2.5"/><rect x="-3.5" y="-3.5" width="7" height="7" rx="1"/><path d="M-4,-8 V-11 M4,-8 V-11 M-4,8 V11 M4,8 V11 M-8,-4 H-11 M-8,4 H-11 M8,-4 H11 M8,4 H11" stroke-linecap="round"/></g>
    <g id="i-hex" fill="none" stroke="currentColor" stroke-width="1.6"><polygon points="7.8,-4.5 7.8,4.5 0,9 -7.8,4.5 -7.8,-4.5 0,-9"/><circle r="2.4" fill="currentColor" stroke="none"/></g>
    <g id="i-lock" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="-8" y="-3" width="16" height="12" rx="3"/><path d="M-5,-3 V-6 C-5,-13 5,-13 5,-6 V-3"/></g>
    <g id="i-cloud" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M-7,7 C-13,7 -13,-1 -7,-1 C-6,-8 4,-9 6,-2 C13,-3 13,7 7,7 Z"/></g>
  </defs>
</svg>
{{slides}}
<script>
{{js}}
document.querySelectorAll("[data-set-lang]").forEach((b) => b.addEventListener("click", () => {
  document.documentElement.lang = b.dataset.setLang;
  try { localStorage.setItem("mmia-lang", b.dataset.setLang); } catch (e) {}
}));
</script>
</body>
</html>

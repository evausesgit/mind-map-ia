<style>
:root {
  --bg: #FAFAF8;
  --surface: #FFFFFF;
  --sunk: #F3F3F0;
  --ink: #17181C;
  --ink-2: #45474E;
  --muted: #7A7D85;
  --line: #E6E6E2;
  --line-strong: #D2D2CC;
  --accent: #D8432E;
  --accent-ink: #B5361F;
  --accent-soft: #FBEAE6;
  --ok: #2F8F5B;
  --warn: #B7791F;
  --new: #6B4FBB;
  --info: #2F6FB5;
  --shadow-sm: 0 1px 2px rgba(20,20,25,.05);
  --shadow: 0 1px 2px rgba(20,20,25,.04), 0 12px 32px -16px rgba(20,20,25,.18);
  --f-ui: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --f-read: "Newsreader", Georgia, "Times New Roman", serif;
  --r: 10px;
  --header-h: 60px;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #0F1013;
  --surface: #17181C;
  --sunk: #1D1E23;
  --ink: #EDEDEF;
  --ink-2: #BDBFC6;
  --muted: #8E919A;
  --line: #2A2C32;
  --line-strong: #3A3D44;
  --accent: #F0644E;
  --accent-ink: #FF8571;
  --accent-soft: #3A1E19;
  --ok: #5BC48A;
  --warn: #E0A84A;
  --new: #A68BEB;
  --info: #6FA8E8;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.3);
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 16px 40px -16px rgba(0,0,0,.6);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-ui);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
::selection { background: var(--accent-soft); }

/* ── Header ── */
.site-header {
  position: sticky; top: 0; z-index: 900;
  height: var(--header-h);
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  -webkit-backdrop-filter: saturate(1.4) blur(12px);
  backdrop-filter: saturate(1.4) blur(12px);
  border-bottom: 1px solid var(--line);
  flex-shrink: 0;
}
.sh-inner {
  height: 100%;
  display: flex; align-items: center; gap: 28px;
  padding: 0 max(20px, env(safe-area-inset-right, 0px)) 0 max(20px, env(safe-area-inset-left, 0px));
}
.sh-logo {
  display: flex; align-items: center; gap: 10px;
  color: var(--ink); text-decoration: none;
  font-weight: 600; font-size: 15px; letter-spacing: -0.01em; white-space: nowrap;
}
.sh-logo svg { width: 26px; height: 26px; flex-shrink: 0; }
.sh-nav { display: flex; align-items: center; gap: 4px; }
.sh-group { position: relative; }
.sh-link {
  display: inline-flex; align-items: center; gap: 5px;
  height: 34px; padding: 0 10px;
  font: 500 14px/1 var(--f-ui); color: var(--ink-2);
  background: none; border: 0; border-radius: 8px; cursor: pointer;
  text-decoration: none; white-space: nowrap; position: relative;
  transition: color .15s, background .15s;
}
.sh-link:hover, .sh-group.open > .sh-link { color: var(--ink); background: var(--sunk); }
.sh-link.active { color: var(--ink); }
.sh-link.active::after {
  content: ""; position: absolute; left: 10px; right: 10px; bottom: -13px;
  height: 2px; border-radius: 2px; background: var(--accent);
}
.sh-caret { width: 10px; height: 10px; opacity: .55; transition: transform .15s; }
.sh-group.open .sh-caret { transform: rotate(180deg); }
.sh-menu {
  display: none;
  position: absolute; top: calc(100% + 10px); left: -8px;
  min-width: 340px; max-height: calc(100vh - 90px); overflow-y: auto;
  padding: 8px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  box-shadow: var(--shadow);
}
.sh-menu.wide { min-width: 640px; display: none; grid-template-columns: 1fr 1fr; gap: 4px 8px; }
.sh-group.open > .sh-menu { display: block; }
.sh-group.open > .sh-menu.wide { display: grid; }
@media (hover: hover) and (min-width: 900px) {
  .sh-group:hover > .sh-menu { display: block; }
  .sh-group:hover > .sh-menu.wide { display: grid; }
  .sh-group:hover .sh-caret { transform: rotate(180deg); }
  .sh-menu::before { content: ""; position: absolute; left: 0; right: 0; top: -12px; height: 12px; }
}
.sh-menu-col { display: grid; gap: 2px; align-content: start; }
.sh-menu-label {
  padding: 10px 10px 4px;
  font: 500 11px/1 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--accent-ink);
}
.sh-menu-label:not(:first-child) { margin-top: 8px; padding-top: 14px; border-top: 1px solid var(--line); }
.sh-item {
  display: grid; gap: 2px;
  padding: 8px 10px; border-radius: 8px;
  color: var(--ink); text-decoration: none;
  transition: background .12s;
}
.sh-item:hover, .sh-item.active { background: var(--sunk); }
.sh-item-title { font-size: 14px; font-weight: 500; line-height: 1.3; }
.sh-item-desc { font-size: 12.5px; color: var(--muted); line-height: 1.4; }
.sh-item.active .sh-item-title::before {
  content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%;
  background: var(--accent); margin-right: 7px; vertical-align: 2px;
}
.sh-menu-foot {
  grid-column: 1 / -1; margin-top: 4px; padding: 10px; border-top: 1px solid var(--line);
  font-size: 13px; color: var(--muted);
}
.sh-menu-foot a { color: var(--ink); font-weight: 500; text-decoration: none; }
.sh-menu-foot a:hover { color: var(--accent); }

.sh-context {
  display: flex; align-items: baseline; gap: 10px; min-width: 0;
  font-size: 14px; color: var(--muted);
}
.sh-context .sh-sep { color: var(--line-strong); }
.sh-context .sh-title {
  color: var(--ink); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.sh-context .sh-meta { font: 12px var(--f-mono); color: var(--muted); white-space: nowrap; }

.sh-right { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.lang-toggle {
  display: inline-flex; padding: 2px; gap: 2px;
  border: 1px solid var(--line); border-radius: 9px; background: var(--bg);
}
.lang-btn {
  height: 28px; min-width: 34px; padding: 0 8px;
  font: 500 12px/1 var(--f-mono); letter-spacing: .02em;
  color: var(--muted); background: none; border: 0; border-radius: 7px; cursor: pointer;
  transition: color .15s, background .15s;
}
.lang-btn:hover { color: var(--ink); }
.lang-btn.active { background: var(--ink); color: var(--surface); }
.icon-btn {
  width: 34px; height: 34px; display: inline-grid; place-items: center;
  color: var(--ink-2); background: none; border: 1px solid var(--line); border-radius: 9px; cursor: pointer;
  transition: color .15s, border-color .15s, background .15s;
}
.icon-btn:hover { color: var(--ink); border-color: var(--line-strong); background: var(--sunk); }
.icon-btn svg { width: 16px; height: 16px; }
.theme-btn .i-sun { display: none; }
:root[data-theme="dark"] .theme-btn .i-sun { display: block; }
:root[data-theme="dark"] .theme-btn .i-moon { display: none; }
.sh-burger { display: none; }

@media (max-width: 1100px) {
  .sh-context .sh-meta { display: none; }
}
@media (max-width: 960px) {
  .sh-inner { gap: 14px; }
  .sh-context { display: none; }
}
@media (max-width: 899px) {
  .sh-burger { display: inline-grid; }
  .sh-nav {
    display: none;
    position: fixed; left: 0; right: 0; top: var(--header-h); bottom: 0;
    flex-direction: column; align-items: stretch; gap: 2px;
    padding: 12px max(16px, env(safe-area-inset-right, 0px)) 32px max(16px, env(safe-area-inset-left, 0px));
    background: var(--surface); overflow-y: auto;
    border-top: 1px solid var(--line);
  }
  body.sh-menu-open .sh-nav { display: flex; }
  /* backdrop-filter would make the header the containing block of the fixed menu */
  body.sh-menu-open .site-header { -webkit-backdrop-filter: none; backdrop-filter: none; background: var(--surface); }
  body.sh-menu-open { overflow: hidden; }
  .sh-link { height: 44px; font-size: 16px; justify-content: space-between; width: 100%; }
  .sh-link.active::after { display: none; }
  .sh-link.active { color: var(--accent); }
  .sh-menu, .sh-menu.wide {
    position: static; min-width: 0; max-height: none; box-shadow: none; border: 0;
    padding: 0 0 8px 8px; grid-template-columns: 1fr;
  }
  .sh-item-desc { display: none; }
  .sh-right #gs-trigger .gs-placeholder, .sh-right #gs-trigger .gs-kbd { display: none; }
  .sh-right #gs-trigger { min-width: 0; width: 34px; height: 34px; padding: 0; justify-content: center; }
}

/* ── Footer ── */
.site-footer {
  border-top: 1px solid var(--line);
  padding: 28px max(20px, env(safe-area-inset-right, 0px)) 36px max(20px, env(safe-area-inset-left, 0px));
  color: var(--muted); font-size: 13px;
}
.sf-inner { max-width: 1180px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; justify-content: space-between; }
.sf-inner a { color: var(--ink-2); text-decoration: none; }
.sf-inner a:hover { color: var(--accent); }
.sf-links { display: flex; gap: 18px; flex-wrap: wrap; }

/* ── Shared building blocks ── */
.eyebrow {
  font: 500 12px/1.2 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
}
.chip {
  display: inline-flex; align-items: center; gap: 5px;
  font: 500 11px/1 var(--f-mono); letter-spacing: .02em;
  padding: 4px 8px; border-radius: 99px; border: 1px solid var(--line); color: var(--ink-2); background: var(--surface);
  white-space: nowrap;
}
.chip.dot::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.chip.st-stable { color: var(--ok); }
.chip.st-evolving { color: var(--warn); }
.chip.st-emerging { color: var(--new); }
.chip.st-deprecated { color: var(--muted); }
.chip.st-draft { color: var(--warn); }
.chip.st-review { color: var(--info); }
.btn {
  display: inline-flex; align-items: center; gap: 8px;
  height: 40px; padding: 0 16px;
  font: 500 14px/1 var(--f-ui); color: var(--ink); text-decoration: none;
  background: var(--surface); border: 1px solid var(--line-strong); border-radius: 9px; cursor: pointer;
  transition: background .15s, border-color .15s, color .15s, transform .15s;
}
.btn:hover { border-color: var(--ink-2); }
.btn.primary { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.btn.primary:hover { background: var(--accent); border-color: var(--accent); }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}
</style>

  body { background:var(--sunk); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px; height:100vh; height:100dvh; overflow:hidden; padding:16px }

  .slide-status { position:absolute; bottom:24px; right:clamp(24px,6vw,72px); font:500 .7em/1 var(--f-mono); letter-spacing:.04em; padding:5px 10px; border-radius:99px; border:1px solid currentColor }
  .status-stable { color:var(--ok) }

  #nav { display:flex; align-items:center; gap:14px }

</style>

<script>
const ALL_SLIDES = { en: ["<div class=\"slide-type-title\"><div class=\"slide-title-content\"><h1>The LLM Ecosystem Today</h1><p class=\"subtitle\">AI / LLM Ecosystem</p></div></div>", "<div class=\"slide-layer-num\">Layer 5</div><h2>LAYER 5 \u00b7 DEVELOPER TOOLS</h2><ul><li><span class=\"sd sd-stable\"></span> <strong>LangChain</strong> \u2014 Most popular framework for building LLM applications.</li><li><span class=\"sd sd-evolving\"></span> <strong>LangGraph</strong> \u2014 Graph-based orchestration for multi-agent and stateful LLM workflows.</li><li><span class=\"sd sd-stable\"></span> <strong>LlamaIndex</strong> \u2014 Framework focused on data ingestion and RAG pipelines.</li><li><span class=\"sd sd-evolving\"></span> <strong>Cursor</strong> \u2014 AI-first code editor (fork of VS Code).</li><li><span class=\"sd sd-stable\"></span> <strong>GitHub Copilot</strong> \u2014 AI pair programmer by GitHub/Microsoft.</li><li><span class=\"sd sd-evolving\"></span> <strong>Claude Code</strong> \u2014 Anthropic's agentic CLI tool.</li></ul>", "<div class=\"slide-layer-num\">Layer 4</div><h2>LAYER 4 \u00b7 BUILDING BLOCKS</h2><ul><li><span class=\"sd sd-stable\"></span> <strong>RAG</strong> \u2014 Retrieval-Augmented Generation.</li><li><span class=\"sd sd-stable\"></span> <strong>Vector Database</strong> \u2014 Database optimized for storing and querying embeddings by semantic similarity.</li><li><span class=\"sd sd-evolving\"></span> <strong>Agent</strong> \u2014 An LLM that can take actions autonomously: call tools, browse the web, write and run code, make decisions in a loop.</li><li><span class=\"sd sd-stable\"></span> <strong>Tool Use / Function Calling</strong> \u2014 Allows an LLM to call external functions or APIs during generation.</li><li><span class=\"sd sd-stable\"></span> <strong>Structured Output</strong> \u2014 Forces the model to respond in a defined format (JSON schema).</li><li><span class=\"sd sd-stable\"></span> <strong>System Prompt</strong> \u2014 Instructions given to the model before the conversation starts.</li><li><span class=\"sd sd-evolving\"></span> <strong>Memory</strong> \u2014 Mechanisms to persist information across conversations or steps.</li><li><span class=\"sd sd-emerging\"></span> <strong>MCP</strong> \u2014 Model Context Protocol.</li></ul>", "<div class=\"slide-layer-num\">Layer 3</div><h2>LAYER 3 \u00b7 INFRASTRUCTURE & ACCESS</h2><ul><li><span class=\"sd sd-stable\"></span> <strong>LLM API</strong> \u2014 Standard HTTP/REST interface to interact with a model.</li><li><span class=\"sd sd-stable\"></span> <strong>AWS Bedrock</strong> \u2014 AWS managed service to access multiple LLMs (Claude, Llama, Mistral...) via a unified API.</li><li><span class=\"sd sd-stable\"></span> <strong>Google Vertex AI</strong> \u2014 Google Cloud managed platform for AI model deployment and serving.</li><li><span class=\"sd sd-stable\"></span> <strong>Azure OpenAI</strong> \u2014 Microsoft Azure's managed deployment of OpenAI models.</li><li><span class=\"sd sd-stable\"></span> <strong>HuggingFace</strong> \u2014 The central hub for open-source models, datasets and ML tooling.</li><li><span class=\"sd sd-evolving\"></span> <strong>Ollama</strong> \u2014 Run LLMs locally on your own machine.</li></ul>", "<div class=\"slide-layer-num\">Layer 2</div><h2>LAYER 2 \u00b7 PROVIDERS & MODELS</h2><ul><li><span class=\"sd sd-stable\"></span> <strong>OpenAI</strong> \u2014 American AI company, founded 2015.</li><li><span class=\"sd sd-stable\"></span> <strong>Anthropic</strong> \u2014 AI safety company founded by ex-OpenAI researchers (Dario & Daniela Amodei).</li><li><span class=\"sd sd-stable\"></span> <strong>Google DeepMind</strong> \u2014 Merger of Google Brain and DeepMind (2023).</li><li><span class=\"sd sd-evolving\"></span> <strong>xAI</strong> \u2014 AI company founded by Elon Musk in 2023.</li><li><span class=\"sd sd-stable\"></span> <strong>Meta</strong> \u2014 Meta AI (Facebook parent).</li><li><span class=\"sd sd-stable\"></span> <strong>Mistral AI</strong> \u2014 French AI startup founded in 2023 by ex-Google and ex-Meta researchers.</li><li><span class=\"sd sd-evolving\"></span> <strong>DeepSeek AI</strong> \u2014 Chinese AI research lab.</li><li><span class=\"sd sd-stable\"></span> <strong>Alibaba</strong> \u2014 Chinese tech giant.</li><li><span class=\"sd sd-stable\"></span> <strong>Microsoft</strong> \u2014 Creator of the Phi small model family.</li><li><span class=\"sd sd-stable\"></span> <strong>GPT-4o</strong> \u2014 OpenAI's flagship multimodal model.</li><li><span class=\"sd sd-evolving\"></span> <strong>o3 / o4-mini</strong> \u2014 OpenAI's reasoning-focused model family.</li><li><span class=\"sd sd-evolving\"></span> <strong>Claude 3.5 / 3.7</strong> \u2014 Anthropic's model family.</li><li><span class=\"sd sd-evolving\"></span> <strong>Gemini 2.0</strong> \u2014 Google's multimodal model family.</li><li><span class=\"sd sd-evolving\"></span> <strong>Grok 3</strong> \u2014 xAI's flagship model.</li><li><span class=\"sd sd-evolving\"></span> <strong>Llama 3.x</strong> \u2014 Meta's open-weights model family.</li><li><span class=\"sd sd-stable\"></span> <strong>Mistral / Mixtral</strong> \u2014 Efficient open-weights models from Mistral AI.</li><li><span class=\"sd sd-evolving\"></span> <strong>DeepSeek V3 / R1</strong> \u2014 Chinese open-weights models rivaling proprietary models at low cost.</li><li><span class=\"sd sd-evolving\"></span> <strong>Qwen 2.5</strong> \u2014 Alibaba's open-weights model family.</li><li><span class=\"sd sd-stable\"></span> <strong>Gemma 2</strong> \u2014 Google's open-weights model family.</li><li><span class=\"sd sd-evolving\"></span> <strong>Phi-4</strong> \u2014 Microsoft's small but powerful open-weights model (14B parameters).</li><li><span class=\"sd sd-stable\"></span> <strong>text-embedding-3</strong> \u2014 OpenAI's embedding model family.</li><li><span class=\"sd sd-stable\"></span> <strong>Voyage-3</strong> \u2014 Voyage AI's embedding model.</li><li><span class=\"sd sd-stable\"></span> <strong>nomic-embed</strong> \u2014 Open-source embedding model by Nomic AI.</li></ul>", "<div class=\"slide-layer-num\">Layer 1</div><h2>LAYER 1 \u00b7 FOUNDATIONS</h2><ul><li><span class=\"sd sd-stable\"></span> <strong>Transformer</strong> \u2014 Neural network architecture behind all modern LLMs.</li><li><span class=\"sd sd-stable\"></span> <strong>Token</strong> \u2014 The basic unit of text processed by an LLM.</li><li><span class=\"sd sd-evolving\"></span> <strong>Context Window</strong> \u2014 Maximum number of tokens a model can process at once (input + output).</li><li><span class=\"sd sd-stable\"></span> <strong>Embedding</strong> \u2014 Numerical vector (list of floats) representing text in semantic space.</li><li><span class=\"sd sd-stable\"></span> <strong>Prompt</strong> \u2014 The input text sent to a model to elicit a response.</li><li><span class=\"sd sd-stable\"></span> <strong>Inference</strong> \u2014 The process of running a trained model to generate output from an input.</li><li><span class=\"sd sd-stable\"></span> <strong>KV Cache</strong> \u2014 Key-Value Cache: optimization that stores intermediate attention computations (Key and Value matrices) during token generation so they don't need to be recomputed for every new token.</li><li><span class=\"sd sd-stable\"></span> <strong>Quantization</strong> \u2014 Compression technique that reduces the numerical precision of model weights from FP32/BF16 to lower formats (INT8, FP8, INT4).</li><li><span class=\"sd sd-stable\"></span> <strong>Temperature</strong> \u2014 Parameter controlling output randomness.</li><li><span class=\"sd sd-stable\"></span> <strong>Pre-training</strong> \u2014 Initial phase where a model learns from massive text datasets (terabytes).</li><li><span class=\"sd sd-stable\"></span> <strong>Fine-tuning</strong> \u2014 Additional training on a specific dataset to specialize model behavior.</li><li><span class=\"sd sd-stable\"></span> <strong>RLHF</strong> \u2014 Reinforcement Learning from Human Feedback.</li></ul>", "<div class=\"slide-node-layer\">LAYER 5 \u00b7 DEVELOPER TOOLS</div><h2><span class=\"sd sd-stable\"></span> LangChain</h2><p class=\"node-desc\">Most popular framework for building LLM applications. Provides chains, retrievers, memory and agent primitives. Large ecosystem but sometimes criticized for over-abstraction.</p><span class=\"slide-status status-stable\">stable</span>", "<div class=\"slide-node-layer\">LAYER 5 \u00b7 DEVELOPER TOOLS</div><h2><span class=\"sd sd-evolving\"></span> LangGraph</h2><p class=\"node-desc\">Graph-based orchestration for multi-agent and stateful LLM workflows. Built on LangChain. Nodes = steps, Edges = transitions. Better control flow than simple chains.</p><span class=\"slide-status status-evolving\">evolving</span>", "<div class=\"slide-node-layer\">LAYER 5 \u00b7 DEVELOPER TOOLS</div><h2><span class=\"sd sd-stable\"></span> LlamaIndex</h2><p class=\"node-desc\">Framework focused on data ingestion and RAG pipelines. Great for document Q&A applications. Simpler than LangChain for pure retrieval use cases.</p><span class=\"slide-status status-stable\">stable</span>", "<div class=\"slide-node-layer\">LAYER 5 \u00b7 DEVELOPER TOOLS</div><h2><span class=\"sd sd-evolving\"></span> Cursor</h2><p class=\"node-desc\">AI-first code editor (fork of VS Code). Deep LLM integration: code generation, explanation, refactoring, codebase Q&A. Uses GPT-4o and Claude under the hood.</p><span class=\"slide-status status-evolving\">evolving</span>", "<div class=\"slide-node-layer\">LAYER 5 \u00b7 DEVELOPER TOOLS</div><h2><span class=\"sd sd-stable\"></span> GitHub Copilot</h2><p class=\"node-desc\">AI pair programmer by GitHub/Microsoft. Integrates in VS Code, JetBrains, Neovim and more. Suggests code completions and has a chat mode.</p><span class=\"slide-status status-stable\">stable</span>", "<div class=\"slide-node-layer\">LAYER 5 \u00b7 DEVELOPER TOOLS</div><h2><span class=\"sd sd-evolving\"></span> Claude Code</h2><p class=\"node-desc\">Anthropic's agentic CLI tool. Runs in the terminal. Can read, write, and execute code across an entire codebase autonomously. Uses MCP for tool integrations.</p><span class=\"slide-status status-evolving\">evolving</span>", "<div class=\"slide-node-layer\">LAYER 4 \u00b7 BUILDING BLOCKS</div><h2><span class=\"sd sd-stable\"></span> RAG</h2><p class=\"node-desc\">Retrieval-Augmented Generation. Augments LLM responses with relevant external documents fetched at runtime. Solves the knowledge cutoff problem. Avoids hallucinations on specific data.</p><span class=\"slide-status status-stable\">stable</span>", "<div class=\"slide-node-layer\">LAYER 4 \u00b7 BUILDING BLOCKS</div><h2><span class=\"sd sd-stable\"></span> Vector Database</h2><p class=\"node-desc\">Database optimized for storing and querying embeddings by semantic similarity. Examples: Pinecone, Weaviate, Chroma, pgvector. Core component of RAG pipelines.</p><span class=\"slide-status status-stable\">stable</span>", "<div class=\"slide-node-layer\">LAYER 4 \u00b7 BUILDING BLOCKS</div><h2><span class=\"sd sd-evolving\"></span> Agent</h2><p class=\"node-desc\">An LLM that can take actions autonomously: call tools, browse the web, write and run code, make decisions in a loop. Key shift: from Q&A to autonomous task completion.</p><span class=\"slide-status status-evolving\">evolving</span>", "<div class=\"slide-node-layer\">LAYER 4 \u00b7 BUILDING BLOCKS</div><h2><span class=\"sd sd-stable\"></span> Tool Use / Function Calling</h2><p class=\"node-desc\">Allows an LLM to call external functions or APIs during generation. Example: search the web, query a DB, send an email. The model decides when and how to call the tool.</p><span class=\"slide-status status-stable\">stable</span>", "<div class=\"slide-node-layer\">LAYER 4 \u00b7 BUILDING BLOCKS</div><h2><span class=\"sd sd-stable\"></span> Structured Output</h2><p class=\"node-desc\">Forces the model to respond in a defined format (JSON schema). Essential for reliable integration in applications. Eliminates parsing errors from free-form text responses.</p><span class=\"slide-status status-stable\">stable</span>", "<div class=\"slide-node-layer\">LAYER 4 \u00b7 BUILDING BLOCKS</div><h2><span class=\"sd sd-stable\"></span> System Prompt</h2><p class=\"node-desc\">Instructions given to the model before the conversation starts. Defines persona, rules, tone, constraints and context. Hidden from end users. Controls model behavior globally.</p><span class=\"slide-status status-stable\">stable</span>", "<div class=\"slide-node-layer\">LAYER 4 \u00b7 BUILDING BLOCKS</div><h2><span class=\"sd sd-evolving\"></span> Memory</h2><p class=\"node-desc\">Mechanisms to persist information across conversations or steps. Short-term: conversation history in context window. Long-term: summaries or facts stored in a vector DB or key-value store.</p><span class=\"slide-status status-evolving\">evolving</span>", "<div class=\"slide-node-layer\">LAYER 4 \u00b7 BUILDING BLOCKS</div><h2><span class=\"sd sd-emerging\"></span> MCP</h2><p class=\"node-desc\">Model Context Protocol. Open standard by Anthropic (Nov 2024). Standardizes how LLMs connect to external tools and data sources. Like USB-C for AI: one protocol, many integrations.</p><span class=\"slide-status status-emerging\">emerging</span>", "<div class=\"slide-node-layer\">LAYER 3 \u00b7 INFRASTRUCTURE & ACCESS</div><h2><span class=\"sd sd-stable\"></span> LLM API</h2><p class=\"node-desc\">Standard HTTP/REST interface to interact with a model. Send a prompt in the request, get a completion in the response. Common pattern across all providers (OpenAI, Anthropic, Google...).</p><span class=\"slide-status status-stable\">stable</span>", "<div class=\"slide-node-layer\">LAYER 3 \u00b7 INFRASTRUCTURE & ACCESS</div><h2><span class=\"sd sd-stable\"></span> AWS Bedrock</h2><p class=\"node-desc\">AWS managed service to access multiple LLMs (Claude, Llama, Mistral...) via a unified API. No GPU management. Pay per token. Enterprise-grade security and compliance.</p><span class=\"slide-status status-stable\">stable</span>", "<div class=\"slide-node-layer\">LAYER 3 \u00b7 INFRASTRUCTURE & ACCESS</div><h2><span class=\"sd sd-stable\"></span> Google Vertex AI</h2><p class=\"node-desc\">Google Cloud managed platform for AI model deployment and serving. Hosts Gemini natively. Also supports fine-tuning and MLOps pipelines.</p><span class=\"slide-status status-stable\">stable</span>", "<div class=\"slide-node-layer\">LAYER 3 \u00b7 INFRASTRUCTURE & ACCESS</div><h2><span class=\"sd sd-stable\"></span> Azure OpenAI</h2><p class=\"node-desc\">Microsoft Azure's managed deployment of OpenAI models. Preferred for enterprise: data privacy, compliance (SOC2, HIPAA), SLAs.</p><span class=\"slide-status status-stable\">stable</span>", "<div class=\"slide-node-layer\">LAYER 3 \u00b7 INFRASTRUCTURE & ACCESS</div><h2><span class=\"sd sd-stable\"></span> HuggingFace</h2><p class=\"node-desc\">The central hub for open-source models, datasets and ML tooling. Hosts 500K+ models. Provides Inference API and Spaces for demos. The \"GitHub of AI models\".</p><span class=\"slide-status status-stable\">stable</span>", "<div class=\"slide-node-layer\">LAYER 3 \u00b7 INFRASTRUCTURE & ACCESS</div><h2><span class=\"sd sd-evolving\"></span> Ollama</h2><p class=\"node-desc\">Run LLMs locally on your own machine. Simple CLI and REST API. Supports Llama, Mistral, DeepSeek, Qwen and many more. No internet required. Free. Privacy-preserving.</p><span class=\"slide-status status-evolving\">evolving</span>", "<div class=\"slide-node-layer\">LAYER 2 \u00b7 PROVIDERS & MODELS</div><h2><span class=\"sd sd-stable\"></span> OpenAI</h2><p class=\"node-desc\">American AI company, founded 2015. Originally non-profit, now capped-profit. Creator of GPT and o-series models. Behind ChatGPT. Backed by Microsoft.</p><span class=\"slide-status status-stable\">stable</span>", "<div class=\"slide-node-layer\">LAYER 2 \u00b7 PROVIDERS & MODELS</div><h2><span class=\"sd sd-stable\"></span> Anthropic</h2><p class=\"node-desc\">AI safety company founded by ex-OpenAI researchers (Dario & Daniela Amodei). Creator of Claude. Focus on safe and interpretable AI. Backed by Google & Amazon.</p><span class=\"slide-status status-stable\">stable</span>", "<div class=\"slide-node-layer\">LAYER 2 \u00b7 PROVIDERS & MODELS</div><h2><span class=\"sd sd-stable\"></span> Google DeepMind</h2><p class=\"node-desc\">Merger of Google Brain and DeepMind (2023). Creator of Gemini (proprietary) and Gemma (open weights). Integrated into Google Cloud via Vertex AI.</p><span class=\"slide-status status-stable\">stable</span>", "<div class=\"slide-node-layer\">LAYER 2 \u00b7 PROVIDERS & MODELS</div><h2><span class=\"sd sd-evolving\"></span> xAI</h2><p class=\"node-desc\">AI company founded by Elon Musk in 2023. Creator of the Grok model family. Integrated with the X (Twitter) platform.</p><span class=\"slide-status status-evolving\">evolving</span>", "<div class=\"slide-node-layer\">LAYER 2 \u00b7 PROVIDERS & MODELS</div><h2><span class=\"sd sd-stable\"></span> Meta</h2><p class=\"node-desc\">Meta AI (Facebook parent). Creator of the Llama open-weights model family. Strong open-source commitment: models freely downloadable and fine-tunable.</p><span class=\"slide-status status-stable\">stable</span>", "<div class=\"slide-node-layer\">LAYER 2 \u00b7 PROVIDERS & MODELS</div><h2><span class=\"sd sd-stable\"></span> Mistral AI</h2><p class=\"node-desc\">French AI startup founded in 2023 by ex-Google and ex-Meta researchers. Known for efficient open-weights models and a European alternative to US labs.</p><span class=\"slide-status status-stable\">stable</span>", "<div class=\"slide-node-layer\">LAYER 2 \u00b7 PROVIDERS & MODELS</div><h2><span class=\"sd sd-evolving\"></span> DeepSeek AI</h2><p class=\"node-desc\">Chinese AI research lab. Released powerful open-weights models at very low cost. DeepSeek-R1 disrupted the market in Jan 2025 by matching GPT-o1 performance.</p><span class=\"slide-status status-evolving\">evolving</span>", "<div class=\"slide-node-layer\">LAYER 2 \u00b7 PROVIDERS & MODELS</div><h2><span class=\"sd sd-stable\"></span> Alibaba</h2><p class=\"node-desc\">Chinese tech giant. Creator of the Qwen open-weights model family via DAMO Academy. Models available on HuggingFace and integrated in Alibaba Cloud.</p><span class=\"slide-status status-stable\">stable</span>", "<div class=\"slide-node-layer\">LAYER 2 \u00b7 PROVIDERS & MODELS</div><h2><span class=\"sd sd-stable\"></span> Microsoft</h2><p class=\"node-desc\">Creator of the Phi small model family. Major OpenAI investor and partner. Deploys OpenAI models via Azure OpenAI Service.</p><span class=\"slide-status status-stable\">stable</span>", "<div class=\"slide-node-layer\">LAYER 2 \u00b7 PROVIDERS & MODELS</div><h2><span class=\"sd sd-stable\"></span> GPT-4o</h2><p class=\"node-desc\">OpenAI's flagship multimodal model. Processes text, images and audio natively. \"o\" = omni. Powers ChatGPT. Available via API.</p><span class=\"slide-status status-stable\">stable</span>", "<div class=\"slide-node-layer\">LAYER 2 \u00b7 PROVIDERS & MODELS</div><h2><span class=\"sd sd-evolving\"></span> o3 / o4-mini</h2><p class=\"node-desc\">OpenAI's reasoning-focused model family. Thinks step-by-step internally before answering (chain-of-thought). Best for complex math, coding, logic tasks.</p><span class=\"slide-status status-evolving\">evolving</span>", "<div class=\"slide-node-layer\">LAYER 2 \u00b7 PROVIDERS & MODELS</div><h2><span class=\"sd sd-evolving\"></span> Claude 3.5 / 3.7</h2><p class=\"node-desc\">Anthropic's model family. Known for instruction-following and safety. Claude 3.7 Sonnet introduces extended thinking (visible reasoning). Sonnet = balanced. Haiku = fast/cheap. Opus = most powerful.</p><span class=\"slide-status status-evolving\">evolving</span>", "<div class=\"slide-node-layer\">LAYER 2 \u00b7 PROVIDERS & MODELS</div><h2><span class=\"sd sd-evolving\"></span> Gemini 2.0</h2><p class=\"node-desc\">Google's multimodal model family. Native tool use, code execution. Gemini 2.0 Flash: 1M token context window. Strong at long documents.</p><span class=\"slide-status status-evolving\">evolving</span>", "<div class=\"slide-node-layer\">LAYER 2 \u00b7 PROVIDERS & MODELS</div><h2><span class=\"sd sd-evolving\"></span> Grok 3</h2><p class=\"node-desc\">xAI's flagship model. Trained on X (Twitter) data. Grok 3 features a \"Think\" reasoning mode similar to o3 and DeepSeek-R1.</p><span class=\"slide-status status-evolving\">evolving</span>", "<div class=\"slide-node-layer\">LAYER 2 \u00b7 PROVIDERS & MODELS</div><h2><span class=\"sd sd-evolving\"></span> Llama 3.x</h2><p class=\"node-desc\">Meta's open-weights model family. Free to download, run and fine-tune. Available in multiple sizes (8B, 70B, 405B parameters). Foundation of many community fine-tunes and products.</p><span class=\"slide-status status-evolving\">evolving</span>", "<div class=\"slide-node-layer\">LAYER 2 \u00b7 PROVIDERS & MODELS</div><h2><span class=\"sd sd-stable\"></span> Mistral / Mixtral</h2><p class=\"node-desc\">Efficient open-weights models from Mistral AI. Mixtral uses MoE (Mixture of Experts) architecture for better performance/cost.</p><span class=\"slide-status status-stable\">stable</span>", "<div class=\"slide-node-layer\">LAYER 2 \u00b7 PROVIDERS & MODELS</div><h2><span class=\"sd sd-evolving\"></span> DeepSeek V3 / R1</h2><p class=\"node-desc\">Chinese open-weights models rivaling proprietary models at low cost. DeepSeek-R1 is a reasoning model (like o3) but fully open weights. Caused significant market disruption in early 2025.</p><span class=\"slide-status status-evolving\">evolving</span>", "<div class=\"slide-node-layer\">LAYER 2 \u00b7 PROVIDERS & MODELS</div><h2><span class=\"sd sd-evolving\"></span> Qwen 2.5</h2><p class=\"node-desc\">Alibaba's open-weights model family. Strong multilingual and coding performance. Qwen2.5-Coder is specialized for code generation.</p><span class=\"slide-status status-evolving\">evolving</span>", "<div class=\"slide-node-layer\">LAYER 2 \u00b7 PROVIDERS & MODELS</div><h2><span class=\"sd sd-stable\"></span> Gemma 2</h2><p class=\"node-desc\">Google's open-weights model family. Lightweight (2B, 9B, 27B parameters). Optimized to run locally on laptops and phones. Strong instruction-following.</p><span class=\"slide-status status-stable\">stable</span>", "<div class=\"slide-node-layer\">LAYER 2 \u00b7 PROVIDERS & MODELS</div><h2><span class=\"sd sd-evolving\"></span> Phi-4</h2><p class=\"node-desc\">Microsoft's small but powerful open-weights model (14B parameters). Outperforms much larger models on reasoning tasks. Great for local use.</p><span class=\"slide-status status-evolving\">evolving</span>", "<div class=\"slide-node-layer\">LAYER 2 \u00b7 PROVIDERS & MODELS</div><h2><span class=\"sd sd-stable\"></span> text-embedding-3</h2><p class=\"node-desc\">OpenAI's embedding model family. Converts text to dense vectors. text-embedding-3-small (fast/cheap) and text-embedding-3-large (high quality). Used in RAG pipelines to index and search documents.</p><span class=\"slide-status status-stable\">stable</span>", "<div class=\"slide-node-layer\">LAYER 2 \u00b7 PROVIDERS & MODELS</div><h2><span class=\"sd sd-stable\"></span> Voyage-3</h2><p class=\"node-desc\">Voyage AI's embedding model. Best-in-class retrieval performance. Specialized versions: voyage-code-3 (code), voyage-finance-2 (finance).</p><span class=\"slide-status status-stable\">stable</span>", "<div class=\"slide-node-layer\">LAYER 2 \u00b7 PROVIDERS & MODELS</div><h2><span class=\"sd sd-stable\"></span> nomic-embed</h2><p class=\"node-desc\">Open-source embedding model by Nomic AI. Can run locally via Ollama. Good balance of performance and privacy (no data sent to external APIs).</p><span class=\"slide-status status-stable\">stable</span>", "<div class=\"slide-node-layer\">LAYER 1 \u00b7 FOUNDATIONS</div><h2><span class=\"sd sd-stable\"></span> Transformer</h2><p class=\"node-desc\">Neural network architecture behind all modern LLMs. Introduced in \"Attention Is All You Need\" (Google, 2017). Uses self-attention to process sequences in parallel.</p><span class=\"slide-status status-stable\">stable</span>", "<div class=\"slide-node-layer\">LAYER 1 \u00b7 FOUNDATIONS</div><h2><span class=\"sd sd-stable\"></span> Token</h2><p class=\"node-desc\">The basic unit of text processed by an LLM. 1 token \u2248 0.75 words in English. Models are billed and limited by token count.</p><span class=\"slide-status status-stable\">stable</span>", "<div class=\"slide-node-layer\">LAYER 1 \u00b7 FOUNDATIONS</div><h2><span class=\"sd sd-evolving\"></span> Context Window</h2><p class=\"node-desc\">Maximum number of tokens a model can process at once (input + output). GPT-4: 128K. Claude 3.7: 200K. Gemini 2.0: 1M. Larger = more expensive but can handle bigger documents.</p><span class=\"slide-status status-evolving\">evolving</span>", "<div class=\"slide-node-layer\">LAYER 1 \u00b7 FOUNDATIONS</div><h2><span class=\"sd sd-stable\"></span> Embedding</h2><p class=\"node-desc\">Numerical vector (list of floats) representing text in semantic space. Similar meaning \u2192 similar vectors. Used for search, RAG, clustering.</p><span class=\"slide-status status-stable\">stable</span>", "<div class=\"slide-node-layer\">LAYER 1 \u00b7 FOUNDATIONS</div><h2><span class=\"sd sd-stable\"></span> Prompt</h2><p class=\"node-desc\">The input text sent to a model to elicit a response. Quality of the prompt directly determines quality of the output.</p><span class=\"slide-status status-stable\">stable</span>", "<div class=\"slide-node-layer\">LAYER 1 \u00b7 FOUNDATIONS</div><h2><span class=\"sd sd-stable\"></span> Inference</h2><p class=\"node-desc\">The process of running a trained model to generate output from an input. Opposite of training. Happens every time you query a model.</p><span class=\"slide-status status-stable\">stable</span>", "<div class=\"slide-node-layer\">LAYER 1 \u00b7 FOUNDATIONS</div><h2><span class=\"sd sd-stable\"></span> KV Cache</h2><p class=\"node-desc\">Key-Value Cache: optimization that stores intermediate attention computations (Key and Value matrices) during token generation so they don't need to be recomputed for every new token. Without it: cost grows quadratically with sequence length. With it: each new token only requires computing attention for itself. Critical for inference latency and throughput \u2014 but consumes significant VRAM. Managed by serving engines like vLLM (paged attention) and llama.cpp.</p><span class=\"slide-status status-stable\">stable</span>", "<div class=\"slide-node-layer\">LAYER 1 \u00b7 FOUNDATIONS</div><h2><span class=\"sd sd-stable\"></span> Quantization</h2><p class=\"node-desc\">Compression technique that reduces the numerical precision of model weights from FP32/BF16 to lower formats (INT8, FP8, INT4). Cuts memory footprint 2\u20138\u00d7, speeds up inference, minimal quality loss. Enables large models to run on consumer hardware. Common formats: INT8 (good balance), INT4 (used by llama.cpp/GGUF), FP8 (newer, H100 GPUs, used by vLLM). Can also be applied to the KV cache.</p><span class=\"slide-status status-stable\">stable</span>", "<div class=\"slide-node-layer\">LAYER 1 \u00b7 FOUNDATIONS</div><h2><span class=\"sd sd-stable\"></span> Temperature</h2><p class=\"node-desc\">Parameter controlling output randomness. 0 = deterministic (same input \u2192 same output). 1+ = creative and varied. Tune based on use case.</p><span class=\"slide-status status-stable\">stable</span>", "<div class=\"slide-node-layer\">LAYER 1 \u00b7 FOUNDATIONS</div><h2><span class=\"sd sd-stable\"></span> Pre-training</h2><p class=\"node-desc\">Initial phase where a model learns from massive text datasets (terabytes). Builds general language understanding. Very expensive (millions of $).</p><span class=\"slide-status status-stable\">stable</span>", "<div class=\"slide-node-layer\">LAYER 1 \u00b7 FOUNDATIONS</div><h2><span class=\"sd sd-stable\"></span> Fine-tuning</h2><p class=\"node-desc\">Additional training on a specific dataset to specialize model behavior. Cheaper than pre-training. Used to adapt a base model to a domain or task.</p><span class=\"slide-status status-stable\">stable</span>", "<div class=\"slide-node-layer\">LAYER 1 \u00b7 FOUNDATIONS</div><h2><span class=\"sd sd-stable\"></span> RLHF</h2><p class=\"node-desc\">Reinforcement Learning from Human Feedback. Technique to align LLM outputs with human preferences. Used in ChatGPT, Claude, Gemini to make models helpful and safe.</p><span class=\"slide-status status-stable\">stable</span>", "<div class=\"slide-type-title\"><div class=\"slide-title-content\"><h2>Summary</h2><p class=\"stat\">55 concepts</p><p class=\"stat\">5 layers</p><p class=\"generated-from\">The LLM Ecosystem Today</p></div></div>"], fr: ["<div class=\"slide-type-title\"><div class=\"slide-title-content\"><h1>L'\u00c9cosyst\u00e8me LLM Aujourd'hui</h1><p class=\"subtitle\">\u00c9cosyst\u00e8me IA / LLM</p></div></div>", "<div class=\"slide-layer-num\">Layer 5</div><h2>LAYER 5 \u00b7 OUTILS D\u00c9VELOPPEURS</h2><ul><li><span class=\"sd sd-stable\"></span> <strong>LangChain</strong> \u2014 Most popular framework for building LLM applications.</li><li><span class=\"sd sd-evolving\"></span> <strong>LangGraph</strong> \u2014 Graph-based orchestration for multi-agent and stateful LLM workflows.</li><li><span class=\"sd sd-stable\"></span> <strong>LlamaIndex</strong> \u2014 Framework focused on data ingestion and RAG pipelines.</li><li><span class=\"sd sd-evolving\"></span> <strong>Cursor</strong> \u2014 AI-first code editor (fork of VS Code).</li><li><span class=\"sd sd-stable\"></span> <strong>GitHub Copilot</strong> \u2014 AI pair programmer by GitHub/Microsoft.</li><li><span class=\"sd sd-evolving\"></span> <strong>Claude Code</strong> \u2014 Anthropic's agentic CLI tool.</li></ul>", "<div class=\"slide-layer-num\">Layer 4</div><h2>LAYER 4 \u00b7 BRIQUES APPLICATIVES</h2><ul><li><span class=\"sd sd-stable\"></span> <strong>RAG</strong> \u2014 Retrieval-Augmented Generation.</li><li><span class=\"sd sd-stable\"></span> <strong>Vector Database</strong> \u2014 Database optimized for storing and querying embeddings by semantic similarity.</li><li><span class=\"sd sd-evolving\"></span> <strong>Agent</strong> \u2014 An LLM that can take actions autonomously: call tools, browse the web, write and run code, make decisions in a loop.</li><li><span class=\"sd sd-stable\"></span> <strong>Tool Use / Function Calling</strong> \u2014 Allows an LLM to call external functions or APIs during generation.</li><li><span class=\"sd sd-stable\"></span> <strong>Structured Output</strong> \u2014 Forces the model to respond in a defined format (JSON schema).</li><li><span class=\"sd sd-stable\"></span> <strong>System Prompt</strong> \u2014 Instructions given to the model before the conversation starts.</li><li><span class=\"sd sd-evolving\"></span> <strong>Memory</strong> \u2014 Mechanisms to persist information across conversations or steps.</li><li><span class=\"sd sd-emerging\"></span> <strong>MCP</strong> \u2014 Model Context Protocol.</li></ul>", "<div class=\"slide-layer-num\">Layer 3</div><h2>LAYER 3 \u00b7 INFRASTRUCTURE & ACC\u00c8S</h2><ul><li><span class=\"sd sd-stable\"></span> <strong>LLM API</strong> \u2014 Standard HTTP/REST interface to interact with a model.</li><li><span class=\"sd sd-stable\"></span> <strong>AWS Bedrock</strong> \u2014 AWS managed service to access multiple LLMs (Claude, Llama, Mistral...) via a unified API.</li><li><span class=\"sd sd-stable\"></span> <strong>Google Vertex AI</strong> \u2014 Google Cloud managed platform for AI model deployment and serving.</li><li><span class=\"sd sd-stable\"></span> <strong>Azure OpenAI</strong> \u2014 Microsoft Azure's managed deployment of OpenAI models.</li><li><span class=\"sd sd-stable\"></span> <strong>HuggingFace</strong> \u2014 The central hub for open-source models, datasets and ML tooling.</li><li><span class=\"sd sd-evolving\"></span> <strong>Ollama</strong> \u2014 Run LLMs locally on your own machine.</li></ul>", "<div class=\"slide-layer-num\">Layer 2</div><h2>LAYER 2 \u00b7 FOURNISSEURS & MOD\u00c8LES</h2><ul><li><span class=\"sd sd-stable\"></span> <strong>OpenAI</strong> \u2014 American AI company, founded 2015.</li><li><span class=\"sd sd-stable\"></span> <strong>Anthropic</strong> \u2014 AI safety company founded by ex-OpenAI researchers (Dario & Daniela Amodei).</li><li><span class=\"sd sd-stable\"></span> <strong>Google DeepMind</strong> \u2014 Merger of Google Brain and DeepMind (2023).</li><li><span class=\"sd sd-evolving\"></span> <strong>xAI</strong> \u2014 AI company founded by Elon Musk in 2023.</li><li><span class=\"sd sd-stable\"></span> <strong>Meta</strong> \u2014 Meta AI (Facebook parent).</li><li><span class=\"sd sd-stable\"></span> <strong>Mistral AI</strong> \u2014 French AI startup founded in 2023 by ex-Google and ex-Meta researchers.</li><li><span class=\"sd sd-evolving\"></span> <strong>DeepSeek AI</strong> \u2014 Chinese AI research lab.</li><li><span class=\"sd sd-stable\"></span> <strong>Alibaba</strong> \u2014 Chinese tech giant.</li><li><span class=\"sd sd-stable\"></span> <strong>Microsoft</strong> \u2014 Creator of the Phi small model family.</li><li><span class=\"sd sd-stable\"></span> <strong>GPT-4o</strong> \u2014 OpenAI's flagship multimodal model.</li><li><span class=\"sd sd-evolving\"></span> <strong>o3 / o4-mini</strong> \u2014 OpenAI's reasoning-focused model family.</li><li><span class=\"sd sd-evolving\"></span> <strong>Claude 3.5 / 3.7</strong> \u2014 Anthropic's model family.</li><li><span class=\"sd sd-evolving\"></span> <strong>Gemini 2.0</strong> \u2014 Google's multimodal model family.</li><li><span class=\"sd sd-evolving\"></span> <strong>Grok 3</strong> \u2014 xAI's flagship model.</li><li><span class=\"sd sd-evolving\"></span> <strong>Llama 3.x</strong> \u2014 Meta's open-weights model family.</li><li><span class=\"sd sd-stable\"></span> <strong>Mistral / Mixtral</strong> \u2014 Efficient open-weights models from Mistral AI.</li><li><span class=\"sd sd-evolving\"></span> <strong>DeepSeek V3 / R1</strong> \u2014 Chinese open-weights models rivaling proprietary models at low cost.</li><li><span class=\"sd sd-evolving\"></span> <strong>Qwen 2.5</strong> \u2014 Alibaba's open-weights model family.</li><li><span class=\"sd sd-stable\"></span> <strong>Gemma 2</strong> \u2014 Google's open-weights model family.</li><li><span class=\"sd sd-evolving\"></span> <strong>Phi-4</strong> \u2014 Microsoft's small but powerful open-weights model (14B parameters).</li><li><span class=\"sd sd-stable\"></span> <strong>text-embedding-3</strong> \u2014 OpenAI's embedding model family.</li><li><span class=\"sd sd-stable\"></span> <strong>Voyage-3</strong> \u2014 Voyage AI's embedding model.</li><li><span class=\"sd sd-stable\"></span> <strong>nomic-embed</strong> \u2014 Open-source embedding model by Nomic AI.</li></ul>", "<div class=\"slide-layer-num\">Layer 1</div><h2>LAYER 1 \u00b7 FONDAMENTAUX</h2><ul><li><span class=\"sd sd-stable\"></span> <strong>Transformer</strong> \u2014 Neural network architecture behind all modern LLMs.</li><li><span class=\"sd sd-stable\"></span> <strong>Token</strong> \u2014 The basic unit of text processed by an LLM.</li><li><span class=\"sd sd-evolving\"></span> <strong>Context Window</strong> \u2014 Maximum number of tokens a model can process at once (input + output).</li><li><span class=\"sd sd-stable\"></span> <strong>Embedding</strong> \u2014 Numerical vector (list of floats) representing text in semantic space.</li><li><span class=\"sd sd-stable\"></span> <strong>Prompt</strong> \u2014 The input text sent to a model to elicit a response.</li><li><span class=\"sd sd-stable\"></span> <strong>Inference</strong> \u2014 The process of running a trained model to generate output from an input.</li><li><span class=\"sd sd-stable\"></span> <strong>KV Cache</strong> \u2014 Key-Value Cache: optimization that stores intermediate attention computations (Key and Value matrices) during token generation so they don't need to be recomputed for every new token.</li><li><span class=\"sd sd-stable\"></span> <strong>Quantization</strong> \u2014 Compression technique that reduces the numerical precision of model weights from FP32/BF16 to lower formats (INT8, FP8, INT4).</li><li><span class=\"sd sd-stable\"></span> <strong>Temperature</strong> \u2014 Parameter controlling output randomness.</li><li><span class=\"sd sd-stable\"></span> <strong>Pre-training</strong> \u2014 Initial phase where a model learns from massive text datasets (terabytes).</li><li><span class=\"sd sd-stable\"></span> <strong>Fine-tuning</strong> \u2014 Additional training on a specific dataset to specialize model behavior.</li><li><span class=\"sd sd-stable\"></span> <strong>RLHF</strong> \u2014 Reinforcement Learning from Human Feedback.</li></ul>", "<div class=\"slide-node-layer\">LAYER 5 \u00b7 OUTILS D\u00c9VELOPPEURS</div><h2><span class=\"sd sd-stable\"></span> LangChain</h2><p class=\"node-desc\">Most popular framework for building LLM applications. Provides chains, retrievers, memory and agent primitives. Large ecosystem but sometimes criticized for over-abstraction.</p><span class=\"slide-status status-stable\">stable</span>", "<div class=\"slide-node-layer\">LAYER 5 \u00b7 OUTILS D\u00c9VELOPPEURS</div><h2><span class=\"sd sd-evolving\"></span> LangGraph</h2><p class=\"node-desc\">Graph-based orchestration for multi-agent and stateful LLM workflows. Built on LangChain. Nodes = steps, Edges = transitions. Better control flow than simple chains.</p><span class=\"slide-status status-evolving\">evolving</span>", "<div class=\"slide-node-layer\">LAYER 5 \u00b7 OUTILS D\u00c9VELOPPEURS</div><h2><span class=\"sd sd-stable\"></span> LlamaIndex</h2><p class=\"node-desc\">Framework focused on data ingestion and RAG pipelines. Great for document Q&A applications. Simpler than LangChain for pure retrieval use cases.</p><span class=\"slide-status status-stable\">stable</span>", "<div class=\"slide-node-layer\">LAYER 5 \u00b7 OUTILS D\u00c9VELOPPEURS</div><h2><span class=\"sd sd-evolving\"></span> Cursor</h2><p class=\"node-desc\">AI-first code editor (fork of VS Code). Deep LLM integration: code generation, explanation, refactoring, codebase Q&A. Uses GPT-4o and Claude under the hood.</p><span class=\"slide-status status-evolving\">evolving</span>", "<div class=\"slide-node-layer\">LAYER 5 \u00b7 OUTILS D\u00c9VELOPPEURS</div><h2><span class=\"sd sd-stable\"></span> GitHub Copilot</h2><p class=\"node-desc\">AI pair programmer by GitHub/Microsoft. Integrates in VS Code, JetBrains, Neovim and more. Suggests code completions and has a chat mode.</p><span class=\"slide-status status-stable\">stable</span>", "<div class=\"slide-node-layer\">LAYER 5 \u00b7 OUTILS D\u00c9VELOPPEURS</div><h2><span class=\"sd sd-evolving\"></span> Claude Code</h2><p class=\"node-desc\">Anthropic's agentic CLI tool. Runs in the terminal. Can read, write, and execute code across an entire codebase autonomously. Uses MCP for tool integrations.</p><span class=\"slide-status status-evolving\">evolving</span>", "<div class=\"slide-node-layer\">LAYER 4 \u00b7 BRIQUES APPLICATIVES</div><h2><span class=\"sd sd-stable\"></span> RAG</h2><p class=\"node-desc\">Retrieval-Augmented Generation. Augments LLM responses with relevant external documents fetched at runtime. Solves the knowledge cutoff problem. Avoids hallucinations on specific data.</p><span class=\"slide-status status-stable\">stable</span>", "<div class=\"slide-node-layer\">LAYER 4 \u00b7 BRIQUES APPLICATIVES</div><h2><span class=\"sd sd-stable\"></span> Vector Database</h2><p class=\"node-desc\">Database optimized for storing and querying embeddings by semantic similarity. Examples: Pinecone, Weaviate, Chroma, pgvector. Core component of RAG pipelines.</p><span class=\"slide-status status-stable\">stable</span>", "<div class=\"slide-node-layer\">LAYER 4 \u00b7 BRIQUES APPLICATIVES</div><h2><span class=\"sd sd-evolving\"></span> Agent</h2><p class=\"node-desc\">An LLM that can take actions autonomously: call tools, browse the web, write and run code, make decisions in a loop. Key shift: from Q&A to autonomous task completion.</p><span class=\"slide-status status-evolving\">evolving</span>", "<div class=\"slide-node-layer\">LAYER 4 \u00b7 BRIQUES APPLICATIVES</div><h2><span class=\"sd sd-stable\"></span> Tool Use / Function Calling</h2><p class=\"node-desc\">Allows an LLM to call external functions or APIs during generation. Example: search the web, query a DB, send an email. The model decides when and how to call the tool.</p><span class=\"slide-status status-stable\">stable</span>", "<div class=\"slide-node-layer\">LAYER 4 \u00b7 BRIQUES APPLICATIVES</div><h2><span class=\"sd sd-stable\"></span> Structured Output</h2><p class=\"node-desc\">Forces the model to respond in a defined format (JSON schema). Essential for reliable integration in applications. Eliminates parsing errors from free-form text responses.</p><span class=\"slide-status status-stable\">stable</span>", "<div class=\"slide-node-layer\">LAYER 4 \u00b7 BRIQUES APPLICATIVES</div><h2><span class=\"sd sd-stable\"></span> System Prompt</h2><p class=\"node-desc\">Instructions given to the model before the conversation starts. Defines persona, rules, tone, constraints and context. Hidden from end users. Controls model behavior globally.</p><span class=\"slide-status status-stable\">stable</span>", "<div class=\"slide-node-layer\">LAYER 4 \u00b7 BRIQUES APPLICATIVES</div><h2><span class=\"sd sd-evolving\"></span> Memory</h2><p class=\"node-desc\">Mechanisms to persist information across conversations or steps. Short-term: conversation history in context window. Long-term: summaries or facts stored in a vector DB or key-value store.</p><span class=\"slide-status status-evolving\">evolving</span>", "<div class=\"slide-node-layer\">LAYER 4 \u00b7 BRIQUES APPLICATIVES</div><h2><span class=\"sd sd-emerging\"></span> MCP</h2><p class=\"node-desc\">Model Context Protocol. Open standard by Anthropic (Nov 2024). Standardizes how LLMs connect to external tools and data sources. Like USB-C for AI: one protocol, many integrations.</p><span class=\"slide-status status-emerging\">emerging</span>", "<div class=\"slide-node-layer\">LAYER 3 \u00b7 INFRASTRUCTURE & ACC\u00c8S</div><h2><span class=\"sd sd-stable\"></span> LLM API</h2><p class=\"node-desc\">Standard HTTP/REST interface to interact with a model. Send a prompt in the request, get a completion in the response. Common pattern across all providers (OpenAI, Anthropic, Google...).</p><span class=\"slide-status status-stable\">stable</span>", "<div class=\"slide-node-layer\">LAYER 3 \u00b7 INFRASTRUCTURE & ACC\u00c8S</div><h2><span class=\"sd sd-stable\"></span> AWS Bedrock</h2><p class=\"node-desc\">AWS managed service to access multiple LLMs (Claude, Llama, Mistral...) via a unified API. No GPU management. Pay per token. Enterprise-grade security and compliance.</p><span class=\"slide-status status-stable\">stable</span>", "<div class=\"slide-node-layer\">LAYER 3 \u00b7 INFRASTRUCTURE & ACC\u00c8S</div><h2><span class=\"sd sd-stable\"></span> Google Vertex AI</h2><p class=\"node-desc\">Google Cloud managed platform for AI model deployment and serving. Hosts Gemini natively. Also supports fine-tuning and MLOps pipelines.</p><span class=\"slide-status status-stable\">stable</span>", "<div class=\"slide-node-layer\">LAYER 3 \u00b7 INFRASTRUCTURE & ACC\u00c8S</div><h2><span class=\"sd sd-stable\"></span> Azure OpenAI</h2><p class=\"node-desc\">Microsoft Azure's managed deployment of OpenAI models. Preferred for enterprise: data privacy, compliance (SOC2, HIPAA), SLAs.</p><span class=\"slide-status status-stable\">stable</span>", "<div class=\"slide-node-layer\">LAYER 3 \u00b7 INFRASTRUCTURE & ACC\u00c8S</div><h2><span class=\"sd sd-stable\"></span> HuggingFace</h2><p class=\"node-desc\">The central hub for open-source models, datasets and ML tooling. Hosts 500K+ models. Provides Inference API and Spaces for demos. The \"GitHub of AI models\".</p><span class=\"slide-status status-stable\">stable</span>", "<div class=\"slide-node-layer\">LAYER 3 \u00b7 INFRASTRUCTURE & ACC\u00c8S</div><h2><span class=\"sd sd-evolving\"></span> Ollama</h2><p class=\"node-desc\">Run LLMs locally on your own machine. Simple CLI and REST API. Supports Llama, Mistral, DeepSeek, Qwen and many more. No internet required. Free. Privacy-preserving.</p><span class=\"slide-status status-evolving\">evolving</span>", "<div class=\"slide-node-layer\">LAYER 2 \u00b7 FOURNISSEURS & MOD\u00c8LES</div><h2><span class=\"sd sd-stable\"></span> OpenAI</h2><p class=\"node-desc\">American AI company, founded 2015. Originally non-profit, now capped-profit. Creator of GPT and o-series models. Behind ChatGPT. Backed by Microsoft.</p><span class=\"slide-status status-stable\">stable</span>", "<div class=\"slide-node-layer\">LAYER 2 \u00b7 FOURNISSEURS & MOD\u00c8LES</div><h2><span class=\"sd sd-stable\"></span> Anthropic</h2><p class=\"node-desc\">AI safety company founded by ex-OpenAI researchers (Dario & Daniela Amodei). Creator of Claude. Focus on safe and interpretable AI. Backed by Google & Amazon.</p><span class=\"slide-status status-stable\">stable</span>", "<div class=\"slide-node-layer\">LAYER 2 \u00b7 FOURNISSEURS & MOD\u00c8LES</div><h2><span class=\"sd sd-stable\"></span> Google DeepMind</h2><p class=\"node-desc\">Merger of Google Brain and DeepMind (2023). Creator of Gemini (proprietary) and Gemma (open weights). Integrated into Google Cloud via Vertex AI.</p><span class=\"slide-status status-stable\">stable</span>", "<div class=\"slide-node-layer\">LAYER 2 \u00b7 FOURNISSEURS & MOD\u00c8LES</div><h2><span class=\"sd sd-evolving\"></span> xAI</h2><p class=\"node-desc\">AI company founded by Elon Musk in 2023. Creator of the Grok model family. Integrated with the X (Twitter) platform.</p><span class=\"slide-status status-evolving\">evolving</span>", "<div class=\"slide-node-layer\">LAYER 2 \u00b7 FOURNISSEURS & MOD\u00c8LES</div><h2><span class=\"sd sd-stable\"></span> Meta</h2><p class=\"node-desc\">Meta AI (Facebook parent). Creator of the Llama open-weights model family. Strong open-source commitment: models freely downloadable and fine-tunable.</p><span class=\"slide-status status-stable\">stable</span>", "<div class=\"slide-node-layer\">LAYER 2 \u00b7 FOURNISSEURS & MOD\u00c8LES</div><h2><span class=\"sd sd-stable\"></span> Mistral AI</h2><p class=\"node-desc\">French AI startup founded in 2023 by ex-Google and ex-Meta researchers. Known for efficient open-weights models and a European alternative to US labs.</p><span class=\"slide-status status-stable\">stable</span>", "<div class=\"slide-node-layer\">LAYER 2 \u00b7 FOURNISSEURS & MOD\u00c8LES</div><h2><span class=\"sd sd-evolving\"></span> DeepSeek AI</h2><p class=\"node-desc\">Chinese AI research lab. Released powerful open-weights models at very low cost. DeepSeek-R1 disrupted the market in Jan 2025 by matching GPT-o1 performance.</p><span class=\"slide-status status-evolving\">evolving</span>", "<div class=\"slide-node-layer\">LAYER 2 \u00b7 FOURNISSEURS & MOD\u00c8LES</div><h2><span class=\"sd sd-stable\"></span> Alibaba</h2><p class=\"node-desc\">Chinese tech giant. Creator of the Qwen open-weights model family via DAMO Academy. Models available on HuggingFace and integrated in Alibaba Cloud.</p><span class=\"slide-status status-stable\">stable</span>", "<div class=\"slide-node-layer\">LAYER 2 \u00b7 FOURNISSEURS & MOD\u00c8LES</div><h2><span class=\"sd sd-stable\"></span> Microsoft</h2><p class=\"node-desc\">Creator of the Phi small model family. Major OpenAI investor and partner. Deploys OpenAI models via Azure OpenAI Service.</p><span class=\"slide-status status-stable\">stable</span>", "<div class=\"slide-node-layer\">LAYER 2 \u00b7 FOURNISSEURS & MOD\u00c8LES</div><h2><span class=\"sd sd-stable\"></span> GPT-4o</h2><p class=\"node-desc\">OpenAI's flagship multimodal model. Processes text, images and audio natively. \"o\" = omni. Powers ChatGPT. Available via API.</p><span class=\"slide-status status-stable\">stable</span>", "<div class=\"slide-node-layer\">LAYER 2 \u00b7 FOURNISSEURS & MOD\u00c8LES</div><h2><span class=\"sd sd-evolving\"></span> o3 / o4-mini</h2><p class=\"node-desc\">OpenAI's reasoning-focused model family. Thinks step-by-step internally before answering (chain-of-thought). Best for complex math, coding, logic tasks.</p><span class=\"slide-status status-evolving\">evolving</span>", "<div class=\"slide-node-layer\">LAYER 2 \u00b7 FOURNISSEURS & MOD\u00c8LES</div><h2><span class=\"sd sd-evolving\"></span> Claude 3.5 / 3.7</h2><p class=\"node-desc\">Anthropic's model family. Known for instruction-following and safety. Claude 3.7 Sonnet introduces extended thinking (visible reasoning). Sonnet = balanced. Haiku = fast/cheap. Opus = most powerful.</p><span class=\"slide-status status-evolving\">evolving</span>", "<div class=\"slide-node-layer\">LAYER 2 \u00b7 FOURNISSEURS & MOD\u00c8LES</div><h2><span class=\"sd sd-evolving\"></span> Gemini 2.0</h2><p class=\"node-desc\">Google's multimodal model family. Native tool use, code execution. Gemini 2.0 Flash: 1M token context window. Strong at long documents.</p><span class=\"slide-status status-evolving\">evolving</span>", "<div class=\"slide-node-layer\">LAYER 2 \u00b7 FOURNISSEURS & MOD\u00c8LES</div><h2><span class=\"sd sd-evolving\"></span> Grok 3</h2><p class=\"node-desc\">xAI's flagship model. Trained on X (Twitter) data. Grok 3 features a \"Think\" reasoning mode similar to o3 and DeepSeek-R1.</p><span class=\"slide-status status-evolving\">evolving</span>", "<div class=\"slide-node-layer\">LAYER 2 \u00b7 FOURNISSEURS & MOD\u00c8LES</div><h2><span class=\"sd sd-evolving\"></span> Llama 3.x</h2><p class=\"node-desc\">Meta's open-weights model family. Free to download, run and fine-tune. Available in multiple sizes (8B, 70B, 405B parameters). Foundation of many community fine-tunes and products.</p><span class=\"slide-status status-evolving\">evolving</span>", "<div class=\"slide-node-layer\">LAYER 2 \u00b7 FOURNISSEURS & MOD\u00c8LES</div><h2><span class=\"sd sd-stable\"></span> Mistral / Mixtral</h2><p class=\"node-desc\">Efficient open-weights models from Mistral AI. Mixtral uses MoE (Mixture of Experts) architecture for better performance/cost.</p><span class=\"slide-status status-stable\">stable</span>", "<div class=\"slide-node-layer\">LAYER 2 \u00b7 FOURNISSEURS & MOD\u00c8LES</div><h2><span class=\"sd sd-evolving\"></span> DeepSeek V3 / R1</h2><p class=\"node-desc\">Chinese open-weights models rivaling proprietary models at low cost. DeepSeek-R1 is a reasoning model (like o3) but fully open weights. Caused significant market disruption in early 2025.</p><span class=\"slide-status status-evolving\">evolving</span>", "<div class=\"slide-node-layer\">LAYER 2 \u00b7 FOURNISSEURS & MOD\u00c8LES</div><h2><span class=\"sd sd-evolving\"></span> Qwen 2.5</h2><p class=\"node-desc\">Alibaba's open-weights model family. Strong multilingual and coding performance. Qwen2.5-Coder is specialized for code generation.</p><span class=\"slide-status status-evolving\">evolving</span>", "<div class=\"slide-node-layer\">LAYER 2 \u00b7 FOURNISSEURS & MOD\u00c8LES</div><h2><span class=\"sd sd-stable\"></span> Gemma 2</h2><p class=\"node-desc\">Google's open-weights model family. Lightweight (2B, 9B, 27B parameters). Optimized to run locally on laptops and phones. Strong instruction-following.</p><span class=\"slide-status status-stable\">stable</span>", "<div class=\"slide-node-layer\">LAYER 2 \u00b7 FOURNISSEURS & MOD\u00c8LES</div><h2><span class=\"sd sd-evolving\"></span> Phi-4</h2><p class=\"node-desc\">Microsoft's small but powerful open-weights model (14B parameters). Outperforms much larger models on reasoning tasks. Great for local use.</p><span class=\"slide-status status-evolving\">evolving</span>", "<div class=\"slide-node-layer\">LAYER 2 \u00b7 FOURNISSEURS & MOD\u00c8LES</div><h2><span class=\"sd sd-stable\"></span> text-embedding-3</h2><p class=\"node-desc\">OpenAI's embedding model family. Converts text to dense vectors. text-embedding-3-small (fast/cheap) and text-embedding-3-large (high quality). Used in RAG pipelines to index and search documents.</p><span class=\"slide-status status-stable\">stable</span>", "<div class=\"slide-node-layer\">LAYER 2 \u00b7 FOURNISSEURS & MOD\u00c8LES</div><h2><span class=\"sd sd-stable\"></span> Voyage-3</h2><p class=\"node-desc\">Voyage AI's embedding model. Best-in-class retrieval performance. Specialized versions: voyage-code-3 (code), voyage-finance-2 (finance).</p><span class=\"slide-status status-stable\">stable</span>", "<div class=\"slide-node-layer\">LAYER 2 \u00b7 FOURNISSEURS & MOD\u00c8LES</div><h2><span class=\"sd sd-stable\"></span> nomic-embed</h2><p class=\"node-desc\">Open-source embedding model by Nomic AI. Can run locally via Ollama. Good balance of performance and privacy (no data sent to external APIs).</p><span class=\"slide-status status-stable\">stable</span>", "<div class=\"slide-node-layer\">LAYER 1 \u00b7 FONDAMENTAUX</div><h2><span class=\"sd sd-stable\"></span> Transformer</h2><p class=\"node-desc\">Neural network architecture behind all modern LLMs. Introduced in \"Attention Is All You Need\" (Google, 2017). Uses self-attention to process sequences in parallel.</p><span class=\"slide-status status-stable\">stable</span>", "<div class=\"slide-node-layer\">LAYER 1 \u00b7 FONDAMENTAUX</div><h2><span class=\"sd sd-stable\"></span> Token</h2><p class=\"node-desc\">The basic unit of text processed by an LLM. 1 token \u2248 0.75 words in English. Models are billed and limited by token count.</p><span class=\"slide-status status-stable\">stable</span>", "<div class=\"slide-node-layer\">LAYER 1 \u00b7 FONDAMENTAUX</div><h2><span class=\"sd sd-evolving\"></span> Context Window</h2><p class=\"node-desc\">Maximum number of tokens a model can process at once (input + output). GPT-4: 128K. Claude 3.7: 200K. Gemini 2.0: 1M. Larger = more expensive but can handle bigger documents.</p><span class=\"slide-status status-evolving\">evolving</span>", "<div class=\"slide-node-layer\">LAYER 1 \u00b7 FONDAMENTAUX</div><h2><span class=\"sd sd-stable\"></span> Embedding</h2><p class=\"node-desc\">Numerical vector (list of floats) representing text in semantic space. Similar meaning \u2192 similar vectors. Used for search, RAG, clustering.</p><span class=\"slide-status status-stable\">stable</span>", "<div class=\"slide-node-layer\">LAYER 1 \u00b7 FONDAMENTAUX</div><h2><span class=\"sd sd-stable\"></span> Prompt</h2><p class=\"node-desc\">The input text sent to a model to elicit a response. Quality of the prompt directly determines quality of the output.</p><span class=\"slide-status status-stable\">stable</span>", "<div class=\"slide-node-layer\">LAYER 1 \u00b7 FONDAMENTAUX</div><h2><span class=\"sd sd-stable\"></span> Inference</h2><p class=\"node-desc\">The process of running a trained model to generate output from an input. Opposite of training. Happens every time you query a model.</p><span class=\"slide-status status-stable\">stable</span>", "<div class=\"slide-node-layer\">LAYER 1 \u00b7 FONDAMENTAUX</div><h2><span class=\"sd sd-stable\"></span> KV Cache</h2><p class=\"node-desc\">Key-Value Cache: optimization that stores intermediate attention computations (Key and Value matrices) during token generation so they don't need to be recomputed for every new token. Without it: cost grows quadratically with sequence length. With it: each new token only requires computing attention for itself. Critical for inference latency and throughput \u2014 but consumes significant VRAM. Managed by serving engines like vLLM (paged attention) and llama.cpp.</p><span class=\"slide-status status-stable\">stable</span>", "<div class=\"slide-node-layer\">LAYER 1 \u00b7 FONDAMENTAUX</div><h2><span class=\"sd sd-stable\"></span> Quantization</h2><p class=\"node-desc\">Compression technique that reduces the numerical precision of model weights from FP32/BF16 to lower formats (INT8, FP8, INT4). Cuts memory footprint 2\u20138\u00d7, speeds up inference, minimal quality loss. Enables large models to run on consumer hardware. Common formats: INT8 (good balance), INT4 (used by llama.cpp/GGUF), FP8 (newer, H100 GPUs, used by vLLM). Can also be applied to the KV cache.</p><span class=\"slide-status status-stable\">stable</span>", "<div class=\"slide-node-layer\">LAYER 1 \u00b7 FONDAMENTAUX</div><h2><span class=\"sd sd-stable\"></span> Temperature</h2><p class=\"node-desc\">Parameter controlling output randomness. 0 = deterministic (same input \u2192 same output). 1+ = creative and varied. Tune based on use case.</p><span class=\"slide-status status-stable\">stable</span>", "<div class=\"slide-node-layer\">LAYER 1 \u00b7 FONDAMENTAUX</div><h2><span class=\"sd sd-stable\"></span> Pre-training</h2><p class=\"node-desc\">Initial phase where a model learns from massive text datasets (terabytes). Builds general language understanding. Very expensive (millions of $).</p><span class=\"slide-status status-stable\">stable</span>", "<div class=\"slide-node-layer\">LAYER 1 \u00b7 FONDAMENTAUX</div><h2><span class=\"sd sd-stable\"></span> Fine-tuning</h2><p class=\"node-desc\">Additional training on a specific dataset to specialize model behavior. Cheaper than pre-training. Used to adapt a base model to a domain or task.</p><span class=\"slide-status status-stable\">stable</span>", "<div class=\"slide-node-layer\">LAYER 1 \u00b7 FONDAMENTAUX</div><h2><span class=\"sd sd-stable\"></span> RLHF</h2><p class=\"node-desc\">Reinforcement Learning from Human Feedback. Technique to align LLM outputs with human preferences. Used in ChatGPT, Claude, Gemini to make models helpful and safe.</p><span class=\"slide-status status-stable\">stable</span>", "<div class=\"slide-type-title\"><div class=\"slide-title-content\"><h2>R\u00e9capitulatif</h2><p class=\"stat\">55 concepts</p><p class=\"stat\">5 couches</p><p class=\"generated-from\">L'\u00c9cosyst\u00e8me LLM Aujourd'hui</p></div></div>"] };
let lang = 'en', cur = 0;
function slides() { return ALL_SLIDES[lang]; }
function render() {
  document.getElementById('slide-content').innerHTML = slides()[cur];
  document.getElementById('counter').textContent = (cur+1) + ' / ' + slides().length;
  document.getElementById('prev').disabled = cur === 0;
  document.getElementById('next').disabled = cur === slides().length - 1;
  document.getElementById('progress').style.width = ((cur+1)/slides().length*100) + '%';
}
function go(d) { cur = Math.max(0, Math.min(slides().length-1, cur+d)); render(); }
function setLang(l) {
  lang = l; cur = 0;
  document.querySelectorAll('#lang-toggle .lang-btn').forEach(b => b.classList.toggle('active', b.textContent === l.toUpperCase()));
  render();
}
document.getElementById('prev').onclick = () => go(-1);
document.getElementById('next').onclick = () => go(1);
document.addEventListener('keydown', e => {
  if (e.key==='ArrowRight'||e.key==='ArrowDown') go(1);
  if (e.key==='ArrowLeft'||e.key==='ArrowUp') go(-1);
});
render();
</script>

<script>
(function () {
  // Dropdowns: click to toggle (touch + keyboard); hover handled in CSS on desktop.
  document.querySelectorAll('.sh-group > .sh-link').forEach(function (btn) {
    btn.addEventListener('click', function (e) {
      e.stopPropagation();
      var g = btn.parentElement, open = !g.classList.contains('open');
      document.querySelectorAll('.sh-group.open').forEach(function (o) { o.classList.remove('open'); });
      g.classList.toggle('open', open);
      btn.setAttribute('aria-expanded', open);
    });
  });
  document.addEventListener('click', function (e) {
    if (!e.target.closest('.sh-group')) document.querySelectorAll('.sh-group.open').forEach(function (o) { o.classList.remove('open'); });
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      document.querySelectorAll('.sh-group.open').forEach(function (o) { o.classList.remove('open'); });
      document.body.classList.remove('sh-menu-open');
    }
  });

  // Theme
  window.mmiaToggleTheme = function () {
    var dark = document.documentElement.getAttribute('data-theme') !== 'dark';
    if (dark) document.documentElement.setAttribute('data-theme', 'dark');
    else document.documentElement.removeAttribute('data-theme');
    try { localStorage.setItem('mmia-theme', dark ? 'dark' : 'light'); } catch (e) {}
    window.dispatchEvent(new CustomEvent('mmia-themechange', { detail: { dark: dark } }));
  };

  // Language memory: wrap the page's setLang, then restore the saved choice.
  if (typeof window.setLang === 'function') {
    var pageSetLang = window.setLang;
    window.setLang = function (l) {
      try { localStorage.setItem('mmia-lang', l); } catch (e) {}
      document.documentElement.lang = l;
      var r = pageSetLang.apply(this, arguments);
      document.querySelectorAll('.site-header [data-en], .site-footer [data-en]').forEach(function (el) {
        el.textContent = l === 'fr' ? (el.dataset.fr || el.dataset.en) : el.dataset.en;
      });
      document.querySelectorAll('.lang-btn').forEach(function (b) { b.classList.toggle('active', b.dataset.lang === l); });
      return r;
    };
    var saved = null;
    try { saved = localStorage.getItem('mmia-lang'); } catch (e) {}
    if (!saved) saved = (navigator.language || '').toLowerCase().indexOf('fr') === 0 ? 'fr' : 'en';
    if (saved !== 'en') window.setLang(saved);
  }
})();
</script>

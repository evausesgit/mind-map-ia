<style>
  :root {
    --bg: #05070B; --text: #EEF2F7; --muted: #8B94A5; --faint: #454D5C; --line: rgba(255,255,255,0.13);
    --card: #0B0F16; --request: #7EA6FF; --orchestrator: #A594FF; --mcp: #3DD6C6;
    --u: min(1vw, 1.78vh); /* 1% of a 16:9 frame */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  body { background: radial-gradient(ellipse at 30% 45%, #0E1522 0%, var(--bg) 62%); }

  .slide { height: 100vh; display: grid; grid-template-columns: 61fr 39fr; align-items: center;
    gap: calc(var(--u) * 2); padding: 0 calc(var(--u) * 3) 0 calc(var(--u) * 1); }
  .diagram { width: 100%; max-height: 100vh; display: block; }

  .glossary h1 { font: 500 calc(var(--u) * .68)/1 'JetBrains Mono', ui-monospace, monospace; letter-spacing: .24em;
    text-transform: uppercase; color: var(--muted); margin-bottom: calc(var(--u) * 1.2); }
  .glossary ul { list-style: none; border-top: 1px solid var(--line); }
  .glossary li { border-bottom: 1px solid var(--line); }
  .term { width: 100%; display: block; text-align: left; background: none; border: 0; color: inherit; font: inherit; cursor: pointer;
    padding: calc(var(--u) * .68) calc(var(--u) * .7); border-left: 2px solid transparent; transition: background .2s, border-color .2s; }
  .term:hover, .term.on { background: rgba(255,255,255,0.04); border-left-color: var(--tone); }
  .term:focus-visible { outline: 2px solid var(--mcp); outline-offset: -2px; }
  .term b { display: block; font-size: calc(var(--u) * 1.06); font-weight: 600; color: var(--tone); margin-bottom: calc(var(--u) * .18); }
  .term span { display: block; font-size: calc(var(--u) * .92); line-height: 1.38; color: var(--muted); }
  .term.on span { color: var(--text); }
  /* Secondary terms: complementary notions, set back from the main ones */
  .term.minor b { font-size: calc(var(--u) * .9); opacity: .8; }
  .term.minor span { font-size: calc(var(--u) * .82); }

  .n, .wire { transition: opacity .25s; }
  .n .base { fill: var(--card); stroke: var(--line); stroke-width: 1.2; transition: stroke .25s; }
  svg.focus .n:not(.on), svg.focus .wire:not(.on) { opacity: .22; }
  .n.on .base { stroke: var(--tone); stroke-width: 2; }
  .n.clickable { cursor: pointer; }
  .n.clickable:focus { outline: none; }

  .nav { position: fixed; top: 18px; right: 20px; display: flex; gap: 8px; z-index: 5; }
  .nav a { font: 500 12px 'Inter', sans-serif; color: var(--muted); text-decoration: none; padding: 6px 10px;
    border: 1px solid var(--line); border-radius: 8px; background: rgba(10,14,21,0.78); }
  .nav a:hover { color: var(--text); }

  @media (max-width: 800px) {
    :root { --u: 16px; }
    html, body { height: auto; }
    .slide { height: auto; display: block; padding: 56px 16px 32px; }
    .term b { font-size: 16px; } .term span { font-size: 14px; }
    .term.minor b { font-size: 15px; } .term.minor span { font-size: 13px; }
    .glossary h1 { font-size: 11px; margin-top: 24px; }
  }

  /* Journey layout: the three roles, then the steps (only the current one unfolds) */
  .journey h1 { font: 500 calc(var(--u) * .68)/1 'JetBrains Mono', ui-monospace, monospace; letter-spacing: .24em;
    text-transform: uppercase; color: var(--muted); margin: calc(var(--u) * 1.6) 0 calc(var(--u) * .8); }
  .roles { list-style: none; display: grid; grid-template-columns: repeat(3, 1fr); gap: calc(var(--u) * .8); }
  .roles li { border-top: 2px solid var(--tone); padding-top: calc(var(--u) * .5); }
  .roles b { display: block; font-size: calc(var(--u) * .98); font-weight: 600; color: var(--tone); margin-bottom: calc(var(--u) * .2); }
  .roles span { display: block; font-size: calc(var(--u) * .84); line-height: 1.35; color: var(--muted); }

  .steps { list-style: none; border-top: 1px solid var(--line); }
  .steps li { border-bottom: 1px solid var(--line); }
  .step { width: 100%; display: grid; grid-template-columns: calc(var(--u) * 2) 1fr; column-gap: calc(var(--u) * .7);
    align-items: center; text-align: left; background: none; border: 0; border-left: 2px solid transparent; color: inherit;
    font: inherit; cursor: pointer; padding: calc(var(--u) * .6) calc(var(--u) * .7); transition: background .2s, border-color .2s; }
  .step:hover { background: rgba(255,255,255,0.03); }
  .step:focus-visible { outline: 2px solid var(--mcp); outline-offset: -2px; }
  .step i { font: 500 calc(var(--u) * .8)/1 'JetBrains Mono', monospace; font-style: normal; color: var(--muted);
    width: calc(var(--u) * 1.7); height: calc(var(--u) * 1.7); border-radius: 50%; border: 1px solid var(--line);
    display: grid; place-items: center; transition: all .25s; }
  .step b { font-size: calc(var(--u) * 1.02); font-weight: 600; color: var(--muted); transition: color .25s; }
  .step.done b { color: var(--text); opacity: .7; }
  .step.done i { border-color: var(--mcp); color: var(--mcp); }
  .step.on { background: rgba(255,255,255,0.045); border-left-color: var(--mcp); }
  .step.on i { background: var(--mcp); border-color: var(--mcp); color: var(--bg); }
  .step.on b { color: var(--text); }
  .step .more { grid-column: 2; display: grid; grid-template-rows: 0fr; transition: grid-template-rows .3s; }
  .step .more > * { overflow: hidden; }
  .step.on .more { grid-template-rows: 1fr; }
  .step .more > span { font-size: calc(var(--u) * .92); line-height: 1.42; color: var(--text); opacity: .88; }
  .step.on .more > span { margin-top: calc(var(--u) * .4); }
  .step .more em { display: none; font: 400 calc(var(--u) * .8)/1.45 'JetBrains Mono', monospace; font-style: normal;
    color: var(--mcp); border-left: 2px solid rgba(61,214,198,.4); padding-left: calc(var(--u) * .6); }
  .step.on .more em { display: block; margin-top: calc(var(--u) * .5); }

  .controls { display: flex; align-items: center; gap: calc(var(--u) * .8); margin-top: calc(var(--u) * 1); }
  .controls button { font: 500 14px 'JetBrains Mono', monospace; color: var(--muted); cursor: pointer; padding: 4px 12px;
    border: 1px solid var(--line); border-radius: 8px; background: rgba(10,14,21,0.78); }
  .controls button:hover { color: var(--text); }
  .controls .count { font: 500 calc(var(--u) * .75) 'JetBrains Mono', monospace; color: var(--muted); letter-spacing: .12em; }
  .diagram { cursor: pointer; }

  @media (max-width: 800px) {
    .roles { grid-template-columns: 1fr; }
    .roles b { font-size: 15px; } .roles span { font-size: 13.5px; }
    .journey h1 { font-size: 11px; margin-top: 24px; }
    .step i { font-size: 12px; width: 26px; height: 26px; } .step { grid-template-columns: 30px 1fr; }
    .step b { font-size: 15.5px; } .step .more > span { font-size: 14px; } .step .more em { font-size: 12.5px; }
    .controls .count { font-size: 12px; }
  }

<section class="journey" aria-label="Le parcours de votre question">
  <ul class="roles"><li style="--tone:var(--request)"><b>L’agent</b><span>La solution dans son ensemble : votre assistant.</span></li><li style="--tone:var(--orchestrator)"><b>L’orchestrateur</b><span>Le moteur qui pilote les échanges avec le modèle et les outils.</span></li><li style="--tone:var(--orchestrator)"><b>Le modèle</b><span>Interprète, raisonne et propose les prochaines actions.</span></li></ul>
  <h1>Le parcours de votre question</h1>
  <ol class="steps">
    <li><button class="step" data-nodes="user center"><i>1</i><b>Vous posez votre question</b><span class="more"><span>En langage courant, comme à un collègue. Pas de requête à écrire, pas d’écran à ouvrir.</span><em>« Pourquoi mon panier a-t-il sous-performé le VWAP ce matin ? »</em></span></button></li>
    <li><button class="step" data-nodes="ring memory skills"><i>2</i><b>L’assistant prépare le dossier</b><span class="more"><span>L’orchestrateur rassemble le contexte : vos préférences (mémoire, si autorisée), la méthode d’analyse adaptée (skill) et vos droits d’accès.</span><em>Écarts en bps · méthode : exécution vs VWAP · périmètre : vos books</em></span></button></li>
    <li><button class="step" data-nodes="ring model"><i>3</i><b>Le modèle établit un plan</b><span class="more"><span>Il interprète la demande et renvoie à l’orchestrateur les actions nécessaires. Il propose, il n’exécute rien lui-même.</span><em>1. ordres du panier · 2. exécutions · 3. VWAP par ligne · 4. écart en bps</em></span></button></li>
    <li><button class="step" data-nodes="ring tools side"><i>4</i><b>Les outils vont chercher les faits</b><span class="more"><span>Via MCP, l’orchestrateur appelle les outils, dans le respect des règles et des autorisations. Les calculs sont faits par des outils dédiés, pas par le modèle.</span><em>OMS → 24 ordres · exécutions → 312 fills · marché → VWAP par titre</em></span></button></li>
    <li><button class="step" data-nodes="ring model tools side"><i>5</i><b>Le modèle analyse et creuse si besoin</b><span class="more"><span>L’orchestrateur lui transmet les résultats. S’il faut approfondir, le modèle propose une nouvelle action et la boucle reprend.</span><em>−12 bps vs VWAP, dont 9 sur 3 lignes → nouvelle demande : spread et volumes à l’ouverture</em></span></button></li>
    <li><button class="step" data-nodes="user center model"><i>6</i><b>Vous recevez une réponse argumentée</b><span class="more"><span>Le modèle rédige la réponse finale, que l’assistant vous restitue : une explication, les chiffres qui la fondent et la trace de chaque accès.</span><em>« 3 lignes peu liquides traitées à l’ouverture, spread ×3 : 9 bps sur les 12. »</em></span></button></li>
    <li><button class="step" data-nodes="user center ring model skills memory tools side"><i>7</i><b>Vue d’ensemble : tout fonctionne ensemble</b><span class="more"><span>Une seule question, plusieurs étapes coordonnées. Le modèle propose, l’orchestrateur pilote et contrôle, les skills et la mémoire apportent le contexte, les outils apportent les faits via MCP.</span><em>Une demande métier · des étapes coordonnées · des accès contrôlés et tracés</em></span></button></li>
  </ol>
  <div class="controls"><button class="prev" aria-label="Étape précédente">←</button><span class="count" aria-live="polite"></span><button class="next" aria-label="Étape suivante">→</button></div>
</section>

<script>
// Journey slides: one request followed step by step. Each step lights the
// diagram blocks it involves. Next: click on the diagram, →, ↓, Space,
// PageDown (remote clicker); back: ←, ↑, PageUp. The step is kept in the URL hash.
(function () {
  const slide = document.querySelector(".slide");
  const svg = slide.querySelector("svg.diagram");
  const steps = [...slide.querySelectorAll(".step")];
  const count = slide.querySelector(".count");
  let cur = 0;

  function go(i) {
    cur = Math.max(0, Math.min(steps.length - 1, i));
    const keys = new Set(steps[cur].dataset.nodes.split(" "));
    steps.forEach((s, j) => {
      s.classList.toggle("on", j === cur);
      s.classList.toggle("done", j < cur);
      if (j === cur) s.setAttribute("aria-current", "step"); else s.removeAttribute("aria-current");
    });
    svg.classList.add("focus");
    svg.querySelectorAll("[data-n]").forEach((el) => {
      el.classList.toggle("on", el.dataset.n.split(" ").some((k) => keys.has(k)));
    });
    count.textContent = `${cur + 1} / ${steps.length}`;
    try { history.replaceState(null, "", "#" + (cur + 1)); } catch (e) {}
  }

  steps.forEach((s, j) => s.addEventListener("click", () => go(j)));
  slide.querySelector(".prev").addEventListener("click", () => go(cur - 1));
  slide.querySelector(".next").addEventListener("click", () => go(cur + 1));
  svg.addEventListener("click", () => go(cur + 1));
  document.addEventListener("keydown", (e) => {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    const next = ["ArrowRight", "ArrowDown", "PageDown", " "].includes(e.key);
    const prev = ["ArrowLeft", "ArrowUp", "PageUp"].includes(e.key);
    if (next) go(cur + 1);
    else if (prev) go(cur - 1);
    else if (e.key === "Home") go(0);
    else if (e.key === "End") go(steps.length - 1);
    else return;
    e.preventDefault();
  });

  const start = parseInt(location.hash.slice(1), 10);
  go(Number.isFinite(start) ? start - 1 : 0);
})();

</script>

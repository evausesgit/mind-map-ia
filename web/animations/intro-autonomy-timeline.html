<style>
  :root {
    --bg: #05070B; --text: #EEF2F7; --muted: #8B94A5; --faint: #454D5C; --line: rgba(255,255,255,0.13);
    --card: #0B0F16; --request: #7EA6FF; --orchestrator: #A594FF; --mcp: #3DD6C6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--text); overflow: hidden;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  body { background: radial-gradient(ellipse at 50% 45%, #0E1522 0%, var(--bg) 65%); }
  html[lang="en"] [data-lang="fr"], html[lang="fr"] [data-lang="en"] { display: none; }

  .slide { height: 100vh; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .diagram { width: 100vw; max-height: 100vh; display: block; }
  .diagram text { font-family: 'Inter', sans-serif; }
  .diagram text.mono { font-family: 'JetBrains Mono', monospace; }
  .card { fill: var(--card); stroke: var(--line); stroke-width: 1.4; }

  /* step-by-step reveal: hidden (or dimmed) until its step is reached */
  [data-step] { transition: opacity .7s ease, transform .7s ease; }
  .diagram:not(.dim) [data-step]:not(.shown) { opacity: 0; transform: translateY(14px); }
  .diagram.dim [data-step]:not(.shown) { opacity: .13; }
  .diagram.dim [data-step][data-hide]:not(.shown) { opacity: 0; }
  .diagram.dim [data-step].current .card { stroke: var(--tone); stroke-width: 2.2; }
  .cursor { transition: transform .8s cubic-bezier(.6,0,.25,1); }
  .progress { transition: stroke-dashoffset .8s cubic-bezier(.6,0,.25,1); }
  .pulse { animation: pulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes pulse { 0%, 100% { opacity: .9; transform: scale(1); } 50% { opacity: .35; transform: scale(1.35); } }

  .nav { position: fixed; top: 18px; right: 20px; display: flex; gap: 8px; z-index: 5; transition: opacity .4s; }
  .nav a, .nav button { font: 500 12px 'Inter', sans-serif; color: var(--muted); text-decoration: none; padding: 6px 10px;
    border: 1px solid var(--line); border-radius: 8px; background: rgba(10,14,21,0.78); cursor: pointer; }
  .nav button { font-family: 'JetBrains Mono', monospace; padding: 6px 9px; }
  .nav a:hover, .nav button:hover { color: var(--text); }
  html[lang="en"] .nav button.en, html[lang="fr"] .nav button.fr { color: var(--bg); background: var(--mcp); border-color: var(--mcp); }
  .dots { position: fixed; bottom: 18px; right: 22px; display: flex; gap: 8px; z-index: 5; transition: opacity .4s; }
  .dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); transition: background .3s; }
  .dots i.on { background: var(--mcp); }
  .hint { position: fixed; bottom: 14px; left: 22px; font: 400 11px 'JetBrains Mono', monospace; color: var(--faint); transition: opacity .4s; }
  body.idle .nav, body.idle .dots, body.idle .hint { opacity: 0; }
</style>

<div class="dots" aria-hidden="true"></div>
<div class="hint" aria-hidden="true">→ / ← · F</div>
<script>
(function () {
  const svgs = [...document.querySelectorAll("svg.diagram")];
  const last = Math.max(...svgs.map((s) => +s.dataset.steps));
  const first = +(svgs[0].dataset.first || 1);
  const q = new URLSearchParams(location.search).get("step");
  let step = q === "all" ? last : Math.min(last, Math.max(first, +q || +location.hash.slice(1) || first));
  const dots = document.querySelector(".dots");
  for (let i = first; i <= last; i++) dots.appendChild(document.createElement("i"));
  function render() {
    svgs.forEach((svg) => {
      svg.querySelectorAll("[data-step]").forEach((el) => {
        const k = +el.dataset.step;
        el.classList.toggle("shown", k <= step);
        el.classList.toggle("current", k === step);
      });
      const xs = (svg.dataset.cursor || "").split(",").map(Number);
      if (xs.length > 1) {
        const x = xs[Math.min(step, xs.length) - 1];
        svg.querySelectorAll(".cursor").forEach((c) => { c.style.transform = `translateX(${x}px)`; });
        const p = svg.querySelector(".progress");
        if (p) { const len = +p.dataset.len; p.style.strokeDasharray = len; p.style.strokeDashoffset = len - (x - +p.dataset.x0); }
      }
    });
    [...dots.children].forEach((d, i) => d.classList.toggle("on", i + first <= step));
    history.replaceState(null, "", `#${step}`);
  }
  const go = (n) => { step = Math.min(last, Math.max(first, n)); render(); };
  document.addEventListener("keydown", (e) => {
    if (["ArrowRight", "ArrowDown", "PageDown", " ", "Enter"].includes(e.key)) { e.preventDefault(); go(step + 1); }
    else if (["ArrowLeft", "ArrowUp", "PageUp", "Backspace"].includes(e.key)) { e.preventDefault(); go(step - 1); }
    else if (e.key === "Home") go(first);
    else if (e.key === "End") go(last);
    else if (e.key === "f" || e.key === "F") {
      if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen();
    }
  });
  document.querySelectorAll(".slide").forEach((s) => s.addEventListener("click", () => go(step < last ? step + 1 : first)));
  // the controls fade out while presenting, and come back when the mouse moves
  let idle;
  const wake = () => { document.body.classList.remove("idle"); clearTimeout(idle); idle = setTimeout(() => document.body.classList.add("idle"), 2500); };
  document.addEventListener("mousemove", wake); wake();
  render();

  const backLink = document.querySelector("[data-back]");
  const backBase = backLink.getAttribute("href");
  const syncBack = () => { backLink.href = `${backBase}${backBase.includes("?") ? "&" : "?"}lang=${document.documentElement.lang}`; };
  syncBack();
  document.querySelectorAll("[data-set-lang]").forEach((b) => b.addEventListener("click", () => {
    document.documentElement.lang = b.dataset.setLang;
    try { localStorage.setItem("mmia-lang", b.dataset.setLang); } catch (e) {}
    syncBack();
  }));
})();
</script>

<section class="glossary" aria-label="Key vocabulary">
  <h1>Key vocabulary</h1>
  <ul>
    <li><button class="term" data-n="inference" style="--tone:var(--request)"><b>Inference</b><span>The moment a model computes an answer. The machine has to read the prompt to do it, so where it runs decides who could see the data.</span></button></li>
    <li><button class="term" data-n="onprem" style="--tone:var(--request)"><b>On-premise</b><span>On the company’s own servers, not a provider’s. Prompts, answers and logs stay in-house.</span></button></li>
    <li><button class="term" data-n="openweights" style="--tone:var(--request)"><b>Open-weights model</b><span>A model whose weights can be downloaded and run on your own GPUs, with no calls to its publisher.</span></button></li>
    <li><button class="term" data-n="frontier" style="--tone:var(--orchestrator)"><b>Frontier model</b><span>One of the most capable models of the moment, usually reached only through its provider’s cloud.</span></button></li>
    <li><button class="term" data-n="endpoint" style="--tone:var(--orchestrator)"><b>Private endpoint</b><span>Access to a cloud model over a dedicated encrypted link, in a chosen region, not the public internet.</span></button></li>
    <li><button class="term" data-n="gateway" style="--tone:var(--mcp)"><b>Routing gateway</b><span>The checkpoint that sends each piece of data to the model allowed for its sensitivity.</span></button></li>
    <li><button class="term" data-n="levels" style="--tone:var(--c2)"><b>Sensitivity level</b><span>A label on each piece of data, here C1 to C3, that sets where it may go.</span></button></li>
    <li><button class="term" data-n="anon" style="--tone:var(--c2)"><b>Anonymisation</b><span>Masks names and turns exact figures into ranges. With a mapping key kept in-house, it is strictly pseudonymisation.</span></button></li>
    <li><button class="term" data-n="zdr" style="--tone:var(--c1)"><b>Zero data retention</b><span>A contractual commitment: the provider keeps nothing once the answer is sent, and does not train on it.</span></button></li>
  </ul>
</section>

<section class="glossary" aria-label="Vocabulaire clé">
  <h1>Vocabulaire clé</h1>
  <ul>
    <li><button class="term" data-n="inference" style="--tone:var(--request)"><b>Inférence</b><span>Le moment où le modèle calcule sa réponse. La machine doit lire le prompt : l’endroit où elle tourne décide de qui pourrait voir les données.</span></button></li>
    <li><button class="term" data-n="onprem" style="--tone:var(--request)"><b>On-premise</b><span>Sur les serveurs de l’entreprise, pas chez un fournisseur. Prompts, réponses et logs restent en interne.</span></button></li>
    <li><button class="term" data-n="openweights" style="--tone:var(--request)"><b>Modèle open-weights</b><span>Un modèle dont les poids se téléchargent et tournent sur vos propres GPU, sans appel à son éditeur.</span></button></li>
    <li><button class="term" data-n="frontier" style="--tone:var(--orchestrator)"><b>Modèle frontière</b><span>L’un des modèles les plus performants du moment, en général accessible uniquement via le cloud de son fournisseur.</span></button></li>
    <li><button class="term" data-n="endpoint" style="--tone:var(--orchestrator)"><b>Endpoint privé</b><span>L’accès à un modèle cloud par un lien chiffré dédié, dans une région choisie, hors de l’internet public.</span></button></li>
    <li><button class="term" data-n="gateway" style="--tone:var(--mcp)"><b>Passerelle de routage</b><span>Le point de contrôle qui envoie chaque donnée vers le modèle autorisé pour sa sensibilité.</span></button></li>
    <li><button class="term" data-n="levels" style="--tone:var(--c2)"><b>Niveau de sensibilité</b><span>L’étiquette de chaque donnée, ici de C1 à C3, qui fixe où elle peut aller.</span></button></li>
    <li><button class="term" data-n="anon" style="--tone:var(--c2)"><b>Anonymisation</b><span>Masque les noms et transforme les chiffres exacts en tranches. Avec une table de correspondance interne, c’est en toute rigueur une pseudonymisation.</span></button></li>
    <li><button class="term" data-n="zdr" style="--tone:var(--c1)"><b>Zéro rétention</b><span>Un engagement contractuel : le fournisseur ne garde rien une fois la réponse envoyée et n’entraîne aucun modèle dessus.</span></button></li>
  </ul>
</section>
</main>
<script>
(function () {
  document.querySelectorAll(".slide").forEach((slide) => {
    const svg = slide.querySelector("svg.diagram");
    const terms = [...slide.querySelectorAll(".term")];
    let pinned = null;
    function show(term) {
      const key = term && term.dataset.n;
      terms.forEach((t) => t.classList.toggle("on", t === term));
      svg.classList.toggle("focus", !!key);
      svg.querySelectorAll("[data-n]").forEach((el) => {
        el.classList.toggle("on", !!key && el.dataset.n.split(" ").includes(key));
      });
    }
    terms.forEach((t) => {
      t.addEventListener("mouseenter", () => show(t));
      t.addEventListener("mouseleave", () => show(pinned));
      t.addEventListener("focus", () => show(t));
      t.addEventListener("blur", () => show(pinned));
      t.addEventListener("click", () => { pinned = pinned === t ? null : t; show(pinned); });
    });
  });
})();

document.querySelectorAll("[data-set-lang]").forEach((b) => b.addEventListener("click", () => {
  document.documentElement.lang = b.dataset.setLang;
  try { localStorage.setItem("mmia-lang", b.dataset.setLang); } catch (e) {}
}));
</script>

<style>

  .glossary li { border-bottom: 1px solid var(--line); }
  .term { width: 100%; display: block; text-align: left; background: none; border: 0; color: inherit; font: inherit; cursor: pointer;

  .term:hover, .term.on { background: rgba(255,255,255,0.04); border-left-color: var(--tone); }
  .term:focus-visible { outline: 2px solid var(--mcp); outline-offset: -2px; }
  .term b { display: block; font-size: calc(var(--u) * 1.06); font-weight: 600; color: var(--tone); margin-bottom: calc(var(--u) * .18); }
  .term span { display: block; font-size: calc(var(--u) * .92); line-height: 1.38; color: var(--muted); }
  .term.on span { color: var(--text); }

  .n, .wire { transition: opacity .25s; }
  .n .base { fill: var(--card); stroke: var(--line); stroke-width: 1.2; transition: stroke .25s; }
  svg.focus .n:not(.on), svg.focus .wire:not(.on) { opacity: .22; }
  .n.on .base { stroke: var(--tone); stroke-width: 2; }

  .nav { position: fixed; top: 18px; right: 20px; display: flex; gap: 8px; z-index: 5; }
  .nav a { font: 500 12px 'Inter', sans-serif; color: var(--muted); text-decoration: none; padding: 6px 10px;

  .nav a:hover { color: var(--text); }

    .term b { font-size: 16px; } .term span { font-size: 14px; }
    .glossary h1 { font-size: 11px; margin-top: 24px; }
  }

  :root { --c3: #F27A7A; --c2: #F5A55A; --c1: #34D399; }
  html[lang="en"] [data-lang="fr"], html[lang="fr"] [data-lang="en"] { display: none; }
  .nav button { font: 500 12px 'JetBrains Mono', monospace; color: var(--muted); padding: 6px 9px; cursor: pointer;

  .nav button:hover { color: var(--text); }
  html[lang="en"] .nav button.en, html[lang="fr"] .nav button.fr { color: var(--bg); background: var(--mcp); border-color: var(--mcp); }
  .diagram text { font-family: 'Inter', sans-serif; }

  /* ten terms instead of seven: tighter rows */

<section class="glossary" aria-label="Key vocabulary">
  <h1>Key vocabulary</h1>
  <ul>
    <li><button class="term" data-n="chatbot" style="--tone:var(--request)"><b>Chatbot</b><span>A conversation: you ask, the model answers in text. Every next step is yours.</span></button></li>
    <li><button class="term" data-n="prompt" style="--tone:var(--request)"><b>Prompt</b><span>Everything the model sees when it answers: your request, plus whatever you or the system add to it.</span></button></li>
    <li><button class="term" data-n="tools" style="--tone:var(--mcp)"><b>Tool calling</b><span>The model asks for a function to run, such as a search, an API or a database query, and reads the result.</span></button></li>
    <li><button class="term" data-n="agent" style="--tone:var(--orchestrator)"><b>Agent</b><span>A model given a goal, tools and the right to chain steps on its own until the goal is reached.</span></button></li>
    <li><button class="term" data-n="loop" style="--tone:var(--orchestrator)"><b>Agentic loop</b><span>Plan, act, check, start again. With a chatbot, you are the loop; with an agent, the software is.</span></button></li>
    <li><button class="term" data-n="harness" style="--tone:var(--orchestrator)"><b>Harness</b><span>The program around the model that runs the loop, calls the tools and keeps the memory.</span></button></li>
    <li><button class="term" data-n="mcp" style="--tone:var(--mcp)"><b>MCP</b><span>Model Context Protocol: the open standard that plugs agents into company tools and data.</span></button></li>

<section class="glossary" aria-label="Vocabulaire clé">
  <h1>Vocabulaire clé</h1>
  <ul>
    <li><button class="term" data-n="chatbot" style="--tone:var(--request)"><b>Chatbot</b><span>Une conversation : vous demandez, le modèle répond par du texte. La suite, c’est vous qui la faites.</span></button></li>
    <li><button class="term" data-n="prompt" style="--tone:var(--request)"><b>Prompt</b><span>Tout ce que le modèle voit au moment de répondre : votre demande, plus ce que vous ou le système y ajoutez.</span></button></li>
    <li><button class="term" data-n="tools" style="--tone:var(--mcp)"><b>Appel d’outils</b><span>Le modèle demande l’exécution d’une fonction (recherche, API, requête en base) et lit le résultat.</span></button></li>
    <li><button class="term" data-n="agent" style="--tone:var(--orchestrator)"><b>Agent</b><span>Un modèle à qui l’on donne un objectif, des outils et le droit d’enchaîner les étapes seul jusqu’au résultat.</span></button></li>
    <li><button class="term" data-n="loop" style="--tone:var(--orchestrator)"><b>Boucle agentique</b><span>Planifier, agir, vérifier, recommencer. Avec un chatbot, la boucle, c’est vous ; avec un agent, c’est le logiciel.</span></button></li>
    <li><button class="term" data-n="harness" style="--tone:var(--orchestrator)"><b>Harness</b><span>Le programme autour du modèle qui fait tourner la boucle, appelle les outils et garde la mémoire.</span></button></li>
    <li><button class="term" data-n="mcp" style="--tone:var(--mcp)"><b>MCP</b><span>Model Context Protocol : le standard ouvert qui branche les agents sur les outils et les données de l’entreprise.</span></button></li>
    <li><button class="term" data-n="hitl" style="--tone:var(--request)"><b>Humain dans la boucle</b><span>Un point de contrôle où une personne valide avant une action sensible : envoyer un e-mail, payer…</span></button></li>
    <li><button class="term" data-n="autonomy" style="--tone:var(--mcp)"><b>Autonomie</b><span>La part du travail que la machine enchaîne sans demander. Elle grandit par paliers, avec les garde-fous.</span></button></li>
  </ul>
</section>

<script>
(function () {
  document.querySelectorAll(".slide").forEach((slide) => {
    const svg = slide.querySelector("svg.diagram");
    const terms = [...slide.querySelectorAll(".term")];
    let pinned = null;
    function show(term) {
      const key = term && term.dataset.n;
      terms.forEach((t) => t.classList.toggle("on", t === term));
      svg.classList.toggle("focus", !!key);
      svg.querySelectorAll("[data-n]").forEach((el) => {
        el.classList.toggle("on", !!key && el.dataset.n.split(" ").includes(key));
      });
    }
    terms.forEach((t) => {
      t.addEventListener("mouseenter", () => show(t));
      t.addEventListener("mouseleave", () => show(pinned));
      t.addEventListener("focus", () => show(t));
      t.addEventListener("blur", () => show(pinned));
      t.addEventListener("click", () => { pinned = pinned === t ? null : t; show(pinned); });
    });
  });
})();

const backLink = document.querySelector("[data-back]");
const backBase = backLink.getAttribute("href");
const syncBack = () => { backLink.href = `${backBase}${backBase.includes("?") ? "&" : "?"}lang=${document.documentElement.lang}`; };
syncBack();
document.querySelectorAll("[data-set-lang]").forEach((b) => b.addEventListener("click", () => {
  document.documentElement.lang = b.dataset.setLang;
  try { localStorage.setItem("mmia-lang", b.dataset.setLang); } catch (e) {}
  syncBack();
}));
</script>

<style>
:root {
  --bg: #FAFAF8;
  --surface: #FFFFFF;
  --sunk: #F3F3F0;
  --ink: #17181C;
  --ink-2: #45474E;
  --muted: #7A7D85;
  --line: #E6E6E2;
  --line-strong: #D2D2CC;
  --accent: #D8432E;
  --accent-ink: #B5361F;
  --accent-soft: #FBEAE6;
  --ok: #2F8F5B;
  --warn: #B7791F;
  --new: #6B4FBB;
  --info: #2F6FB5;
  --shadow-sm: 0 1px 2px rgba(20,20,25,.05);
  --shadow: 0 1px 2px rgba(20,20,25,.04), 0 12px 32px -16px rgba(20,20,25,.18);
  --f-ui: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --f-read: "Newsreader", Georgia, "Times New Roman", serif;
  --r: 10px;
  --header-h: 60px;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #0F1013;
  --surface: #17181C;
  --sunk: #1D1E23;
  --ink: #EDEDEF;
  --ink-2: #BDBFC6;
  --muted: #8E919A;
  --line: #2A2C32;
  --line-strong: #3A3D44;
  --accent: #F0644E;
  --accent-ink: #FF8571;
  --accent-soft: #3A1E19;
  --ok: #5BC48A;
  --warn: #E0A84A;
  --new: #A68BEB;
  --info: #6FA8E8;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.3);
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 16px 40px -16px rgba(0,0,0,.6);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-ui);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
::selection { background: var(--accent-soft); }

/* ── Header ── */
.site-header {
  position: sticky; top: 0; z-index: 900;
  height: var(--header-h);
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  -webkit-backdrop-filter: saturate(1.4) blur(12px);
  backdrop-filter: saturate(1.4) blur(12px);
  border-bottom: 1px solid var(--line);
  flex-shrink: 0;
}
.sh-inner {
  height: 100%;
  display: flex; align-items: center; gap: 28px;
  padding: 0 max(20px, env(safe-area-inset-right, 0px)) 0 max(20px, env(safe-area-inset-left, 0px));
}
.sh-logo {
  display: flex; align-items: center; gap: 10px;
  color: var(--ink); text-decoration: none;
  font-weight: 600; font-size: 15px; letter-spacing: -0.01em; white-space: nowrap;
}
.sh-logo svg { width: 26px; height: 26px; flex-shrink: 0; }
.sh-nav { display: flex; align-items: center; gap: 4px; }
.sh-group { position: relative; }
.sh-link {
  display: inline-flex; align-items: center; gap: 5px;
  height: 34px; padding: 0 10px;
  font: 500 14px/1 var(--f-ui); color: var(--ink-2);
  background: none; border: 0; border-radius: 8px; cursor: pointer;
  text-decoration: none; white-space: nowrap; position: relative;
  transition: color .15s, background .15s;
}
.sh-link:hover, .sh-group.open > .sh-link { color: var(--ink); background: var(--sunk); }
.sh-link.active { color: var(--ink); }
.sh-link.active::after {
  content: ""; position: absolute; left: 10px; right: 10px; bottom: -13px;
  height: 2px; border-radius: 2px; background: var(--accent);
}
.sh-caret { width: 10px; height: 10px; opacity: .55; transition: transform .15s; }
.sh-group.open .sh-caret { transform: rotate(180deg); }
.sh-menu {
  display: none;
  position: absolute; top: calc(100% + 10px); left: -8px;
  min-width: 340px; max-height: calc(100vh - 90px); overflow-y: auto;
  padding: 8px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  box-shadow: var(--shadow);
}
.sh-menu.wide { min-width: 640px; display: none; grid-template-columns: 1fr 1fr; gap: 4px 8px; }
.sh-group.open > .sh-menu { display: block; }
.sh-group.open > .sh-menu.wide { display: grid; }
@media (hover: hover) and (min-width: 900px) {
  .sh-group:hover > .sh-menu { display: block; }
  .sh-group:hover > .sh-menu.wide { display: grid; }
  .sh-group:hover .sh-caret { transform: rotate(180deg); }
  .sh-menu::before { content: ""; position: absolute; left: 0; right: 0; top: -12px; height: 12px; }
}
.sh-menu-col { display: grid; gap: 2px; align-content: start; }
.sh-menu-label {
  padding: 10px 10px 4px;
  font: 500 11px/1 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--accent-ink);
}
.sh-menu-label:not(:first-child) { margin-top: 8px; padding-top: 14px; border-top: 1px solid var(--line); }
.sh-item {
  display: grid; gap: 2px;
  padding: 8px 10px; border-radius: 8px;
  color: var(--ink); text-decoration: none;
  transition: background .12s;
}
.sh-item:hover, .sh-item.active { background: var(--sunk); }
.sh-item-title { font-size: 14px; font-weight: 500; line-height: 1.3; }
.sh-item-desc { font-size: 12.5px; color: var(--muted); line-height: 1.4; }
.sh-item.active .sh-item-title::before {
  content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%;
  background: var(--accent); margin-right: 7px; vertical-align: 2px;
}
.sh-menu-foot {
  grid-column: 1 / -1; margin-top: 4px; padding: 10px; border-top: 1px solid var(--line);
  font-size: 13px; color: var(--muted);
}
.sh-menu-foot a { color: var(--ink); font-weight: 500; text-decoration: none; }
.sh-menu-foot a:hover { color: var(--accent); }

.sh-context {
  display: flex; align-items: baseline; gap: 10px; min-width: 0;
  font-size: 14px; color: var(--muted);
}
.sh-context .sh-sep { color: var(--line-strong); }
.sh-context .sh-title {
  color: var(--ink); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.sh-context .sh-meta { font: 12px var(--f-mono); color: var(--muted); white-space: nowrap; }

.sh-right { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.lang-toggle {
  display: inline-flex; padding: 2px; gap: 2px;
  border: 1px solid var(--line); border-radius: 9px; background: var(--bg);
}
.lang-btn {
  height: 28px; min-width: 34px; padding: 0 8px;
  font: 500 12px/1 var(--f-mono); letter-spacing: .02em;
  color: var(--muted); background: none; border: 0; border-radius: 7px; cursor: pointer;
  transition: color .15s, background .15s;
}
.lang-btn:hover { color: var(--ink); }
.lang-btn.active { background: var(--ink); color: var(--surface); }
.icon-btn {
  width: 34px; height: 34px; display: inline-grid; place-items: center;
  color: var(--ink-2); background: none; border: 1px solid var(--line); border-radius: 9px; cursor: pointer;
  transition: color .15s, border-color .15s, background .15s;
}
.icon-btn:hover { color: var(--ink); border-color: var(--line-strong); background: var(--sunk); }
.icon-btn svg { width: 16px; height: 16px; }
.theme-btn .i-sun { display: none; }
:root[data-theme="dark"] .theme-btn .i-sun { display: block; }
:root[data-theme="dark"] .theme-btn .i-moon { display: none; }
.sh-burger { display: none; }

@media (max-width: 1100px) {
  .sh-context .sh-meta { display: none; }
}
@media (max-width: 960px) {
  .sh-inner { gap: 14px; }
  .sh-context { display: none; }
}
@media (max-width: 899px) {
  .sh-burger { display: inline-grid; }
  .sh-nav {
    display: none;
    position: fixed; left: 0; right: 0; top: var(--header-h); bottom: 0;
    flex-direction: column; align-items: stretch; gap: 2px;
    padding: 12px max(16px, env(safe-area-inset-right, 0px)) 32px max(16px, env(safe-area-inset-left, 0px));
    background: var(--surface); overflow-y: auto;
    border-top: 1px solid var(--line);
  }
  body.sh-menu-open .sh-nav { display: flex; }
  /* backdrop-filter would make the header the containing block of the fixed menu */
  body.sh-menu-open .site-header { -webkit-backdrop-filter: none; backdrop-filter: none; background: var(--surface); }
  body.sh-menu-open { overflow: hidden; }
  .sh-link { height: 44px; font-size: 16px; justify-content: space-between; width: 100%; }
  .sh-link.active::after { display: none; }
  .sh-link.active { color: var(--accent); }
  .sh-menu, .sh-menu.wide {
    position: static; min-width: 0; max-height: none; box-shadow: none; border: 0;
    padding: 0 0 8px 8px; grid-template-columns: 1fr;
  }
  .sh-item-desc { display: none; }
  .sh-right #gs-trigger .gs-placeholder, .sh-right #gs-trigger .gs-kbd { display: none; }
  .sh-right #gs-trigger { min-width: 0; width: 34px; height: 34px; padding: 0; justify-content: center; }
}

/* ── Footer ── */
.site-footer {
  border-top: 1px solid var(--line);
  padding: 28px max(20px, env(safe-area-inset-right, 0px)) 36px max(20px, env(safe-area-inset-left, 0px));
  color: var(--muted); font-size: 13px;
}
.sf-inner { max-width: 1180px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; justify-content: space-between; }
.sf-inner a { color: var(--ink-2); text-decoration: none; }
.sf-inner a:hover { color: var(--accent); }
.sf-links { display: flex; gap: 18px; flex-wrap: wrap; }

/* ── Shared building blocks ── */
.eyebrow {
  font: 500 12px/1.2 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
}
.chip {
  display: inline-flex; align-items: center; gap: 5px;
  font: 500 11px/1 var(--f-mono); letter-spacing: .02em;
  padding: 4px 8px; border-radius: 99px; border: 1px solid var(--line); color: var(--ink-2); background: var(--surface);
  white-space: nowrap;
}
.chip.dot::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.chip.st-stable { color: var(--ok); }
.chip.st-evolving { color: var(--warn); }
.chip.st-emerging { color: var(--new); }
.chip.st-deprecated { color: var(--muted); }
.chip.st-draft { color: var(--warn); }
.chip.st-review { color: var(--info); }
.btn {
  display: inline-flex; align-items: center; gap: 8px;
  height: 40px; padding: 0 16px;
  font: 500 14px/1 var(--f-ui); color: var(--ink); text-decoration: none;
  background: var(--surface); border: 1px solid var(--line-strong); border-radius: 9px; cursor: pointer;
  transition: background .15s, border-color .15s, color .15s, transform .15s;
}
.btn:hover { border-color: var(--ink-2); }
.btn.primary { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.btn.primary:hover { background: var(--accent); border-color: var(--accent); }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}
</style>
<style>
  body { background:var(--sunk); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px; height:100vh; height:100dvh; overflow:hidden; padding:16px }
  #slide { background:var(--surface); color:var(--ink); width:min(92vw,1000px); aspect-ratio:16/9; border:1px solid var(--line); border-radius:16px; padding:clamp(24px,5vw,56px) clamp(24px,6vw,72px); display:flex; flex-direction:column; justify-content:center; box-shadow:var(--shadow); position:relative; overflow:hidden; font-size:clamp(12px,1.6vw,18px) }
  #slide h1 { font-size:2.6em; font-weight:600; letter-spacing:-.03em; line-height:1.05; margin:0 0 14px }

  ul { list-style:none; display:flex; flex-direction:column; gap:10px; margin:0; padding:0 }

  .sd { display:inline-block; width:.5em; height:.5em; border-radius:50%; flex-shrink:0; transform:translateY(-.1em) }
  .sd-stable { background:var(--ok) } .sd-evolving { background:var(--warn) }
  .sd-emerging { background:var(--new) } .sd-deprecated { background:var(--muted) }
  .node-desc { font-family:var(--f-read); font-size:1.15em; color:var(--ink); line-height:1.6; margin:4px 0 0; max-width:38em }
  .slide-status { position:absolute; bottom:24px; right:clamp(24px,6vw,72px); font:500 .7em/1 var(--f-mono); letter-spacing:.04em; padding:5px 10px; border-radius:99px; border:1px solid currentColor }
  .status-stable { color:var(--ok) }
  .status-evolving { color:var(--warn) }
  .status-emerging { color:var(--new) }
  .status-deprecated { color:var(--muted) }
  .stat { font-size:1.5em; font-weight:600; margin:0 }
  .generated-from { font:.8em var(--f-mono); color:var(--muted); margin-top:12px }
  #nav { display:flex; align-items:center; gap:14px }
  .nav-btn { width:44px; height:44px; display:grid; place-items:center; background:var(--surface); color:var(--ink); border:1px solid var(--line-strong); border-radius:12px; font-size:1.1em; cursor:pointer; transition:background .15s, border-color .15s }
  .nav-btn:hover { border-color:var(--ink) }
  .nav-btn:disabled { opacity:.35; cursor:default }
  #counter { color:var(--muted); font:13px var(--f-mono); min-width:80px; text-align:center }
  #progress { position:absolute; bottom:0; left:0; height:3px; background:var(--accent); transition:width .3s }
  .slides-top { position:fixed; top:max(16px, env(safe-area-inset-top, 0px)); left:16px; right:16px; display:flex; justify-content:space-between; align-items:center; gap:10px }
  .slides-top a { font-size:14px; color:var(--ink-2); text-decoration:none }
  .slides-top a:hover { color:var(--accent) }
</style>

<script>
const ALL_SLIDES = { en: ["<div class=\"slide-type-title\"><div class=\"slide-title-content\"><h1>AI Agents</h1><p class=\"subtitle\">AI / LLM Ecosystem</p></div></div>", "<div class=\"slide-layer-num\">Layer 3</div><h2>FRAMEWORKS</h2><ul><li><span class=\"sd sd-evolving\"></span> <strong>LangGraph</strong> \u2014 LangChain's framework for stateful, multi-step agent workflows.\nModels agent logic as a directed graph: nodes are LLM calls or tools, edges are transitions.\nBuilt-in: persistence (checkpoint state), human-in-the-loop, streaming, time-travel debugging.\nBest for complex workflows that need branching, loops and state management.\nThe production-grade choice for teams already using LangChain..</li><li><span class=\"sd sd-evolving\"></span> <strong>CrewAI</strong> \u2014 Role-based multi-agent framework.</li><li><span class=\"sd sd-evolving\"></span> <strong>AutoGen / AG2</strong> \u2014 Microsoft Research's multi-agent framework.</li><li><span class=\"sd sd-evolving\"></span> <strong>Anthropic Agent SDK</strong> \u2014 Anthropic's official Python SDK for building agents with Claude.\nLightweight by design \u2014 close to the raw API, minimal abstraction.\nBuilt-in tool use, streaming, and MCP client integration.\nClaude Code itself is built on this SDK.\nPhilosophy: explicit > magic.</li></ul>", "<div class=\"slide-layer-num\">Layer 2</div><h2>AGENT PATTERNS</h2><ul><li><span class=\"sd sd-stable\"></span> <strong>ReAct</strong> \u2014 Reasoning + Acting.</li><li><span class=\"sd sd-evolving\"></span> <strong>Plan & Execute</strong> \u2014 Separates planning from execution into two distinct phases.\nPhase 1 (Planner): the LLM creates a complete step-by-step plan upfront.\nPhase 2 (Executor): each step is executed in order, with the plan updated if needed.\nBetter for complex, multi-step tasks where a global view improves efficiency.\nMore predictable than ReAct \u2014 easier to debug and interrupt..</li><li><span class=\"sd sd-evolving\"></span> <strong>Multi-Agent</strong> \u2014 Multiple specialized agents working together, each handling a specific sub-task.\nPatterns: Supervisor (one agent routes tasks to specialists), Pipeline (sequential handoffs),\nSwarm (peer-to-peer collaboration between agents).\nWhen to use: task exceeds a single context window, parallelizable sub-tasks,\ndifferent sub-tasks need different tools or model strengths.\nChallenge: inter-agent communication errors compound \u2014 keep interfaces simple..</li></ul>", "<div class=\"slide-layer-num\">Layer 1</div><h2>BUILDING BLOCKS</h2><ul><li><span class=\"sd sd-evolving\"></span> <strong>Planning</strong> \u2014 The agent's ability to break a goal into steps before acting.\nApproaches: direct generation (LLM lists steps), tree-of-thought (explores branches),\nReAct (interleaves reasoning and action), Plan-then-Execute (separate planning and execution phases).\nBetter planning = fewer wasted tool calls = lower cost and higher success rate.\nKey insight (Anthropic): simple, explicit prompts often outperform complex planning frameworks..</li><li><span class=\"sd sd-evolving\"></span> <strong>Memory</strong> \u2014 How an agent retains and retrieves information across steps and sessions.\nFour types: in-context (in the prompt, temporary), external (vector DB, persistent),\nepisodic (past interactions, retrieved by similarity), semantic (structured facts/knowledge).\nMemory is often the hardest part of building production agents.\nLarge context windows (200k+) reduce the need for explicit memory management..</li><li><span class=\"sd sd-stable\"></span> <strong>Tool Use</strong> \u2014 The agent's ability to call external functions: web search, database queries, code execution,\nAPI calls, file operations, email/calendar\u2026\nTool use is what transforms a chatbot into an agent \u2014 the ability to ACT, not just respond.\nMCP (Model Context Protocol) standardizes how tools are declared and called across models.\nKey design principle: give the agent the minimum set of tools needed for the task..</li><li><span class=\"sd sd-evolving\"></span> <strong>Orchestration</strong> \u2014 Managing the flow of execution: which agent runs when, how agents communicate,\nhandling errors, retries and interruptions.\nSingle-agent: one LLM loops until done.</li></ul>", "<div class=\"slide-node-layer\">FRAMEWORKS</div><h2><span class=\"sd sd-evolving\"></span> LangGraph</h2><p class=\"node-desc\">LangChain's framework for stateful, multi-step agent workflows.<br>Models agent logic as a directed graph: nodes are LLM calls or tools, edges are transitions.<br>Built-in: persistence (checkpoint state), human-in-the-loop, streaming, time-travel debugging.<br>Best for complex workflows that need branching, loops and state management.<br>The production-grade choice for teams already using LangChain.</p><span class=\"slide-status status-evolving\">evolving</span>", "<div class=\"slide-node-layer\">FRAMEWORKS</div><h2><span class=\"sd sd-evolving\"></span> CrewAI</h2><p class=\"node-desc\">Role-based multi-agent framework. Define agents with roles, goals and backstories;<br>assign tasks; let agents collaborate as a \"crew\".<br>Intuitive abstraction for non-ML teams: think \"hire a team of AI specialists\".<br>Built-in memory, process management (sequential, hierarchical, parallel).<br>Large community, fast-growing ecosystem. Good for business process automation.</p><span class=\"slide-status status-evolving\">evolving</span>", "<div class=\"slide-node-layer\">FRAMEWORKS</div><h2><span class=\"sd sd-evolving\"></span> AutoGen / AG2</h2><p class=\"node-desc\">Microsoft Research's multi-agent framework. Agents communicate via a conversational interface \u2014<br>each agent has a role and responds to messages from other agents.<br>Strong for: code generation + execution loops, research tasks, debate-style reasoning.<br>AG2 is the community fork (post-Microsoft). Supports human-in-the-loop naturally.<br>Best for research prototyping and technical automation tasks.</p><span class=\"slide-status status-evolving\">evolving</span>", "<div class=\"slide-node-layer\">FRAMEWORKS</div><h2><span class=\"sd sd-evolving\"></span> Anthropic Agent SDK</h2><p class=\"node-desc\">Anthropic's official Python SDK for building agents with Claude.<br>Lightweight by design \u2014 close to the raw API, minimal abstraction.<br>Built-in tool use, streaming, and MCP client integration.<br>Claude Code itself is built on this SDK.<br>Philosophy: explicit > magic. You control the loop, the SDK handles API communication.<br>Best for teams who want full control without framework overhead.</p><span class=\"slide-status status-evolving\">evolving</span>", "<div class=\"slide-node-layer\">AGENT PATTERNS</div><h2><span class=\"sd sd-stable\"></span> ReAct</h2><p class=\"node-desc\">Reasoning + Acting. The dominant single-agent pattern.<br>Loop: Thought (LLM reasons about what to do) \u2192 Action (call a tool) \u2192 Observation (tool result) \u2192 repeat.<br>Simple, interpretable, works well for tool-using tasks.<br>Limitation: no long-horizon planning, can get stuck in loops.<br>Used by default in most LangChain and LlamaIndex agent implementations.</p><span class=\"slide-status status-stable\">stable</span>", "<div class=\"slide-node-layer\">AGENT PATTERNS</div><h2><span class=\"sd sd-evolving\"></span> Plan & Execute</h2><p class=\"node-desc\">Separates planning from execution into two distinct phases.<br>Phase 1 (Planner): the LLM creates a complete step-by-step plan upfront.<br>Phase 2 (Executor): each step is executed in order, with the plan updated if needed.<br>Better for complex, multi-step tasks where a global view improves efficiency.<br>More predictable than ReAct \u2014 easier to debug and interrupt.</p><span class=\"slide-status status-evolving\">evolving</span>", "<div class=\"slide-node-layer\">AGENT PATTERNS</div><h2><span class=\"sd sd-evolving\"></span> Multi-Agent</h2><p class=\"node-desc\">Multiple specialized agents working together, each handling a specific sub-task.<br>Patterns: Supervisor (one agent routes tasks to specialists), Pipeline (sequential handoffs),<br>Swarm (peer-to-peer collaboration between agents).<br>When to use: task exceeds a single context window, parallelizable sub-tasks,<br>different sub-tasks need different tools or model strengths.<br>Challenge: inter-agent communication errors compound \u2014 keep interfaces simple.</p><span class=\"slide-status status-evolving\">evolving</span>", "<div class=\"slide-node-layer\">BUILDING BLOCKS</div><h2><span class=\"sd sd-evolving\"></span> Planning</h2><p class=\"node-desc\">The agent's ability to break a goal into steps before acting.<br>Approaches: direct generation (LLM lists steps), tree-of-thought (explores branches),<br>ReAct (interleaves reasoning and action), Plan-then-Execute (separate planning and execution phases).<br>Better planning = fewer wasted tool calls = lower cost and higher success rate.<br>Key insight (Anthropic): simple, explicit prompts often outperform complex planning frameworks.</p><span class=\"slide-status status-evolving\">evolving</span>", "<div class=\"slide-node-layer\">BUILDING BLOCKS</div><h2><span class=\"sd sd-evolving\"></span> Memory</h2><p class=\"node-desc\">How an agent retains and retrieves information across steps and sessions.<br>Four types: in-context (in the prompt, temporary), external (vector DB, persistent),<br>episodic (past interactions, retrieved by similarity), semantic (structured facts/knowledge).<br>Memory is often the hardest part of building production agents.<br>Large context windows (200k+) reduce the need for explicit memory management.</p><span class=\"slide-status status-evolving\">evolving</span>", "<div class=\"slide-node-layer\">BUILDING BLOCKS</div><h2><span class=\"sd sd-stable\"></span> Tool Use</h2><p class=\"node-desc\">The agent's ability to call external functions: web search, database queries, code execution,<br>API calls, file operations, email/calendar\u2026<br>Tool use is what transforms a chatbot into an agent \u2014 the ability to ACT, not just respond.<br>MCP (Model Context Protocol) standardizes how tools are declared and called across models.<br>Key design principle: give the agent the minimum set of tools needed for the task.</p><span class=\"slide-status status-stable\">stable</span>", "<div class=\"slide-node-layer\">BUILDING BLOCKS</div><h2><span class=\"sd sd-evolving\"></span> Orchestration</h2><p class=\"node-desc\">Managing the flow of execution: which agent runs when, how agents communicate,<br>handling errors, retries and interruptions.<br>Single-agent: one LLM loops until done. Multi-agent: specialized sub-agents<br>handle different parts of a task, orchestrated by a supervisor agent.<br>Human-in-the-loop: checkpoints where a human approves before the agent continues.<br>The more autonomous the agent, the more critical robust orchestration becomes.</p><span class=\"slide-status status-evolving\">evolving</span>", "<div class=\"slide-type-title\"><div class=\"slide-title-content\"><h2>Summary</h2><p class=\"stat\">11 concepts</p><p class=\"stat\">3 layers</p><p class=\"generated-from\">AI Agents</p></div></div>"], fr: ["<div class=\"slide-type-title\"><div class=\"slide-title-content\"><h1>Agents IA</h1><p class=\"subtitle\">\u00c9cosyst\u00e8me IA / LLM</p></div></div>", "<div class=\"slide-layer-num\">Layer 3</div><h2>FRAMEWORKS</h2><ul><li><span class=\"sd sd-evolving\"></span> <strong>LangGraph</strong> \u2014 Le framework de LangChain pour les workflows d'agents avec \u00e9tat et multi-\u00e9tapes.\nMod\u00e9lise la logique d'agent comme un graphe dirig\u00e9 : les n\u0153uds sont des appels LLM ou outils, les ar\u00eates sont des transitions.\nInt\u00e9gr\u00e9 : persistance (\u00e9tat checkpoint), human-in-the-loop, streaming, d\u00e9bogage time-travel.\nId\u00e9al pour les workflows complexes n\u00e9cessitant des branchements, boucles et gestion d'\u00e9tat..</li><li><span diff\u00e9rents outils ou forces de mod\u00e8les..</li></ul>", "<div class=\"slide-layer-num\">Layer 1</div><h2>BRIQUES FONDAMENTALES</h2><ul><li><span class=\"sd sd-evolving\"></span> <strong>Planification</strong> \u2014 La capacit\u00e9 de l'agent \u00e0 d\u00e9composer un objectif en \u00e9tapes avant d'agir.\nApproches : g\u00e9n\u00e9ration directe (le LLM liste les \u00e9tapes), tree-of-thought (exploration de branches),\nReAct (raisonnement et action entrelac\u00e9s), Plan-then-Execute (phases de planification et d'ex\u00e9cution s\u00e9par\u00e9es).\nMeilleure planification = moins d'appels d'outils inutiles = co\u00fbt r\u00e9duit et taux de succ\u00e8s plus \u00e9lev\u00e9..</li><li><span class=\"sd sd-evolving\"></span> <strong>M\u00e9moire</strong> \u2014 Comment un agent retient et r\u00e9cup\u00e8re des informations entre les \u00e9tapes et les sessions.\nQuatre types : in-context (dans le prompt, temporaire), externe (DB vectorielle, persistant),\n\u00e9pisodique (interactions pass\u00e9es, r\u00e9cup\u00e9r\u00e9es par similarit\u00e9), s\u00e9mantique (faits/connaissances structur\u00e9s).\nLa m\u00e9moire est souvent la partie la plus difficile des agents en production..</li><li><span class=\"sd sd-stable\"></span> <strong>Utilisation d'Outils</strong> \u2014 La capacit\u00e9 de l'agent \u00e0 appeler des fonctions externes : recherche web, requ\u00eates DB, ex\u00e9cution de code,\nappels API, op\u00e9rations fichiers, email/calendrier\u2026\nL'utilisation d'outils transforme un chatbot en agent \u2014 la capacit\u00e9 d'AGIR, pas seulement de r\u00e9pondre.\nMCP (Model Context Protocol) standardise comment les outils sont d\u00e9clar\u00e9s et appel\u00e9s.\nPrincipe de conception cl\u00e9 : donner \u00e0 l'agent le minimum d'outils n\u00e9cessaires pour la t\u00e2che..</li><li><span class=\"sd sd-evolving\"></span> <strong>Orchestration</strong> \u2014 G\u00e9rer le flux d'ex\u00e9cution : quel agent tourne quand, comment les agents communiquen let lang = 'en', cur = 0;
function slides() { return ALL_SLIDES[lang]; }
function render() {
  document.getElementById('slide-content').innerHTML = slides()[cur];
  document.getElementById('counter').textContent = (cur+1) + ' / ' + slides().length;
  document.getElementById('prev').disabled = cur === 0;
  document.getElementById('next').disabled = cur === slides().length - 1;
  document.getElementById('progress').style.width = ((cur+1)/slides().length*100) + '%';
}
function go(d) { cur = Math.max(0, Math.min(slides().length-1, cur+d)); render(); }
function setLang(l) {
  lang = l; cur = 0;
  document.querySelectorAll('#lang-toggle .lang-btn').forEach(b => b.classList.toggle('active', b.textContent === l.toUpperCase()));
  render();
}
document.getElementById('prev').onclick = () => go(-1);
document.getElementById('next').onclick = () => go(1);
document.addEventListener('keydown', e => {
  if (e.key==='ArrowRight'||e.key==='ArrowDown') go(1);
  if (e.key==='ArrowLeft'||e.key==='ArrowUp') go(-1);
});
render();
</script>

      var r = pageSetLang.apply(this, arguments);
      document.querySelectorAll('.site-header [data-en], .site-footer [data-en]').forEach(function (el) {
        el.textContent = l === 'fr' ? (el.dataset.fr || el.dataset.en) : el.dataset.en;
      });
      document.querySelectorAll('.lang-btn').forEach(function (b) { b.classList.toggle('active', b.dataset.lang === l); });
      return r;
    };
    var saved = null;
    try { saved = localStorage.getItem('mmia-lang'); } catch (e) {}
    if (!saved) saved = (navigator.language || '').toLowerCase().indexOf('fr') === 0 ? 'fr' : 'en';
    if (saved !== 'en') window.setLang(saved);
  }
})();
</script>

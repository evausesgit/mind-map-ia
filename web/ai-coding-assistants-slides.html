<style>
:root {
  --bg: #FAFAF8;
  --surface: #FFFFFF;
  --sunk: #F3F3F0;
  --ink: #17181C;
  --ink-2: #45474E;
  --muted: #7A7D85;
  --line: #E6E6E2;
  --line-strong: #D2D2CC;
  --accent: #D8432E;
  --accent-ink: #B5361F;
  --accent-soft: #FBEAE6;
  --ok: #2F8F5B;
  --warn: #B7791F;
  --new: #6B4FBB;
  --info: #2F6FB5;
  --shadow-sm: 0 1px 2px rgba(20,20,25,.05);
  --shadow: 0 1px 2px rgba(20,20,25,.04), 0 12px 32px -16px rgba(20,20,25,.18);
  --f-ui: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --f-read: "Newsreader", Georgia, "Times New Roman", serif;
  --r: 10px;
  --header-h: 60px;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #0F1013;
  --surface: #17181C;
  --sunk: #1D1E23;
  --ink: #EDEDEF;
  --ink-2: #BDBFC6;
  --muted: #8E919A;
  --line: #2A2C32;
  --line-strong: #3A3D44;
  --accent: #F0644E;
  --accent-ink: #FF8571;
  --accent-soft: #3A1E19;
  --ok: #5BC48A;
  --warn: #E0A84A;
  --new: #A68BEB;
  --info: #6FA8E8;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.3);
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 16px 40px -16px rgba(0,0,0,.6);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-ui);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
::selection { background: var(--accent-soft); }

/* ── Header ── */
.site-header {
  position: sticky; top: 0; z-index: 900;
  height: var(--header-h);
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  -webkit-backdrop-filter: saturate(1.4) blur(12px);
  backdrop-filter: saturate(1.4) blur(12px);
  border-bottom: 1px solid var(--line);
  flex-shrink: 0;
}
.sh-inner {
  height: 100%;
  display: flex; align-items: center; gap: 28px;
  padding: 0 max(20px, env(safe-area-inset-right, 0px)) 0 max(20px, env(safe-area-inset-left, 0px));
}
.sh-logo {
  display: flex; align-items: center; gap: 10px;
  color: var(--ink); text-decoration: none;
  font-weight: 600; font-size: 15px; letter-spacing: -0.01em; white-space: nowrap;
}
.sh-logo svg { width: 26px; height: 26px; flex-shrink: 0; }
.sh-nav { display: flex; align-items: center; gap: 4px; }
.sh-group { position: relative; }
.sh-link {
  display: inline-flex; align-items: center; gap: 5px;
  height: 34px; padding: 0 10px;
  font: 500 14px/1 var(--f-ui); color: var(--ink-2);
  background: none; border: 0; border-radius: 8px; cursor: pointer;
  text-decoration: none; white-space: nowrap; position: relative;
  transition: color .15s, background .15s;
}
.sh-link:hover, .sh-group.open > .sh-link { color: var(--ink); background: var(--sunk); }
.sh-link.active { color: var(--ink); }
.sh-link.active::after {
  content: ""; position: absolute; left: 10px; right: 10px; bottom: -13px;
  height: 2px; border-radius: 2px; background: var(--accent);
}
.sh-caret { width: 10px; height: 10px; opacity: .55; transition: transform .15s; }
.sh-group.open .sh-caret { transform: rotate(180deg); }
.sh-menu {
  display: none;
  position: absolute; top: calc(100% + 10px); left: -8px;
  min-width: 340px; max-height: calc(100vh - 90px); overflow-y: auto;
  padding: 8px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  box-shadow: var(--shadow);
}
.sh-menu.wide { min-width: 640px; display: none; grid-template-columns: 1fr 1fr; gap: 4px 8px; }
.sh-group.open > .sh-menu { display: block; }
.sh-group.open > .sh-menu.wide { display: grid; }
@media (hover: hover) and (min-width: 900px) {
  .sh-group:hover > .sh-menu { display: block; }
  .sh-group:hover > .sh-menu.wide { display: grid; }
  .sh-group:hover .sh-caret { transform: rotate(180deg); }
  .sh-menu::before { content: ""; position: absolute; left: 0; right: 0; top: -12px; height: 12px; }
}
.sh-menu-col { display: grid; gap: 2px; align-content: start; }
.sh-menu-label {
  padding: 10px 10px 4px;
  font: 500 11px/1 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--accent-ink);
}
.sh-menu-label:not(:first-child) { margin-top: 8px; padding-top: 14px; border-top: 1px solid var(--line); }
.sh-item {
  display: grid; gap: 2px;
  padding: 8px 10px; border-radius: 8px;
  color: var(--ink); text-decoration: none;
  transition: background .12s;
}
.sh-item:hover, .sh-item.active { background: var(--sunk); }
.sh-item-title { font-size: 14px; font-weight: 500; line-height: 1.3; }
.sh-item-desc { font-size: 12.5px; color: var(--muted); line-height: 1.4; }
.sh-item.active .sh-item-title::before {
  content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%;
  background: var(--accent); margin-right: 7px; vertical-align: 2px;
}
.sh-menu-foot {
  grid-column: 1 / -1; margin-top: 4px; padding: 10px; border-top: 1px solid var(--line);
  font-size: 13px; color: var(--muted);
}
.sh-menu-foot a { color: var(--ink); font-weight: 500; text-decoration: none; }
.sh-menu-foot a:hover { color: var(--accent); }

.sh-context {
  display: flex; align-items: baseline; gap: 10px; min-width: 0;
  font-size: 14px; color: var(--muted);
}
.sh-context .sh-sep { color: var(--line-strong); }
.sh-context .sh-title {
  color: var(--ink); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.sh-context .sh-meta { font: 12px var(--f-mono); color: var(--muted); white-space: nowrap; }

.sh-right { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.lang-toggle {
  display: inline-flex; padding: 2px; gap: 2px;
  border: 1px solid var(--line); border-radius: 9px; background: var(--bg);
}
.lang-btn {
  height: 28px; min-width: 34px; padding: 0 8px;
  font: 500 12px/1 var(--f-mono); letter-spacing: .02em;
  color: var(--muted); background: none; border: 0; border-radius: 7px; cursor: pointer;
  transition: color .15s, background .15s;
}
.lang-btn:hover { color: var(--ink); }
.lang-btn.active { background: var(--ink); color: var(--surface); }
.icon-btn {
  width: 34px; height: 34px; display: inline-grid; place-items: center;
  color: var(--ink-2); background: none; border: 1px solid var(--line); border-radius: 9px; cursor: pointer;
  transition: color .15s, border-color .15s, background .15s;
}
.icon-btn:hover { color: var(--ink); border-color: var(--line-strong); background: var(--sunk); }
.icon-btn svg { width: 16px; height: 16px; }
.theme-btn .i-sun { display: none; }
:root[data-theme="dark"] .theme-btn .i-sun { display: block; }
:root[data-theme="dark"] .theme-btn .i-moon { display: none; }
.sh-burger { display: none; }

@media (max-width: 1100px) {
  .sh-context .sh-meta { display: none; }
}
@media (max-width: 960px) {
  .sh-inner { gap: 14px; }
  .sh-context { display: none; }
}
@media (max-width: 899px) {
  .sh-burger { display: inline-grid; }
  .sh-nav {
    display: none;
    position: fixed; left: 0; right: 0; top: var(--header-h); bottom: 0;
    flex-direction: column; align-items: stretch; gap: 2px;
    padding: 12px max(16px, env(safe-area-inset-right, 0px)) 32px max(16px, env(safe-area-inset-left, 0px));
    background: var(--surface); overflow-y: auto;
    border-top: 1px solid var(--line);
  }
  body.sh-menu-open .sh-nav { display: flex; }
  /* backdrop-filter would make the header the containing block of the fixed menu */
  body.sh-menu-open .site-header { -webkit-backdrop-filter: none; backdrop-filter: none; background: var(--surface); }
  body.sh-menu-open { overflow: hidden; }
  .sh-link { height: 44px; font-size: 16px; justify-content: space-between; width: 100%; }
  .sh-link.active::after { display: none; }
  .sh-link.active { color: var(--accent); }
  .sh-menu, .sh-menu.wide {
    position: static; min-width: 0; max-height: none; box-shadow: none; border: 0;
    padding: 0 0 8px 8px; grid-template-columns: 1fr;
  }
  .sh-item-desc { display: none; }
  .sh-right #gs-trigger .gs-placeholder, .sh-right #gs-trigger .gs-kbd { display: none; }
  .sh-right #gs-trigger { min-width: 0; width: 34px; height: 34px; padding: 0; justify-content: center; }
}

/* ── Footer ── */
.site-footer {
  border-top: 1px solid var(--line);
  padding: 28px max(20px, env(safe-area-inset-right, 0px)) 36px max(20px, env(safe-area-inset-left, 0px));
  color: var(--muted); font-size: 13px;
}
.sf-inner { max-width: 1180px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; justify-content: space-between; }
.sf-inner a { color: var(--ink-2); text-decoration: none; }
.sf-inner a:hover { color: var(--accent); }
.sf-links { display: flex; gap: 18px; flex-wrap: wrap; }

/* ── Shared building blocks ── */
.eyebrow {
  font: 500 12px/1.2 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
}
.chip {
  display: inline-flex; align-items: center; gap: 5px;
  font: 500 11px/1 var(--f-mono); letter-spacing: .02em;
  padding: 4px 8px; border-radius: 99px; border: 1px solid var(--line); color: var(--ink-2); background: var(--surface);
  white-space: nowrap;
}
.chip.dot::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.chip.st-stable { color: var(--ok); }
.chip.st-evolving { color: var(--warn); }
.chip.st-emerging { color: var(--new); }
.chip.st-deprecated { color: var(--muted); }
.chip.st-draft { color: var(--warn); }
.chip.st-review { color: var(--info); }
.btn {
  display: inline-flex; align-items: center; gap: 8px;
  height: 40px; padding: 0 16px;
  font: 500 14px/1 var(--f-ui); color: var(--ink); text-decoration: none;
  background: var(--surface); border: 1px solid var(--line-strong); border-radius: 9px; cursor: pointer;
  transition: background .15s, border-color .15s, color .15s, transform .15s;
}
.btn:hover { border-color: var(--ink-2); }
.btn.primary { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.btn.primary:hover { background: var(--accent); border-color: var(--accent); }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}
</style>
<style>
  body { background:var(--sunk); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px; height:100vh; height:100dvh; overflow:hidden; padding:16px }

  .status-stable { color:var(--ok) }

  #nav { display:flex; align-items:center; gap:14px }

<script>
const ALL_SLIDES = { en: ["<div class=\"slide-type-title\"><div class=\"slide-title-content\"><h1>AI Coding Assistants</h1><p class=\"subtitle\">AI / LLM Ecosystem</p></div></div>", "<div class=\"slide-layer-num\">Layer 2</div><h2>TOOLS</h2><ul><li><span class=\"sd sd-stable\"></span> <strong>GitHub Copilot</strong> \u2014 Microsoft/GitHub's AI coding tool \u2014 the most widely deployed (>1.8M paid users).\nIntegrates into VS Code, JetBrains, Neovim, Visual Studio.\nPowered by GPT-4o and Claude (choice depends on task).</li><li><span class=\"sd sd-evolving\"></span> <strong>Cursor</strong> \u2014 VS Code fork rebuilt for AI-first development.</li><li><span class=\"sd sd-evolving\"></span> <strong>Windsurf (Codeium)</strong> \u2014 Codeium's agentic IDE.</li><li><span class=\"sd sd-evolving\"></span> <strong>Claude Code</strong> \u2014 Anthropic's CLI coding agent.</li><li><span class=\"sd sd-stable\"></span> <strong>Aider</strong> \u2014 Open-source CLI coding assistant.</li><li><span class=\"sd sd-stable\"></span> <strong>Codeium (free)</strong> \u2014 Free AI code completion plugin for 70+ editors.</li></ul>", "<div class=\"slide-layer-num\">Layer 1</div><h2>CATEGORIES</h2><ul><li><span class=\"sd sd-stable\"></span> <strong>IDE Plugins</strong> \u2014 Plugins that add AI assistance to your existing editor (VS Code, JetBrains, Neovim\u2026).\nCore features: inline completion, chat sidebar, code explanation, test generation.\nYou stay in your editor \u2014 the AI assists without taking over.\nBest for: developers who want AI help without changing their workflow..</li><li><span class=\"sd sd-evolving\"></span> <strong>Agentic IDEs</strong> \u2014 Full IDE experiences rebuilt around AI.</li><li><span class=\"sd sd-evolving\"></span> <strong>CLI Agents</strong> \u2014 AI coding agents that run in the terminal.</li></ul>", "<div class=\"slide-node-layer\">TOOLS</div><h2><span class=\"sd sd-stable\"></span> GitHub Copilot</h2><p class=\"node-desc\">Microsoft/GitHub's AI coding tool \u2014 the most widely deployed (>1.8M paid users).<br>Integrates into VS Code, JetBrains, Neovim, Visual Studio.<br>Powered by GPT-4o and Claude (choice depends on task). GitHub Context: understands your entire repo.<br>Copilot Workspace: agentic task completion from issue to PR.<br>Enterprise plan: self-hosted option, policy controls, audit logs. The \"safe\" enterprise choice.</p><span class=\"slide-status status-stable\">stable</span>", "<div class=\"slide-node-layer\">TOOLS</div><h2><span class=\"sd sd-evolving\"></span> Cursor</h2><p class=\"node-desc\">VS Code fork rebuilt for AI-first development. The most popular agentic IDE.<br>Cmd+K: inline edit with natural language. Chat: ask questions about your codebase.<br>Composer/Agent: multi-file autonomous implementation. @codebase: semantic search over your repo.<br>Uses Claude 3.5 Sonnet, GPT-4o and its own cursor-small model.<br>Fastest-growing dev tool of 2024 \u2014 the reference for \"AI-native\" development.</p><span class=\"slide-status status-evolving\">evolving</span>", "<div class=\"slide-node-layer\">TOOLS</div><h2><span class=\"sd sd-evolving\"></span> Windsurf (Codeium)</h2><p class=\"node-desc\">Codeium's agentic IDE. Direct Cursor competitor with a \"Cascade\" agent that maintains<br>full awareness of your codebase and actions taken.<br>Key differentiator: \"Flow\" paradigm \u2014 the agent proactively suggests what to do next,<br>not just reacting to commands.<br>Generous free tier. Acquired by OpenAI in 2025.</p><span class=\"slide-status status-evolving\">evolving</span>", "<div class=\"slide-node-layer\">TOOLS</div><h2><span class=\"sd sd-evolving\"></span> Claude Code</h2><p class=\"node-desc\">Anthropic's CLI coding agent. Runs in the terminal with full access to files, shell, and git.<br>Agentic by design: can plan, implement, test and commit multi-step tasks autonomously.<br>Deep integration with Claude's extended context (200k tokens) \u2014 understands large codebases.<br>Supports MCP servers: extend with custom tools (databases, APIs, internal services).<br>Headless mode: scriptable for CI/CD automation. The power-user and DevOps choice.</p><span class=\"slide-status status-evolving\">evolving</span>", "<div class=\"slide-node-layer\">TOOLS</div><h2><span class=\"sd sd-stable\"></span> Aider</h2><p class=\"node-desc\">Open-source CLI coding assistant. Works with any LLM (Claude, GPT-4, Gemini, local models via Ollama).<br>Git-native: automatically commits changes with meaningful messages.<br>Architect mode: separates planning (expensive model) from editing (cheaper model) for efficiency.<br>No subscription \u2014 you pay only for the API tokens you use.<br>Best for: open-source enthusiasts, cost-conscious developers, custom model setups.</p><span class=\"slide-status status-stable\">stable</span>", "<div class=\"slide-node-layer\">TOOLS</div><h2><span class=\"sd sd-stable\"></span> Codeium (free)</h2><p class=\"node-desc\">Free AI code completion plugin for 70+ editors. Not agentic \u2014 focused on inline completion and chat.<br>Unlimited free tier makes it the default choice for individual developers and students.<br>Supports VS Code, JetBrains, Vim, Emacs, and more.<br>Enterprise version: self-hosted deployment option for data-sensitive environments.</p><span class=\"slide-status status-stable\">stable</span>", "<div class=\"slide-node-layer\">CATEGORIES</div><h2><span class=\"sd sd-stable\"></span> IDE Plugins</h2><p class=\"node-desc\">Plugins that add AI assistance to your existing editor (VS Code, JetBrains, Neovim\u2026).<br>Core features: inline completion, chat sidebar, code explanation, test generation.<br>You stay in your editor \u2014 the AI assists without taking over.<br>Best for: developers who want AI help without changing their workflow.</p><span class=\"slide-status status-stable\">stable</span>", "<div class=\"slide-node-layer\">CATEGORIES</div><h2><span class=\"sd sd-evolving\"></span> Agentic IDEs</h2><p class=\ let lang = 'en', cur = 0;
function slides() { return ALL_SLIDES[lang]; }
function render() {
  document.getElementById('slide-content').innerHTML = slides()[cur];
  document.getElementById('counter').textContent = (cur+1) + ' / ' + slides().length;
  document.getElementById('prev').disabled = cur === 0;
  document.getElementById('next').disabled = cur === slides().length - 1;
  document.getElementById('progress').style.width = ((cur+1)/slides().length*100) + '%';
}
function go(d) { cur = Math.max(0, Math.min(slides().length-1, cur+d)); render(); }
function setLang(l) {
  lang = l; cur = 0;
  document.querySelectorAll('#lang-toggle .lang-btn').forEach(b => b.classList.toggle('active', b.textContent === l.toUpperCase()));
  render();
}
document.getElementById('prev').onclick = () => go(-1);
document.getElementById('next').onclick = () => go(1);
document.addEventListener('keydown', e => {
  if (e.key==='ArrowRight'||e.key==='ArrowDown') go(1);
  if (e.key==='ArrowLeft'||e.key==='ArrowUp') go(-1);
});
render();
</script>

<script>
(function () {
  // Dropdowns: click to toggle (touch + keyboard); hover handled in CSS on desktop.
  document.querySelectorAll('.sh-group > .sh-link').forEach(function (btn) {
    btn.addEventListener('click', function (e) {
      e.stopPropagation();
      var g = btn.parentElement, open = !g.classList.contains('open');
      document.querySelectorAll('.sh-group.open').forEach(function (o) { o.classList.remove('open'); });
      g.classList.toggle('open', open);
      btn.setAttribute('aria-expanded', open);
    });
  });
  document.addEventListener('click', function (e) {
    if (!e.target.closest('.sh-group')) document.querySelectorAll('.sh-group.open').forEach(function (o) { o.classList.remove('open'); });
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      document.querySelectorAll('.sh-group.open').forEach(function (o) { o.classList.remove('open'); });
      document.body.classList.remove('sh-menu-open');
    }
  });

  // Theme
  window.mmiaToggleTheme = function () {
    var dark = document.documentElement.getAttribute('data-theme') !== 'dark';
    if (dark) document.documentElement.setAttribute('data-theme', 'dark');
    else document.documentElement.removeAttribute('data-theme');
    try { localStorage.setItem('mmia-theme', dark ? 'dark' : 'light'); } catch (e) {}
    window.dispatchEvent(new CustomEvent('mmia-themechange', { detail: { dark: dark } }));
  };

  // Language memory: wrap the page's setLang, then restore the saved choice.
  if (typeof window.setLang === 'function') {
    var pageSetLang = window.setLang;
    window.setLang = function (l) {
      try { localStorage.setItem('mmia-lang', l); } catch (e) {}
      document.documentElement.lang = l;
      var r = pageSetLang.apply(this, arguments);
      document.querySelectorAll('.site-header [data-en], .site-footer [data-en]').forEach(function (el) {
        el.textContent = l === 'fr' ? (el.dataset.fr || el.dataset.en) : el.dataset.en;
      });
      document.querySelectorAll('.lang-btn').forEach(function (b) { b.classList.toggle('active', b.dataset.lang === l); });
      return r;
    };
    var saved = null;
    try { saved = localStorage.getItem('mmia-lang'); } catch (e) {}
    if (!saved) saved = (navigator.language || '').toLowerCase().indexOf('fr') === 0 ? 'fr' : 'en';
    if (saved !== 'en') window.setLang(saved);
  }
})();
</script>

<style>
:root {
  --bg: #FAFAF8;
  --surface: #FFFFFF;
  --sunk: #F3F3F0;
  --ink: #17181C;
  --ink-2: #45474E;
  --muted: #7A7D85;
  --line: #E6E6E2;
  --line-strong: #D2D2CC;
  --accent: #D8432E;
  --accent-ink: #B5361F;
  --accent-soft: #FBEAE6;
  --ok: #2F8F5B;
  --warn: #B7791F;
  --new: #6B4FBB;
  --info: #2F6FB5;
  --shadow-sm: 0 1px 2px rgba(20,20,25,.05);
  --shadow: 0 1px 2px rgba(20,20,25,.04), 0 12px 32px -16px rgba(20,20,25,.18);
  --f-ui: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --f-read: "Newsreader", Georgia, "Times New Roman", serif;
  --r: 10px;
  --header-h: 60px;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #0F1013;
  --surface: #17181C;
  --sunk: #1D1E23;
  --ink: #EDEDEF;
  --ink-2: #BDBFC6;
  --muted: #8E919A;
  --line: #2A2C32;
  --line-strong: #3A3D44;
  --accent: #F0644E;
  --accent-ink: #FF8571;
  --accent-soft: #3A1E19;
  --ok: #5BC48A;
  --warn: #E0A84A;
  --new: #A68BEB;
  --info: #6FA8E8;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.3);
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 16px 40px -16px rgba(0,0,0,.6);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-ui);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
::selection { background: var(--accent-soft); }

/* ── Header ── */
.site-header {
  position: sticky; top: 0; z-index: 900;
  height: var(--header-h);
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  -webkit-backdrop-filter: saturate(1.4) blur(12px);
  backdrop-filter: saturate(1.4) blur(12px);
  border-bottom: 1px solid var(--line);
  flex-shrink: 0;
}
.sh-inner {
  height: 100%;
  display: flex; align-items: center; gap: 28px;
  padding: 0 max(20px, env(safe-area-inset-right, 0px)) 0 max(20px, env(safe-area-inset-left, 0px));
}
.sh-logo {
  display: flex; align-items: center; gap: 10px;
  color: var(--ink); text-decoration: none;
  font-weight: 600; font-size: 15px; letter-spacing: -0.01em; white-space: nowrap;
}
.sh-logo svg { width: 26px; height: 26px; flex-shrink: 0; }
.sh-nav { display: flex; align-items: center; gap: 4px; }
.sh-group { position: relative; }
.sh-link {
  display: inline-flex; align-items: center; gap: 5px;
  height: 34px; padding: 0 10px;
  font: 500 14px/1 var(--f-ui); color: var(--ink-2);
  background: none; border: 0; border-radius: 8px; cursor: pointer;
  text-decoration: none; white-space: nowrap; position: relative;
  transition: color .15s, background .15s;
}
.sh-link:hover, .sh-group.open > .sh-link { color: var(--ink); background: var(--sunk); }
.sh-link.active { color: var(--ink); }
.sh-link.active::after {
  content: ""; position: absolute; left: 10px; right: 10px; bottom: -13px;
  height: 2px; border-radius: 2px; background: var(--accent);
}
.sh-caret { width: 10px; height: 10px; opacity: .55; transition: transform .15s; }
.sh-group.open .sh-caret { transform: rotate(180deg); }
.sh-menu {
  display: none;
  position: absolute; top: calc(100% + 10px); left: -8px;
  min-width: 340px; max-height: calc(100vh - 90px); overflow-y: auto;
  padding: 8px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  box-shadow: var(--shadow);
}
.sh-menu.wide { min-width: 640px; display: none; grid-template-columns: 1fr 1fr; gap: 4px 8px; }
.sh-group.open > .sh-menu { display: block; }
.sh-group.open > .sh-menu.wide { display: grid; }
@media (hover: hover) and (min-width: 900px) {
  .sh-group:hover > .sh-menu { display: block; }
  .sh-group:hover > .sh-menu.wide { display: grid; }
  .sh-group:hover .sh-caret { transform: rotate(180deg); }
  .sh-menu::before { content: ""; position: absolute; left: 0; right: 0; top: -12px; height: 12px; }
}
.sh-menu-col { display: grid; gap: 2px; align-content: start; }
.sh-menu-label {
  padding: 10px 10px 4px;
  font: 500 11px/1 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
}
.sh-item {
  display: grid; gap: 2px;
  padding: 8px 10px; border-radius: 8px;
  color: var(--ink); text-decoration: none;
  transition: background .12s;
}
.sh-item:hover, .sh-item.active { background: var(--sunk); }
.sh-item-title { font-size: 14px; font-weight: 500; line-height: 1.3; }
.sh-item-desc { font-size: 12.5px; color: var(--muted); line-height: 1.4; }
.sh-item.active .sh-item-title::before {
  content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%;
  background: var(--accent); margin-right: 7px; vertical-align: 2px;
}
.sh-menu-foot {
  grid-column: 1 / -1; margin-top: 4px; padding: 10px; border-top: 1px solid var(--line);
  font-size: 13px; color: var(--muted);
}
.sh-menu-foot a { color: var(--ink); font-weight: 500; text-decoration: none; }
.sh-menu-foot a:hover { color: var(--accent); }

.sh-context {
  display: flex; align-items: baseline; gap: 10px; min-width: 0;
  font-size: 14px; color: var(--muted);
}
.sh-context .sh-sep { color: var(--line-strong); }
.sh-context .sh-title {
  color: var(--ink); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.sh-context .sh-meta { font: 12px var(--f-mono); color: var(--muted); white-space: nowrap; }

.sh-right { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.lang-toggle {
  display: inline-flex; padding: 2px; gap: 2px;
  border: 1px solid var(--line); border-radius: 9px; background: var(--bg);
}
.lang-btn {
  height: 28px; min-width: 34px; padding: 0 8px;
  font: 500 12px/1 var(--f-mono); letter-spacing: .02em;
  color: var(--muted); background: none; border: 0; border-radius: 7px; cursor: pointer;
  transition: color .15s, background .15s;
}
.lang-btn:hover { color: var(--ink); }
.lang-btn.active { background: var(--ink); color: var(--surface); }
.icon-btn {
  width: 34px; height: 34px; display: inline-grid; place-items: center;
  color: var(--ink-2); background: none; border: 1px solid var(--line); border-radius: 9px; cursor: pointer;
  transition: color .15s, border-color .15s, background .15s;
}
.icon-btn:hover { color: var(--ink); border-color: var(--line-strong); background: var(--sunk); }
.icon-btn svg { width: 16px; height: 16px; }
.theme-btn .i-sun { display: none; }
:root[data-theme="dark"] .theme-btn .i-sun { display: block; }
:root[data-theme="dark"] .theme-btn .i-moon { display: none; }
.sh-burger { display: none; }

@media (max-width: 1100px) {
  .sh-context .sh-meta { display: none; }
}
@media (max-width: 960px) {
  .sh-inner { gap: 14px; }
  .sh-context { display: none; }
}
@media (max-width: 899px) {
  .sh-burger { display: inline-grid; }
  .sh-nav {
    display: none;
    position: fixed; left: 0; right: 0; top: var(--header-h); bottom: 0;
    flex-direction: column; align-items: stretch; gap: 2px;
    padding: 12px max(16px, env(safe-area-inset-right, 0px)) 32px max(16px, env(safe-area-inset-left, 0px));
    background: var(--surface); overflow-y: auto;
    border-top: 1px solid var(--line);
  }
  body.sh-menu-open .sh-nav { display: flex; }
  /* backdrop-filter would make the header the containing block of the fixed menu */
  body.sh-menu-open .site-header { -webkit-backdrop-filter: none; backdrop-filter: none; background: var(--surface); }
  body.sh-menu-open { overflow: hidden; }
  .sh-link { height: 44px; font-size: 16px; justify-content: space-between; width: 100%; }
  .sh-link.active::after { display: none; }
  .sh-link.active { color: var(--accent); }
  .sh-menu, .sh-menu.wide {
    position: static; min-width: 0; max-height: none; box-shadow: none; border: 0;
    padding: 0 0 8px 8px; grid-template-columns: 1fr;
  }
  .sh-item-desc { display: none; }
  .sh-right #gs-trigger .gs-placeholder, .sh-right #gs-trigger .gs-kbd { display: none; }
  .sh-right #gs-trigger { min-width: 0; width: 34px; height: 34px; padding: 0; justify-content: center; }
}

/* ── Footer ── */
.site-footer {
  border-top: 1px solid var(--line);
  padding: 28px max(20px, env(safe-area-inset-right, 0px)) 36px max(20px, env(safe-area-inset-left, 0px));
  color: var(--muted); font-size: 13px;
}
.sf-inner { max-width: 1180px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; justify-content: space-between; }
.sf-inner a { color: var(--ink-2); text-decoration: none; }
.sf-inner a:hover { color: var(--accent); }
.sf-links { display: flex; gap: 18px; flex-wrap: wrap; }

/* ── Shared building blocks ── */
.eyebrow {
  font: 500 12px/1.2 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
}
.chip {
  display: inline-flex; align-items: center; gap: 5px;
  font: 500 11px/1 var(--f-mono); letter-spacing: .02em;
  padding: 4px 8px; border-radius: 99px; border: 1px solid var(--line); color: var(--ink-2); background: var(--surface);
  white-space: nowrap;
}
.chip.dot::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.chip.st-stable { color: var(--ok); }
.chip.st-evolving { color: var(--warn); }
.chip.st-emerging { color: var(--new); }
.chip.st-deprecated { color: var(--muted); }
.chip.st-draft { color: var(--warn); }
.chip.st-review { color: var(--info); }
.btn {
  display: inline-flex; align-items: center; gap: 8px;
  height: 40px; padding: 0 16px;
  font: 500 14px/1 var(--f-ui); color: var(--ink); text-decoration: none;
  background: var(--surface); border: 1px solid var(--line-strong); border-radius: 9px; cursor: pointer;
  transition: background .15s, border-color .15s, color .15s, transform .15s;
}
.btn:hover { border-color: var(--ink-2); }
.btn.primary { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.btn.primary:hover { background: var(--accent); border-color: var(--accent); }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}
</style>
<style>
  body { background:var(--sunk); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px; height:100vh; height:100dvh; overflow:hidden; padding:16px }

  .status-stable { color:var(--ok) }

<script>
const ALL_SLIDES = { en: ["<div class=\"slide-type-title\"><div class=\"slide-title-content\"><h1>Proprietary Models</h1><p class=\"subtitle\">AI / LLM Ecosystem</p></div></div>", "<div class=\"slide-layer-num\">Layer 3</div><h2>CURRENT MODELS</h2><ul><li><span class=\"sd sd-stable\"></span> <strong>GPT-4o</strong> \u2014 \"Omni\" model \u2014 fast, cheap, natively multimodal (text + vision + audio).\nThe default OpenAI API model for most production use cases.\nStrong at coding, reasoning, and instruction following..</li><li><span class=\"sd sd-stable\"></span> <strong>GPT-4.1</strong> \u2014 Optimized for coding and instruction following with 128k context window.\nLower cost than GPT-4o while maintaining strong performance on software tasks.\nAvailable in mini and nano variants for cost-sensitive applications..</li><li><span class=\"sd sd-evolving\"></span> <strong>GPT-4.5</strong> \u2014 OpenAI's most capable general-purpose model.</li><li><span class=\"sd sd-evolving\"></span> <strong>GPT-5.4</strong> \u2014 OpenAI's flagship general-purpose model as of 2026.</li><li><span class=\"sd sd-evolving\"></span> <strong>GPT-5.4 mini</strong> \u2014 Fast, efficient model optimised for coding and sub-agents.</li><li><span class=\"sd sd-evolving\"></span> <strong>GPT-5.4 nano</strong> \u2014 Smallest and cheapest GPT-5.4 variant.</li><li><span class=\"sd sd-emerging\"></span> <strong>o3</strong> \u2014 OpenAI's flagship reasoning model.</li><li><span class=\"sd sd-stable\"></span> <strong>Claude 3.5 Sonnet</strong> \u2014 Anthropic's most popular model.</li><li><span class=\"sd sd-evolving\"></span> <strong>Claude 3.7 Sonnet</strong> \u2014 Adds \"extended thinking\" \u2014 the model can reason at length before answering.\n200k context window.</li><li><span class=\"sd sd-stable\"></span> <strong>Claude Opus 4</strong> \u2014 Anthropic's most capable model.</li><li><span class=\"sd sd-stable\"></span> <strong>Claude Sonnet 4</strong> \u2014 Anthropic's balanced model \u2014 strong performance at moderate cost.</li><li><span class=\"sd sd-stable\"></span> <strong>Claude Haiku 3.5</strong> \u2014 Anthropic's fastest and most cost-efficient model.</li><li><span class=\"sd sd-evolving\"></span> <strong>Gemini 2.5 Pro</strong> \u2014 Google's most capable model.</li><li><span class=\"sd sd-stable\"></span> <strong>Gemini 2.0 Flash</strong> \u2014 Google's fastest and most cost-efficient model.</li><li><span class=\"sd sd-emerging\"></span> <strong>Grok 3</strong> \u2014 xAI's most capable model.</li><li><span class=\"sd sd-evolving\"></span> <strong>Mistral Large</strong> \u2014 Mistral AI's most capable proprietary model.</li><li><span class=\"sd sd-stable\"></span> <strong>Mistral Medium</strong> \u2014 Mid-tier proprietary model from Mistral AI.</li></ul>", "<div class=\"slide-layer-num\">Layer 2</div><h2>MODEL FAMILIES</h2><ul><li><span class=\"sd sd-evolving\"></span> <strong>GPT</strong> \u2014 OpenAI's main line of general-purpose chat and API models.\nGPT-3 (2020) proved scale, GPT-4 (2023) set the multimodal standard.\nGPT-5.4 (2026) is the current frontier, with mini and nano variants for speed and cost.\nUsed by millions of developers as the default API for text generation tasks..</li><li><span class=\"sd sd-emerging\"></span> <strong>o-Series</strong> \u2014 OpenAI's reasoning-first model line.</li><li><span class=\"sd sd-evolving\"></span> <strong>Claude</strong> \u2014 Anthropic's flagship model family.</li><li><span class=\"sd sd-evolving\"></span> <strong>Gemini</strong> \u2014 Google DeepMind's flagship model family.</li><li><span class=\"sd sd-emerging\"></span> <strong>Grok</strong> \u2014 xAI's model family.</li><li><span class=\"sd sd-evolving\"></span> <strong>Mistral (proprietary)</strong> \u2014 Mistral AI's proprietary model line, accessible only via API (La Plateforme) or cloud partners.\nHigher capability than their open-weights models, targeting enterprise and production use cases.\nPart of Mistral's hybrid strategy: open models attract developers, proprietary models generate revenue..</li></ul>", "<div class=\"slide-layer-num\">Layer 1</div><h2>AI LABS</h2><ul><li><span class=\"sd sd-stable\"></span> <strong>OpenAI</strong> \u2014 Founded in 2015, OpenAI created the GPT series and ChatGPT \u2014 the product that triggered the\ncurrent AI wave.</li><li><span class=\"sd sd-stable\"></span> <strong>Anthropic</strong> \u2014 Founded in 2021 by former OpenAI leaders, Anthropic focuses on AI safety research.\nIntroduced Constitutional AI (CAI) and developed the Model Context Protocol (MCP).\nCurrent lineup: Opus 4 (most capable), Sonnet 4 (balanced), Haiku 3.5 (fast/cheap)..</li><li><span class=\"sd sd-stable\"></span> <strong>Google DeepMind</strong> \u2014 Merger of Google Brain and DeepMind (2023).</li><li><span class=\"sd sd-evolving\"></span> <strong>xAI</strong> \u2014 Elon Musk's AI company, founded in 2023.</li><li><span class=\"sd sd-stable\"></span> <strong>Mistral AI</strong> \u2014 French AI startup founded in 2023 by former DeepMind and Meta researchers.\nHybrid strategy: open-weights models to attract developers (Mistral 7B, Mistral Small)\nand proprietary models for monetization via API (Mistral Large, Mistral Medium).\nOne of the few European AI companies competing at the frontier..</li></ul>", "<div class=\"slide-node-layer\">CURRENT MODELS</div><h2><span class=\"sd sd-stable\"></span> GPT-4o</h2><p class=\"node-desc\">\"Omni\" model \u2014 fast, cheap, natively multimodal (text + vision + audio).<br>The default OpenAI API model for most production use cases.<br>Strong at coding, reasoning, and instruction following.</p><span class=\"slide-status status-stable\">stable</span>", "<div class=\"slide-node-layer\">CURRENT MODELS</div><h2><span class=\"sd sd-stable\"></span> GPT-4.1</h2><p class=\"node-desc\">Optimized for coding and instruction following with 128k context window.<br>Lower cost than GPT-4o while maintaining strong performance on software tasks.<br>Available in mini and nano variants for cost-sensitive applications.</p><span class=\"slide-status status-stable\">stable</span>", "<div class=\"slide-node-layer\">CURRENT MODELS</div><h2><span class=\"sd sd-evolving\"></span> GPT-4.5</h2><p class=\"node-desc\">OpenAI's most capable general-purpose model. Strong at nuanced writing, complex reasoning<br>and following subtle instructions. Higher cost \u2014 best reserved for hard tasks<br>where output quality matters most.</p><span class=\"slide-status status-evolving\">evolving</span>", "<div class=\"slide-node-layer\">CURRENT MODELS</div><h2><span class=\"sd sd-evolving\"></span> GPT-5.4</h2><p class=\"node-desc\">OpenAI's flagship general-purpose model as of 2026. Strong across coding, reasoning,<br>multimodal understanding and computer use.<br>SWE-Bench Pro: 57.7%. GPQA Diamond: 93%. OSWorld: 75%.<br>Parent model of the GPT-5.4 mini and nano series.</p><span class=\"slide-status status-evolving\">evolving</span>", "<div class=\"slide-node-layer\">CURRENT MODELS</div><h2><span class=\"sd sd-evolving\"></span> GPT-5.4 mini</h2><p class=\"node-desc\">Fast, efficient model optimised for coding and sub-agents. 2x faster than GPT-5 mini.<br>Approaches GPT-5.4 performance on SWE-Bench Pro (54.4%) and OSWorld (72.1%).<br>400K context window. Multimodal: text + image. Supports tools, web search, file search, computer use.<br>$0.75 / $4.50 per M tokens (in/out). Available in API, Codex and ChatGPT.</p><span class=\"slide-status status-evolving\">evolving</span>", "<div class=\"slide-node-layer\">CURRENT MODELS</div><h2><span class=\"sd sd-evolving\"></span> GPT-5.4 nano</h2><p class=\"node-desc\">Smallest and cheapest GPT-5.4 variant. API only.<br>Recommended for: classification, data extraction, ranking, and coding sub-agents handling simpler tasks.<br>SWE-Bench Pro: 52.4%. GPQA Diamond: 82.8%.<br>$0.20 / $1.25 per M tokens (in/out) \u2014 lowest cost in the GPT-5.4 family.</p><span class=\"slide-status status-evolving\">evolving</span>", "<div class=\"slide-node-layer\">CURRENT MODELS</div><h2><span class=\"sd sd-emerging\"></span> o3</h2><p class=\"node-desc\">OpenAI's flagship reasoning model. Achieves frontier scores on math olympiad, competitive<br>coding (Codeforces), and scientific benchmarks.<br>Uses extended chain-of-thought with variable \"thinking budget\" for cost/quality tradeoff.</p><span class=\"slide-status status-emerging\">emerging</span>", "<div class=\"slide-node-layer\">CURRENT MODELS</div><h2><span class=\"sd sd-stable\"></span> Claude 3.5 Sonnet</h2><p class=\"node-desc\">Anthropic's most popular model. Best-in-class for software development and code editing.<br>Combines strong reasoning with fast response times and a 200k context window.<br>Widely used as the default model in Cursor, GitHub Copilot and other coding tools.</p><span class=\"slide-status status-stable\">stable</span>", "<div class=\"slide-node-layer\">CURRENT MODELS</div><h2><span class=\"sd sd-evolving\"></span> Claude 3.7 Sonnet</h2><p class=\"node-desc\">Adds \"extended thinking\" \u2014 the model can reason at length before answering.<br>200k context window. Significantly better at complex multi-step tasks.<br>Marks Anthropic's entry into the reasoning model space, alongside o3 and Grok 3.</p><span class=\"slide-status status-evolving\">evolving</span>", "<div class=\"slide-node-layer\">CURRENT MODELS</div><h2><span class=\"sd sd-stable\"></span> Claude Opus 4</h2><p class=\"node-desc\">Anthropic's most capable model. Excels at complex reasoning, coding, and extended analysis.<br>200k context window with extended thinking. Top-tier scores on SWE-bench and research benchmarks.<br>Best suited for hard tasks requiring deep expertise: architecture, research, nuanced writing.</p><span class=\"slide-status status-stable\">stable</span>", "<div class=\"slide-node-layer\">CURRENT MODELS</div><h2><span class=\"sd sd-stable\"></span> Claude Sonnet 4</h2><p class=\"node-desc\">Anthropic's balanced model \u2014 strong performance at moderate cost. Successor to Claude 3.7 Sonnet.<br>200k context window with extended thinking. Excellent for coding, analysis, and production workloads.<br>Default choice in most coding tools (Cursor, Claude Code, GitHub Copilot).</p><span class=\"slide-status status-stable\">stable</span>", "<div class=\"slide-node-layer\">CURRENT MODELS</div><h2><span class=\"sd sd-stable\"></span> Claude Haiku 3.5</h2><p class=\"node-desc\">Anthropic's fastest and most cost-efficient model. Optimized for high-volume, low-latency tasks.<br>200k context window. Strong for classification, extraction, summarization, and simple Q&A.<br>Ideal for production pipelines where speed and cost matter more than peak reasoning.</p><span class=\"slide-status status-stable\">stable</span>", "<div class=\"slide-node-layer\">CURRENT MODELS</div><h2><span class=\"sd sd-evolving\"></span> Gemini 2.5 Pro</h2><p class=\"node-desc\">Google's most capable model. Top scores on major coding and reasoning benchmarks (2025).<br>1M token context window \u2014 can process entire codebases or long documents in one call.<br>Natively multimodal: text, image, audio, video, code.</p><span class=\"slide-status status-evolving\">evolving</span>", "<div class=\"slide-node-layer\">CURRENT MODELS</div><h2><span class=\"sd sd-stable\"></span> Gemini 2.0 Flash</h2><p class=\"node-desc\">Google's fastest and most cost-efficient model. Extremely low latency with vision support.<br>Default choice for high-volume, cost-sensitive production workloads at Google scale.<br>Strong multimodal capabilities at a fraction of Pro's cost.</p><span class=\"slide-status status-stable\">stable</span>", "<div class=\"slide-node-layer\">CURRENT MODELS</div><h2><span class=\"sd sd-emerging\"></span> Grok 3</h2><p class=\"node-desc\">xAI's most capable model. Competitive with GPT-4o and Claude 3.5 on most benchmarks.<br>Unique access to real-time X (Twitter) data.<br>Introduces \"think mode\" \u2014 extended reasoning before answering.<br>Available via xAI API and X Premium subscription.</p><span class=\"slide-status status-emerging\">emerging</span>", "<div class=\"slide-node-layer\">CURRENT MODELS</div><h2><span class=\"sd sd-evolving\"></span> Mistral Large</h2><p class=\"node-desc\">Mistral AI's most capable proprietary model. API-only, not open-weights.<br>Competitive with GPT-4o and Claude 3.5 Sonnet on reasoning and multilingual tasks.<br>Strong multilingual capabilities (EN, FR, DE, ES, IT).<br>Available via La Plateforme API and cloud partners (Azure, AWS, GCP).</p><span class=\"slide-status status-evolving\">evolving</span>", "<div class=\"slide-node-layer\">CURRENT MODELS</div><h2><span class=\"sd sd-stable\"></span> Mistral Medium</h2><p class=\"node-desc\">Mid-tier proprietary model from Mistral AI. Good balance of cost and performance.<br>API-only. Positioned between the open-weights Mistral Small and the proprietary Mistral Large.<br>Popular for enterprise production workloads where open weights aren't required.</p><span class=\"slide-status status-stable\">stable</span>", "<div class=\"slide-node-layer\">MODEL FAMILIES</div><h2><span class=\"sd sd-evolving\"></span> GPT</h2><p class=\"node-desc\">OpenAI's main line of general-purpose chat and API models.<br>GPT-3 (2020) proved scale, GPT-4 (2023) set the multimodal standard.<br>GPT-5.4 (2026) is the current frontier, with mini and nano variants for speed and cost.<br>Used by millions of developers as the default API for text generation tasks.</p><span class=\"slide-status status-evolving\">evolving</span>", "<div class=\"slide-node-layer\">MODEL FAMILIES</div><h2><span class=\"sd sd-emerging\"></span> o-Series</h2><p class=\"node-desc\">OpenAI's reasoning-first model line. These models \"think\" step-by-step before responding.<br>Best for complex logic, math, research and multi-step problem solving.<br>Higher latency and cost than GPT \u2014 worth it for hard tasks.</p><span class=\"slide-status status-emerging\">emerging</span>", "<div class=\"slide-node-layer\">MODEL FAMILIES</div><h2><span class=\"sd sd-evolving\"></span> Claude</h2><p class=\"node-desc\">Anthropic's flagship model family. Three tiers: Haiku (fast/cheap), Sonnet (balanced), Opus (most capable).<br>Known for following instructions precisely, long-context reliability, and clean long-form output.</p><span class=\"slide-status status-evolving\">evolving</span>", "<div class=\"slide-node-layer\">MODEL FAMILIES</div><h2><span class=\"sd sd-evolving\"></span> Gemini</h2><p class=\"node-desc\">Google DeepMind's flagship model family. Three tiers: Flash (fast), Pro (balanced), Ultra (most capable).<br>Natively multimodal. Tight integration with Google Workspace, Search, and Android.</p><span class=\"slide-status status-evolving\">evolving</span>", "<div class=\"slide-node-layer\">MODEL FAMILIES</div><h2><span class=\"sd sd-emerging\"></span> Grok</h2><p class=\"node-desc\">xAI's model family. Unique differentiator: real-time access to X (Twitter) data.<br>Grok 3 introduced \"think mode\" \u2014 a reasoning layer similar to OpenAI's o-series.</p><span class=\"slide-status status-emerging\">emerging</span>", "<div class=\"slide-node-layer\">MODEL FAMILIES</div><h2><span class=\"sd sd-evolving\"></span> Mistral (proprietary)</h2><p class=\"node-desc\">Mistral AI's proprietary model line, accessible only via API (La Plateforme) or cloud partners.<br>Higher capability than their open-weights models, targeting enterprise and production use cases.<br>Part of Mistral's hybrid strategy: open models attract developers, proprietary models generate revenue.</p><span class=\"slide-status status-evolving\">evolving</span>", "<div class=\"slide-node-layer\">AI LABS</div><h2><span class=\"sd sd-stable\"></span> OpenAI</h2><p class=\"node-desc\">Founded in 2015, OpenAI created the GPT series and ChatGPT \u2014 the product that triggered the<br>current AI wave. Shifted from non-profit to capped-profit.<br>Controls the largest share of the commercial LLM market via its API.</p><span class=\"slide-status status-stable\">stable</span>", "<div class=\"slide-node-layer\">AI LABS</div><h2><span class=\"sd sd-stable\"></span> Anthropic</h2><p class=\"node-desc\">Founded in 2021 by former OpenAI leaders, Anthropic focuses on AI safety research.<br>Introduced Constitutional AI (CAI) and developed the Model Context Protocol (MCP).<br>Current lineup: Opus 4 (most capable), Sonnet 4 (balanced), Haiku 3.5 (fast/cheap).</p><span class=\"slide-status status-stable\">stable</span>", "<div class=\"slide-node-layer\">AI LABS</div><h2><span class=\"sd sd-stable\"></span> Google DeepMind</h2><p class=\"node-desc\">Merger of Google Brain and DeepMind (2023). World-class research lab behind AlphaFold and Gemini.<br>Has unique advantages: access to Google's infrastructure, Search, YouTube, and Android.<br>Gemini 2.5 Pro is among the top-performing models of 2025-2026.</p><span class=\"slide-status status-stable\">stable</span>", "<div class=\"slide-node-layer\">AI LABS</div><h2><span class=\"sd sd-evolving\"></span> xAI</h2><p class=\"node-desc\">Elon Musk's AI company, founded in 2023. Creator of the Grok series.<br>Deeply integrated with X (Twitter), giving Grok unique access to real-time social data.<br>Open-sourced Grok-1 weights (314B parameters).</p><span class=\"slide-status status-evolving\">evolving</span>", "<div class=\"slide-node-layer\">AI LABS</div><h2><span class=\"sd sd-stable\"></span> Mistral AI</h2><p class=\"node-desc\">French AI startup founded in 2023 by former DeepMind and Meta researchers.<br>Hybrid strategy: open-weights models to attract developers (Mistral 7B, Mistral Small)<br>and proprietary models for monetization via API (Mistral Large, Mistral Medium).<br>One of the few European AI companies competing at the frontier.</p><span class=\"slide-status status-stable\">stable</span>", "<div class=\"slide-type-title\"><div class=\"slide-title-content\"><h2>Summary</h2><p class=\"stat\">28 concepts</p><p class=\"stat\">3 layers</p><p class=\"generated-from\">Proprietary Models</p></div></div>"], fr: ["<div class=\"slide-type-title\"><div class=\"slide-title-content\"><h1>Mod\u00e8les Propri\u00e9taires</h1><p class=\"subtitle\">\u00c9cosyst\u00e8me IA / LLM</p></div></div>", "<div class=\"slide-layer-num\">Layer 3</div><h2>MOD\u00c8LES ACTUELS</h2><ul><li><span class=\"sd sd-stable\"></span> <strong>GPT-4o</strong> \u2014 Mod\u00e8le \"Omni\" \u2014 rapide, \u00e9conomique, nativement multimodal (texte + vision + audio).\nLe mod\u00e8le API OpenAI par d\u00e9faut pour la plupart des cas d'usage en production.\nSolide en code, raisonnement et suivi d'instructions..</li><li><span class=\"sd sd-stable\"></span> <strong>GPT-4.1</strong> \u2014 Optimis\u00e9 pour le code et le suivi d'instructions avec une fen\u00eatre de contexte de 128k tokens.\nCo\u00fbt inf\u00e9rieur \u00e0 GPT-4o tout en maintenant de bonnes performances sur les t\u00e2ches logicielles.\nDisponible en variantes mini et nano pour les applications sensibles au co\u00fbt..</li><li><span class=\"sd sd-evolving\"></span> <strong>GPT-4.5</strong> \u2014 Le mod\u00e8le polyvalent le plus puissant d'OpenAI.</li><li><span class=\"sd sd-evolving\"></span> <strong>GPT-5.4</strong> \u2014 Le mod\u00e8le polyvalent phare d'OpenAI en 2026.</li><li><span class=\"sd sd-evolving\"></span> <strong>GPT-5.4 mini</strong> \u2014 Mod\u00e8le rapide et efficace optimis\u00e9 pour le code et les sous-agents.</li><li><span class=\"sd sd-evolving\"></span> <strong>GPT-5.4 nano</strong> \u2014 Variante la plus petite et moins ch\u00e8re de GPT-5.4.</li><li><span class=\"sd sd-emerging\"></span> <strong>o3</strong> \u2014 Le mod\u00e8le de raisonnement phare d'OpenAI.</li><li><span class=\"sd sd-stable\"></span> <strong>Claude 3.5 Sonnet</strong> \u2014 Le mod\u00e8le le plus populaire d'Anthropic.</li><li><span class=\"sd sd-evolving\"></span> <strong>Claude 3.7 Sonnet</strong> \u2014 Ajoute le \"extended thinking\" \u2014 le mod\u00e8le peut raisonner longuement avant de r\u00e9pondre.\nContexte de 200k tokens.</li><li><span class=\"sd sd-stable\"></span> <strong>Claude Opus 4</strong> \u2014 Le mod\u00e8le le plus puissant d'Anthropic.</li><li><span class=\"sd sd-stable\"></span> <strong>Claude Sonnet 4</strong> \u2014 Le mod\u00e8le \u00e9quilibr\u00e9 d'Anthropic \u2014 performances solides \u00e0 co\u00fbt mod\u00e9r\u00e9.</li><li><span class=\"sd sd-stable\"></span> <strong>Claude Haiku 3.5</strong> \u2014 Le mod\u00e8le le plus rapide et \u00e9conomique d'Anthropic.</li><li><span class=\"sd sd-evolving\"></span> <strong>Gemini 2.5 Pro</strong> \u2014 Le mod\u00e8le le plus puissant de Google.</li><li><span class=\"sd sd-stable\"></span> <strong>Gemini 2.0 Flash</strong> \u2014 Le mod\u00e8le le plus rapide et \u00e9conomique de Google.</li><li><span class=\"sd sd-emerging\"></span> <strong>Grok 3</strong> \u2014 Le mod\u00e8le le plus puissant de xAI.</li><li><span class=\"sd sd-evolving\"></span> <strong>Mistral Large</strong> \u2014 Le mod\u00e8le propri\u00e9taire le plus puissant de Mistral AI.</li><li><span class=\"sd sd-stable\"></span> <strong>Mistral Medium</strong> \u2014 Mod\u00e8le propri\u00e9taire de milieu de gamme de Mistral AI.</li></ul>", "<div class=\"slide-layer-num\">Layer 2</div><h2>FAMILLES DE MOD\u00c8LES</h2><ul><li><span class=\"sd sd-evolving\"></span> <strong>GPT</strong> \u2014 La principale gamme de mod\u00e8les de chat et API d'OpenAI.\nGPT-3 (2020) a prouv\u00e9 la scalabilit\u00e9, GPT-4 (2023) a \u00e9tabli le standard multimodal.\nGPT-5.4 (2026) est le frontier actuel, avec des variantes mini et nano pour la vitesse et le co\u00fbt.\nUtilis\u00e9s par des millions de d\u00e9veloppeurs comme API par d\u00e9faut..</li><li><span class=\"sd sd-emerging\"></span> <strong>S\u00e9rie o</strong> \u2014 La gamme de mod\u00e8les ax\u00e9e sur le raisonnement d'OpenAI.\nCes mod\u00e8les \"r\u00e9fl\u00e9chissent\" \u00e9tape par \u00e9tape avant de r\u00e9pondre.\nId\u00e9aux pour la logique complexe, les maths et la r\u00e9solution de probl\u00e8mes multi-\u00e9tapes..</li><li><span class=\"sd sd-evolving\"></span> <strong>Claude</strong> \u2014 La famille de mod\u00e8les phare d'Anthropic.</li><li><span class=\"sd sd-evolving\"></span> <strong>Gemini</strong> \u2014 La famille de mod\u00e8les phare de Google DeepMind.</li><li><span class=\"sd sd-emerging\"></span> <strong>Grok</strong> \u2014 La famille de mod\u00e8les de xAI.</li><li><span class=\"sd sd-evolving\"></span> <strong>Mistral (propri\u00e9taire)</strong> \u2014 La gamme de mod\u00e8les propri\u00e9taires de Mistral AI, accessible uniquement via API (La Plateforme) ou partenaires cloud.\nCapacit\u00e9s sup\u00e9rieures aux mod\u00e8les open weights, ciblant les cas d'usage entreprise et production.\nPartie de la strat\u00e9gie hybride de Mistral : les mod\u00e8les ouverts attirent les devs, les propri\u00e9taires g\u00e9n\u00e8rent du revenu..</li></ul>", "<div class=\"slide-layer-num\">Layer 1</div><h2>LABORATOIRES IA</h2><ul><li><span class=\"sd sd-stable\"></span> <strong>OpenAI</strong> \u2014 Fond\u00e9 en 2015, OpenAI a cr\u00e9\u00e9 la s\u00e9rie GPT et ChatGPT \u2014 le produit qui a d\u00e9clench\u00e9\nla vague IA actuelle.</li><li><span class=\"sd sd-stable\"></span> <strong>Anthropic</strong> \u2014 Fond\u00e9 en 2021 par d'anciens dirigeants d'OpenAI, Anthropic se concentre sur la s\u00e9curit\u00e9 IA.\nA introduit le Constitutional AI (CAI) et d\u00e9velopp\u00e9 le Model Context Protocol (MCP).\nGamme actuelle : Opus 4 (le plus puissant), Sonnet 4 (\u00e9quilibr\u00e9), Haiku 3.5 (rapide/\u00e9conomique)..</li><li><span class=\"sd sd-stable\"></span> <strong>Google DeepMind</strong> \u2014 Fusion de Google Brain et DeepMind (2023).</li><li><span class=\"sd sd-evolving\"></span> <strong>xAI</strong> \u2014 La soci\u00e9t\u00e9 IA d'Elon Musk, fond\u00e9e en 2023.</li><li><span class=\"sd sd-stable\"></span> <strong>Mistral AI</strong> \u2014 Startup IA fran\u00e7aise fond\u00e9e en 2023 par d'anciens chercheurs de DeepMind et Meta.\nStrat\u00e9gie hybride : mod\u00e8les open weights pour attirer les d\u00e9veloppeurs (Mistral 7B, Mistral Small)\net mod\u00e8les propri\u00e9taires pour mon\u00e9tiser via API (Mistral Large, Mistral Medium).\nL'une des rares entreprises IA europ\u00e9ennes comp\u00e9titives au niveau frontier..</li></ul>", "<div class=\"slide-node-layer\">MOD\u00c8LES ACTUELS</div><h2><span class=\"sd sd-stable\"></span> GPT-4o</h2><p class=\"node-desc\">Mod\u00e8le \"Omni\" \u2014 rapide, \u00e9conomique, nativement multimodal (texte + vision + audio).<br>Le mod\u00e8le API OpenAI par d\u00e9faut pour la plupart des cas d'usage en production.<br>Solide en code, raisonnement et suivi d'instructions.</p><span class=\"slide-status status-stable\">stable</span>", "<div class=\"slide-node-layer\">MOD\u00c8LES ACTUELS</div><h2><span class=\"sd sd-stable\"></span> GPT-4.1</h2><p class=\"node-desc\">Optimis\u00e9 pour le code et le suivi d'instructions avec une fen\u00eatre de contexte de 128k tokens.<br>Co\u00fbt inf\u00e9rieur \u00e0 GPT-4o tout en maintenant de bonnes performances sur les t\u00e2ches logicielles.<br>Disponible en variantes mini et nano pour les applications sensibles au co\u00fbt.</p><span class=\"slide-status status-stable\">stable</span>", "<div class=\"slide-node-layer\">MOD\u00c8LES ACTUELS</div><h2><span class=\"sd sd-evolving\"></span> GPT-4.5</h2><p class=\"node-desc\">Le mod\u00e8le polyvalent le plus puissant d'OpenAI. Excellent en \u00e9criture nuanc\u00e9e, raisonnement<br>complexe et suivi d'instructions subtiles. Co\u00fbt \u00e9lev\u00e9 \u2014 \u00e0 r\u00e9server pour les t\u00e2ches difficiles<br>o\u00f9 la qualit\u00e9 de sortie prime.</p><span class=\"slide-status status-evolving\">evolving</span>", "<div class=\"slide-node-layer\">MOD\u00c8LES ACTUELS</div><h2><span class=\"sd sd-evolving\"></span> GPT-5.4</h2><p class=\"node-desc\">Le mod\u00e8le polyvalent phare d'OpenAI en 2026. Solide en code, raisonnement,<br>compr\u00e9hension multimodale et utilisation d'ordinateur.<br>SWE-Bench Pro : 57,7%. GPQA Diamond : 93%. OSWorld : 75%.<br>Mod\u00e8le parent de la s\u00e9rie GPT-5.4 mini et nano.</p><span class=\"slide-status status-evolving\">evolving</span>", "<div class=\"slide-node-layer\">MOD\u00c8LES ACTUELS</div><h2><span class=\"sd sd-evolving\"></span> GPT-5.4 mini</h2><p class=\"node-desc\">Mod\u00e8le rapide et efficace optimis\u00e9 pour le code et les sous-agents. 2\u00d7 plus rapide que GPT-5 mini.<br>Se rapproche des performances de GPT-5.4 sur SWE-Bench Pro (54,4%) et OSWorld (72,1%).<br>Fen\u00eatre de contexte 400K. Multimodal : texte + image. Supporte outils, recherche web, fichiers, ordinateur.<br>0,75 $ / 4,50 $ par M tokens (entr\u00e9e/sortie). Disponible dans l'API, Codex et ChatGPT.</p><span class=\"slide-status status-evolving\">evolving</span>", "<div class=\"slide-node-layer\">MOD\u00c8LES ACTUELS</div><h2><span class=\"sd sd-evolving\"></span> GPT-5.4 nano</h2><p class=\"node-desc\">Variante la plus petite et moins ch\u00e8re de GPT-5.4. API uniquement.<br>Recommand\u00e9 pour : classification, extraction de donn\u00e9es, classement, et sous-agents de code simples.<br>SWE-Bench Pro : 52,4%. GPQA Diamond : 82,8%.<br>0,20 $ / 1,25 $ par M tokens (entr\u00e9e/sortie) \u2014 co\u00fbt le plus bas de la famille GPT-5.4.</p><span class=\"slide-status status-evolving\">evolving</span>", "<div class=\"slide-node-layer\">MOD\u00c8LES ACTUELS</div><h2><span class=\"sd sd-emerging\"></span> o3</h2><p class=\"node-desc\">Le mod\u00e8le de raisonnement phare d'OpenAI. Atteint des scores frontier en olympiades de maths,<br>code comp\u00e9titif (Codeforces) et benchmarks scientifiques.<br>Utilise une cha\u00eene de pens\u00e9e \u00e9tendue avec un \"budget de r\u00e9flexion\" variable.</p><span class=\"slide-status status-emerging\">emerging</span>", "<div class=\"slide-node-layer\">MOD\u00c8LES ACTUELS</div><h2><span class=\"sd sd-stable\"></span> Claude 3.5 Sonnet</h2><p class=\"node-desc\">Le mod\u00e8le le plus populaire d'Anthropic. Meilleur de sa cat\u00e9gorie pour le d\u00e9veloppement logiciel.<br>Combine un raisonnement solide avec des temps de r\u00e9ponse rapides et un contexte de 200k tokens.<br>Tr\u00e8s utilis\u00e9 comme mod\u00e8le par d\u00e9faut dans Cursor, GitHub Copilot et autres outils de code.</p><span class=\"slide-status status-stable\">stable</span>", "<div class=\"slide-node-layer\">MOD\u00c8LES ACTUELS</div><h2><span class=\"sd sd-evolving\"></span> Claude 3.7 Sonnet</h2><p class=\"node-desc\">Ajoute le \"extended thinking\" \u2014 le mod\u00e8le peut raisonner longuement avant de r\u00e9pondre.<br>Contexte de 200k tokens. Bien meilleur sur les t\u00e2ches multi-\u00e9tapes complexes.<br>Marque l'entr\u00e9e d'Anthropic dans l'espace des mod\u00e8les de raisonnement.</p><span class=\"slide-status status-evolving\">evolving</span>", "<div class=\"slide-node-layer\">MOD\u00c8LES ACTUELS</div><h2><span class=\"sd sd-stable\"></span> Claude Opus 4</h2><p class=\"node-desc\">Le mod\u00e8le le plus puissant d'Anthropic. Excelle en raisonnement complexe, code et analyse approfondie.<br>Contexte de 200k tokens avec extended thinking. Scores de premier plan sur SWE-bench et benchmarks de recherche.<br>Id\u00e9al pour les t\u00e2ches difficiles n\u00e9cessitant une expertise profonde : architecture, recherche, r\u00e9daction nuanc\u00e9e.</p><span class=\"slide-status status-stable\">stable</span>", "<div class=\"slide-node-layer\">MOD\u00c8LES ACTUELS</div><h2><span class=\"sd sd-stable\"></span> Claude Sonnet 4</h2><p class=\"node-desc\">Le mod\u00e8le \u00e9quilibr\u00e9 d'Anthropic \u2014 performances solides \u00e0 co\u00fbt mod\u00e9r\u00e9. Successeur de Claude 3.7 Sonnet.<br>Contexte de 200k tokens avec extended thinking. Excellent pour le code, l'analyse et la production.<br>Choix par d\u00e9faut dans la plupart des outils de code (Cursor, Claude Code, GitHub Copilot).</p><span class=\"slide-status status-stable\">stable</span>", "<div class=\"slide-node-layer\">MOD\u00c8LES ACTUELS</div><h2><span class=\"sd sd-stable\"></span> Claude Haiku 3.5</h2><p class=\"node-desc\">Le mod\u00e8le le plus rapide et \u00e9conomique d'Anthropic. Optimis\u00e9 pour les t\u00e2ches \u00e0 haut volume et faible latence.<br>Contexte de 200k tokens. Solide pour la classification, l'extraction, le r\u00e9sum\u00e9 et le Q&A simple.<br>Id\u00e9al pour les pipelines de production o\u00f9 la vitesse et le co\u00fbt priment sur le raisonnement.</p><span class=\"slide-status status-stable\">stable</span>", "<div class=\"slide-node-layer\">MOD\u00c8LES ACTUELS</div><h2><span class=\"sd sd-evolving\"></span> Gemini 2.5 Pro</h2><p class=\"node-desc\">Le mod\u00e8le le plus puissant de Google. Meilleurs scores sur les benchmarks de code et raisonnement (2025).<br>Fen\u00eatre de contexte de 1M tokens \u2014 peut traiter des bases de code enti\u00e8res en un seul appel.<br>Nativement multimodal : texte, image, audio, vid\u00e9o, code.</p><span class=\"slide-status status-evolving\">evolving</span>", "<div class=\"slide-node-layer\">MOD\u00c8LES ACTUELS</div><h2><span class=\"sd sd-stable\"></span> Gemini 2.0 Flash</h2><p class=\"node-desc\">Le mod\u00e8le le plus rapide et \u00e9conomique de Google. Latence extr\u00eamement faible avec vision.<br>Choix par d\u00e9faut pour les workloads de production \u00e0 fort volume chez Google.<br>Capacit\u00e9s multimodales solides \u00e0 une fraction du co\u00fbt de Pro.</p><span class=\"slide-status status-stable\">stable</span>", "<div class=\"slide-node-layer\">MOD\u00c8LES ACTUELS</div><h2><span class=\"sd sd-emerging\"></span> Grok 3</h2><p class=\"node-desc\">Le mod\u00e8le le plus puissant de xAI. Comp\u00e9titif avec GPT-4o et Claude 3.5 sur la plupart des benchmarks.<br>Acc\u00e8s unique aux donn\u00e9es X (Twitter) en temps r\u00e9el.<br>Introduit le \"think mode\" \u2014 raisonnement \u00e9tendu avant de r\u00e9pondre.<br>Disponible via l'API xAI et l'abonnement X Premium.</p><span class=\"slide-status status-emerging\">emerging</span>", "<div class=\"slide-node-layer\">MOD\u00c8LES ACTUELS</div><h2><span class=\"sd sd-evolving\"></span> Mistral Large</h2><p class=\"node-desc\">Le mod\u00e8le propri\u00e9taire le plus puissant de Mistral AI. API uniquement, pas open weights.<br>Comp\u00e9titif avec GPT-4o et Claude 3.5 Sonnet en raisonnement et t\u00e2ches multilingues.<br>Fortes capacit\u00e9s multilingues (EN, FR, DE, ES, IT).<br>Disponible via l'API La Plateforme et partenaires cloud (Azure, AWS, GCP).</p><span class=\"slide-status status-evolving\">evolving</span>", "<div class=\"slide-node-layer\">MOD\u00c8LES ACTUELS</div><h2><span class=\"sd sd-stable\"></span> Mistral Medium</h2><p class=\"node-desc\">Mod\u00e8le propri\u00e9taire de milieu de gamme de Mistral AI. Bon \u00e9quilibre co\u00fbt/performance.<br>API uniquement. Positionn\u00e9 entre le Mistral Small open weights et le Mistral Large propri\u00e9taire.<br>Populaire pour les workloads de production en entreprise o\u00f9 l'open weights n'est pas requis.</p><span class=\"slide-status status-stable\">stable</span>", "<div class=\"slide-node-layer\">FAMILLES DE MOD\u00c8LES</div><h2><span class=\"sd sd-evolving\"></span> GPT</h2><p class=\"node-desc\">La principale gamme de mod\u00e8les de chat et API d'OpenAI.<br>GPT-3 (2020) a prouv\u00e9 la scalabilit\u00e9, GPT-4 (2023) a \u00e9tabli le standard multimodal.<br>GPT-5.4 (2026) est le frontier actuel, avec des variantes mini et nano pour la vitesse et le co\u00fbt.<br>Utilis\u00e9s par des millions de d\u00e9veloppeurs comme API par d\u00e9faut.</p><span class=\"slide-status status-evolving\">evolving</span>", "<div class=\"slide-node-layer\">FAMILLES DE MOD\u00c8LES</div><h2><span class=\"sd sd-emerging\"></span> S\u00e9rie o</h2><p class=\"node-desc\">La gamme de mod\u00e8les ax\u00e9e sur le raisonnement d'OpenAI.<br>Ces mod\u00e8les \"r\u00e9fl\u00e9chissent\" \u00e9tape par \u00e9tape avant de r\u00e9pondre.<br>Id\u00e9aux pour la logique complexe, les maths et la r\u00e9solution de probl\u00e8mes multi-\u00e9tapes.</p><span class=\"slide-status status-emerging\">emerging</span>", "<div class=\"slide-node-layer\">FAMILLES DE MOD\u00c8LES</div><h2><span class=\"sd sd-evolving\"></span> Claude</h2><p class=\"node-desc\">La famille de mod\u00e8les phare d'Anthropic. Trois niveaux : Haiku, Sonnet, Opus.<br>Reconnu pour suivre les instructions avec pr\u00e9cision et sa fiabilit\u00e9 sur de longs contextes.</p><span class=\"slide-status status-evolving\">evolving</span>", "<div class=\"slide-node-layer\">FAMILLES DE MOD\u00c8LES</div><h2><span class=\"sd sd-evolving\"></span> Gemini</h2><p class=\"node-desc\">La famille de mod\u00e8les phare de Google DeepMind. Trois niveaux : Flash, Pro, Ultra.<br>Nativement multimodal. Int\u00e9gration \u00e9troite avec Google Workspace, Search et Android.</p><span class=\"slide-status status-evolving\">evolving</span>", "<div class=\"slide-node-layer\">FAMILLES DE MOD\u00c8LES</div><h2><span class=\"sd sd-emerging\"></span> Grok</h2><p class=\"node-desc\">La famille de mod\u00e8les de xAI. Diff\u00e9renciateur unique : acc\u00e8s en temps r\u00e9el aux donn\u00e9es X (Twitter).<br>Grok 3 a introduit le \"think mode\" \u2014 une couche de raisonnement similaire \u00e0 la s\u00e9rie o d'OpenAI.</p><span class=\"slide-status status-emerging\">emerging</span>", "<div class=\"slide-node-layer\">FAMILLES DE MOD\u00c8LES</div><h2><span class=\"sd sd-evolving\"></span> Mistral (propri\u00e9taire)</h2><p class=\"node-desc\">La gamme de mod\u00e8les propri\u00e9taires de Mistral AI, accessible uniquement via API (La Plateforme) ou partenaires cloud.<br>Capacit\u00e9s sup\u00e9rieures aux mod\u00e8les open weights, ciblant les cas d'usage entreprise et production.<br>Partie de la strat\u00e9gie hybride de Mistral : les mod\u00e8les ouverts attirent les devs, les propri\u00e9taires g\u00e9n\u00e8rent du revenu.</p><span class=\"slide-status status-evolving\">evolving</span>", "<div class=\"slide-node-layer\">LABORATOIRES IA</div><h2><span class=\"sd sd-stable\"></span> OpenAI</h2><p class=\"node-desc\">Fond\u00e9 en 2015, OpenAI a cr\u00e9\u00e9 la s\u00e9rie GPT et ChatGPT \u2014 le produit qui a d\u00e9clench\u00e9<br>la vague IA actuelle. Pass\u00e9 du statut d'association \u00e0 but non lucratif \u00e0 une structure \u00e0 profit plafonn\u00e9.<br>D\u00e9tient la plus grande part du march\u00e9 commercial des LLM via son API.</p><span class=\"slide-status status-stable\">stable</span>", "<div class=\"slide-node-layer\">LABORATOIRES IA</div><h2><span class=\"sd sd-stable\"></span> Anthropic</h2><p class=\"node-desc\">Fond\u00e9 en 2021 par d'anciens dirigeants d'OpenAI, Anthropic se concentre sur la s\u00e9curit\u00e9 IA.<br>A introduit le Constitutional AI (CAI) et d\u00e9velopp\u00e9 le Model Context Protocol (MCP).<br>Gamme actuelle : Opus 4 (le plus puissant), Sonnet 4 (\u00e9quilibr\u00e9), Haiku 3.5 (rapide/\u00e9conomique).</p><span class=\"slide-status status-stable\">stable</span>", "<div class=\"slide-node-layer\">LABORATOIRES IA</div><h2><span class=\"sd sd-stable\"></span> Google DeepMind</h2><p class=\"node-desc\">Fusion de Google Brain et DeepMind (2023). Laboratoire de recherche de premier plan.<br>Avantages uniques : acc\u00e8s \u00e0 l'infrastructure Google, Search, YouTube et Android.<br>Gemini 2.5 Pro figure parmi les mod\u00e8les les plus performants de 2025-2026.</p><span class=\"slide-status status-stable\">stable</span>", "<div class=\"slide-node-layer\">LABORATOIRES IA</div><h2><span class=\"sd sd-evolving\"></span> xAI</h2><p class=\"node-desc\">La soci\u00e9t\u00e9 IA d'Elon Musk, fond\u00e9e en 2023. Cr\u00e9ateur de la s\u00e9rie Grok.<br>Profond\u00e9ment int\u00e9gr\u00e9e \u00e0 X (Twitter), donnant \u00e0 Grok un acc\u00e8s aux donn\u00e9es sociales en temps r\u00e9el.<br>A mis en open source les poids de Grok-1 (314 milliards de param\u00e8tres).</p><span class=\"slide-status status-evolving\">evolving</span>", "<div class=\"slide-node-layer\">LABORATOIRES IA</div><h2><span class=\"sd sd-stable\"></span> Mistral AI</h2><p class=\"node-desc\">Startup IA fran\u00e7aise fond\u00e9e en 2023 par d'anciens chercheurs de DeepMind et Meta.<br>Strat\u00e9gie hybride : mod\u00e8les open weights pour attirer les d\u00e9veloppeurs (Mistral 7B, Mistral Small)<br>et mod\u00e8les propri\u00e9taires pour mon\u00e9tiser via API (Mistral Large, Mistral Medium).<br>L'une des rares entreprises IA europ\u00e9ennes comp\u00e9titives au niveau frontier.</p><span class=\"slide-status status-stable\">stable</span>", "<div class=\"slide-type-title\"><div class=\"slide-title-content\"><h2>R\u00e9capitulatif</h2><p class=\"stat\">28 concepts</p><p class=\"stat\">3 couches</p><p class=\"generated-from\">Mod\u00e8les Propri\u00e9taires</p></div></div>"] };
let lang = 'en', cur = 0;
function slides() { return ALL_SLIDES[lang]; }
function render() {
  document.getElementById('slide-content').innerHTML = slides()[cur];
  document.getElementById('counter').textContent = (cur+1) + ' / ' + slides().length;
  document.getElementById('prev').disabled = cur === 0;
  document.getElementById('next').disabled = cur === slides().length - 1;
  document.getElementById('progress').style.width = ((cur+1)/slides().length*100) + '%';
}
function go(d) { cur = Math.max(0, Math.min(slides().length-1, cur+d)); render(); }
function setLang(l) {
  lang = l; cur = 0;
  document.querySelectorAll('#lang-toggle .lang-btn').forEach(b => b.classList.toggle('active', b.textContent === l.toUpperCase()));
  render();
}
document.getElementById('prev').onclick = () => go(-1);
document.getElementById('next').onclick = () => go(1);
document.addEventListener('keydown', e => {
  if (e.key==='ArrowRight'||e.key==='ArrowDown') go(1);
  if (e.key==='ArrowLeft'||e.key==='ArrowUp') go(-1);
});
render();
</script>

<script>
(function () {
  // Dropdowns: click to toggle (touch + keyboard); hover handled in CSS on desktop.
  document.querySelectorAll('.sh-group > .sh-link').forEach(function (btn) {
    btn.addEventListener('click', function (e) {
      e.stopPropagation();
      var g = btn.parentElement, open = !g.classList.contains('open');
      document.querySelectorAll('.sh-group.open').forEach(function (o) { o.classList.remove('open'); });
      g.classList.toggle('open', open);
      btn.setAttribute('aria-expanded', open);
    });
  });
  document.addEventListener('click', function (e) {
    if (!e.target.closest('.sh-group')) document.querySelectorAll('.sh-group.open').forEach(function (o) { o.classList.remove('open'); });
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      document.querySelectorAll('.sh-group.open').forEach(function (o) { o.classList.remove('open'); });
      document.body.classList.remove('sh-menu-open');
    }
  });

  // Theme
  window.mmiaToggleTheme = function () {
    var dark = document.documentElement.getAttribute('data-theme') !== 'dark';
    if (dark) document.documentElement.setAttribute('data-theme', 'dark');
    else document.documentElement.removeAttribute('data-theme');
    try { localStorage.setItem('mmia-theme', dark ? 'dark' : 'light'); } catch (e) {}
    window.dispatchEvent(new CustomEvent('mmia-themechange', { detail: { dark: dark } }));
  };

  // Language memory: wrap the page's setLang, then restore the saved choice.
  if (typeof window.setLang === 'function') {
    var pageSetLang = window.setLang;
    window.setLang = function (l) {
      try { localStorage.setItem('mmia-lang', l); } catch (e) {}
      document.documentElement.lang = l;
      var r = pageSetLang.apply(this, arguments);
      document.querySelectorAll('.site-header [data-en], .site-footer [data-en]').forEach(function (el) {
        el.textContent = l === 'fr' ? (el.dataset.fr || el.dataset.en) : el.dataset.en;
      });
      document.querySelectorAll('.lang-btn').forEach(function (b) { b.classList.toggle('active', b.dataset.lang === l); });
      return r;
    };
    var saved = null;
    try { saved = localStorage.getItem('mmia-lang'); } catch (e) {}
    if (!saved) saved = (navigator.language || '').toLowerCase().indexOf('fr') === 0 ? 'fr' : 'en';
    if (saved !== 'en') window.setLang(saved);
  }
})();
</script>

<style>
:root {
  --bg: #FAFAF8;
  --surface: #FFFFFF;
  --sunk: #F3F3F0;
  --ink: #17181C;
  --ink-2: #45474E;
  --muted: #7A7D85;
  --line: #E6E6E2;
  --line-strong: #D2D2CC;
  --accent: #D8432E;
  --accent-ink: #B5361F;
  --accent-soft: #FBEAE6;
  --ok: #2F8F5B;
  --warn: #B7791F;
  --new: #6B4FBB;
  --info: #2F6FB5;
  --shadow-sm: 0 1px 2px rgba(20,20,25,.05);
  --shadow: 0 1px 2px rgba(20,20,25,.04), 0 12px 32px -16px rgba(20,20,25,.18);
  --f-ui: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --f-read: "Newsreader", Georgia, "Times New Roman", serif;
  --r: 10px;
  --header-h: 60px;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #0F1013;
  --surface: #17181C;
  --sunk: #1D1E23;
  --ink: #EDEDEF;
  --ink-2: #BDBFC6;
  --muted: #8E919A;
  --line: #2A2C32;
  --line-strong: #3A3D44;
  --accent: #F0644E;
  --accent-ink: #FF8571;
  --accent-soft: #3A1E19;
  --ok: #5BC48A;
  --warn: #E0A84A;
  --new: #A68BEB;
  --info: #6FA8E8;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.3);
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 16px 40px -16px rgba(0,0,0,.6);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-ui);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
::selection { background: var(--accent-soft); }

/* ── Header ── */
.site-header {
  position: sticky; top: 0; z-index: 900;
  height: var(--header-h);
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  -webkit-backdrop-filter: saturate(1.4) blur(12px);
  backdrop-filter: saturate(1.4) blur(12px);
  border-bottom: 1px solid var(--line);
  flex-shrink: 0;
}
.sh-inner {
  height: 100%;
  display: flex; align-items: center; gap: 28px;
  padding: 0 max(20px, env(safe-area-inset-right, 0px)) 0 max(20px, env(safe-area-inset-left, 0px));
}
.sh-logo {
  display: flex; align-items: center; gap: 10px;
  color: var(--ink); text-decoration: none;
  font-weight: 600; font-size: 15px; letter-spacing: -0.01em; white-space: nowrap;
}
.sh-logo svg { width: 26px; height: 26px; flex-shrink: 0; }
.sh-nav { display: flex; align-items: center; gap: 4px; }
.sh-group { position: relative; }
.sh-link {
  display: inline-flex; align-items: center; gap: 5px;
  height: 34px; padding: 0 10px;
  font: 500 14px/1 var(--f-ui); color: var(--ink-2);
  background: none; border: 0; border-radius: 8px; cursor: pointer;
  text-decoration: none; white-space: nowrap; position: relative;
  transition: color .15s, background .15s;
}
.sh-link:hover, .sh-group.open > .sh-link { color: var(--ink); background: var(--sunk); }
.sh-link.active { color: var(--ink); }
.sh-link.active::after {
  content: ""; position: absolute; left: 10px; right: 10px; bottom: -13px;
  height: 2px; border-radius: 2px; background: var(--accent);
}
.sh-caret { width: 10px; height: 10px; opacity: .55; transition: transform .15s; }
.sh-group.open .sh-caret { transform: rotate(180deg); }
.sh-menu {
  display: none;
  position: absolute; top: calc(100% + 10px); left: -8px;
  min-width: 340px; max-height: calc(100vh - 90px); overflow-y: auto;
  padding: 8px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  box-shadow: var(--shadow);
}
.sh-menu.wide { min-width: 640px; display: none; grid-template-columns: 1fr 1fr; gap: 4px 8px; }
.sh-group.open > .sh-menu { display: block; }
.sh-group.open > .sh-menu.wide { display: grid; }
@media (hover: hover) and (min-width: 900px) {
  .sh-group:hover > .sh-menu { display: block; }
  .sh-group:hover > .sh-menu.wide { display: grid; }
  .sh-group:hover .sh-caret { transform: rotate(180deg); }
  .sh-menu::before { content: ""; position: absolute; left: 0; right: 0; top: -12px; height: 12px; }
}
.sh-menu-col { display: grid; gap: 2px; align-content: start; }
.sh-menu-label {
  padding: 10px 10px 4px;
  font: 500 11px/1 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
}
.sh-item {
  display: grid; gap: 2px;
  padding: 8px 10px; border-radius: 8px;
  color: var(--ink); text-decoration: none;
  transition: background .12s;
}
.sh-item:hover, .sh-item.active { background: var(--sunk); }
.sh-item-title { font-size: 14px; font-weight: 500; line-height: 1.3; }
.sh-item-desc { font-size: 12.5px; color: var(--muted); line-height: 1.4; }
.sh-item.active .sh-item-title::before {
  content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%;
  background: var(--accent); margin-right: 7px; vertical-align: 2px;
}
.sh-menu-foot {
  grid-column: 1 / -1; margin-top: 4px; padding: 10px; border-top: 1px solid var(--line);
  font-size: 13px; color: var(--muted);
}
.sh-menu-foot a { color: var(--ink); font-weight: 500; text-decoration: none; }
.sh-menu-foot a:hover { color: var(--accent); }

.sh-context {
  display: flex; align-items: baseline; gap: 10px; min-width: 0;
  font-size: 14px; color: var(--muted);
}
.sh-context .sh-sep { color: var(--line-strong); }
.sh-context .sh-title {
  color: var(--ink); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.sh-context .sh-meta { font: 12px var(--f-mono); color: var(--muted); white-space: nowrap; }

.sh-right { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.lang-toggle {
  display: inline-flex; padding: 2px; gap: 2px;
  border: 1px solid var(--line); border-radius: 9px; background: var(--bg);
}
.lang-btn {
  height: 28px; min-width: 34px; padding: 0 8px;
  font: 500 12px/1 var(--f-mono); letter-spacing: .02em;
  color: var(--muted); background: none; border: 0; border-radius: 7px; cursor: pointer;
  transition: color .15s, background .15s;
}
.lang-btn:hover { color: var(--ink); }
.lang-btn.active { background: var(--ink); color: var(--surface); }
.icon-btn {
  width: 34px; height: 34px; display: inline-grid; place-items: center;
  color: var(--ink-2); background: none; border: 1px solid var(--line); border-radius: 9px; cursor: pointer;
  transition: color .15s, border-color .15s, background .15s;
}
.icon-btn:hover { color: var(--ink); border-color: var(--line-strong); background: var(--sunk); }
.icon-btn svg { width: 16px; height: 16px; }
.theme-btn .i-sun { display: none; }
:root[data-theme="dark"] .theme-btn .i-sun { display: block; }
:root[data-theme="dark"] .theme-btn .i-moon { display: none; }
.sh-burger { display: none; }

@media (max-width: 1100px) {
  .sh-context .sh-meta { display: none; }
}
@media (max-width: 960px) {
  .sh-inner { gap: 14px; }
  .sh-context { display: none; }
}
@media (max-width: 899px) {
  .sh-burger { display: inline-grid; }
  .sh-nav {
    display: none;
    position: fixed; left: 0; right: 0; top: var(--header-h); bottom: 0;
    flex-direction: column; align-items: stretch; gap: 2px;
    padding: 12px max(16px, env(safe-area-inset-right, 0px)) 32px max(16px, env(safe-area-inset-left, 0px));
    background: var(--surface); overflow-y: auto;
    border-top: 1px solid var(--line);
  }
  body.sh-menu-open .sh-nav { display: flex; }
  /* backdrop-filter would make the header the containing block of the fixed menu */
  body.sh-menu-open .site-header { -webkit-backdrop-filter: none; backdrop-filter: none; background: var(--surface); }
  body.sh-menu-open { overflow: hidden; }
  .sh-link { height: 44px; font-size: 16px; justify-content: space-between; width: 100%; }
  .sh-link.active::after { display: none; }
  .sh-link.active { color: var(--accent); }
  .sh-menu, .sh-menu.wide {
    position: static; min-width: 0; max-height: none; box-shadow: none; border: 0;
    padding: 0 0 8px 8px; grid-template-columns: 1fr;
  }
  .sh-item-desc { display: none; }
  .sh-right #gs-trigger .gs-placeholder, .sh-right #gs-trigger .gs-kbd { display: none; }
  .sh-right #gs-trigger { min-width: 0; width: 34px; height: 34px; padding: 0; justify-content: center; }
}

/* ── Footer ── */
.site-footer {
  border-top: 1px solid var(--line);
  padding: 28px max(20px, env(safe-area-inset-right, 0px)) 36px max(20px, env(safe-area-inset-left, 0px));
  color: var(--muted); font-size: 13px;
}
.sf-inner { max-width: 1180px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; justify-content: space-between; }
.sf-inner a { color: var(--ink-2); text-decoration: none; }
.sf-inner a:hover { color: var(--accent); }
.sf-links { display: flex; gap: 18px; flex-wrap: wrap; }

/* ── Shared building blocks ── */
.eyebrow {
  font: 500 12px/1.2 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
}
.chip {
  display: inline-flex; align-items: center; gap: 5px;
  font: 500 11px/1 var(--f-mono); letter-spacing: .02em;
  padding: 4px 8px; border-radius: 99px; border: 1px solid var(--line); color: var(--ink-2); background: var(--surface);
  white-space: nowrap;
}
.chip.dot::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.chip.st-stable { color: var(--ok); }
.chip.st-evolving { color: var(--warn); }
.chip.st-emerging { color: var(--new); }
.chip.st-deprecated { color: var(--muted); }
.chip.st-draft { color: var(--warn); }
.chip.st-review { color: var(--info); }
.btn {
  display: inline-flex; align-items: center; gap: 8px;
  height: 40px; padding: 0 16px;
  font: 500 14px/1 var(--f-ui); color: var(--ink); text-decoration: none;
  background: var(--surface); border: 1px solid var(--line-strong); border-radius: 9px; cursor: pointer;
  transition: background .15s, border-color .15s, color .15s, transform .15s;
}
.btn:hover { border-color: var(--ink-2); }
.btn.primary { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.btn.primary:hover { background: var(--accent); border-color: var(--accent); }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}
</style>
<style>
  body { background:var(--sunk); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px; height:100vh; height:100dvh; overflow:hidden; padding:16px }
  #slide { background:var(--surface); color:var(--ink); width:min(92vw,1000px); aspect-ratio:16/9; border:1px solid var(--line); border-radius:16px; padding:clamp(24px,5vw,56px) clamp(24px,6vw,72px); display:flex; flex-direction:column; justify-content:center; box-shadow:var(--shadow); position:relative; overflow:hidden; font-size:clamp(12px,1.6vw,18px) }
  #slide h1 { font-size:2.6em; font-weight:600; letter-spacing:-.03em; line-height:1.05; margin:0 0 14px }
  #slide h2 { font-size:1.7em; font-weight:600; letter-spacing:-.02em; line-height:1.15; margin:0 0 22px; display:flex; align-items:center; gap:.45em }
  .subtitle { font-family:var(--f-read); font-size:1.3em; color:var(--ink-2); margin:0 }

  .slide-layer-num,.slide-node-layer { position:absolute; top:24px; left:clamp(24px,6vw,72px); font:500 .7em/1 var(--f-mono); color:var(--muted); letter-spacing:.08em; text-transform:uppercase }
  ul { list-style:none; display:flex; flex-direction:column; gap:10px; margin:0; padding:0 }
  li { font-size:.92em; color:var(--ink-2); line-height:1.45; display:flex; gap:10px; align-items:baseline }
  li strong { color:var(--ink); font-weight:600 }
  .sd { display:inline-block; width:.5em; height:.5em; border-radius:50%; flex-shrink:0; transform:translateY(-.1em) }
  .sd-stable { background:var(--ok) } .sd-evolving { background:var(--warn) }
  .sd-emerging { background:var(--new) } .sd-deprecated { background:var(--muted) }
  .node-desc { font-family:var(--f-read); font-size:1.15em; color:var(--ink); line-height:1.6; margin:4px 0 0; max-width:38em }
  .slide-status { position:absolute; bottom:24px; right:clamp(24px,6vw,72px); font:500 .7em/1 var(--f-mono); letter-spacing:.04em; padding:5px 10px; border-radius:99px; border:1px solid currentColor }
  .status-stable { color:var(--ok) }
  .status-evolving { color:var(--warn) }
  .status-emerging { color:var(--new) }
  .status-deprecated { color:var(--muted) }
  .stat { font-size:1.5em; font-weight:600; margin:0 }
  .generated-from { font:.8em var(--f-mono); color:var(--muted); margin-top:12px }
  #nav { display:flex; align-items:center; gap:14px }
  .nav-btn { width:44px; height:44px; display:grid; place-items:center; background:var(--surface); color:var(--ink); border:1px solid var(--line-strong); border-radius:12px; font-size:1.1em; cursor:pointer; transition:background .15s, border-color .15s }
  .nav-btn:hover { border-color:var(--ink) }
  .nav-btn:disabled { opacity:.35; cursor:default }
  #counter { color:var(--muted); font:13px var(--f-mono); min-width:80px; text-align:center }
  #progress { position:absolute; bottom:0; left:0; height:3px; background:var(--accent); transition:width .3s }
  .slides-top { position:fixed; top:max(16px, env(safe-area-inset-top, 0px)); left:16px; right:16px; display:flex; justify-content:space-between; align-items:center; gap:10px }
  .slides-top a { font-size:14px; color:var(--ink-2); text-decoration:none }
  .slides-top a:hover { color:var(--accent) }
</style>

<script>
const ALL_SLIDES = { en: ["<div class=\"slide-type-title\"><div class=\"slide-title-content\"><h1>AI Use Cases</h1><p class=\"subtitle\">AI / LLM Ecosystem</p></div></div>", "<div class=\"slide-layer-num\">Layer 4</div><h2>KEY STACK</h2><ul><li><span class=\"sd sd-stable\"></span> <strong>LLM</strong> \u2014 The large language model at the core of every use case.\nChoice depends on latency, cost, capability, and data privacy requirements.\nExamples: GPT-4o, Claude 3.5/4, Gemini 2.0, Llama 3.3 (self-hosted)..</li><li><span class=\"sd sd-stable\"></span> <strong>Vector DB</strong> \u2014 Stores and indexes document embeddings for fast semantic search.\nReturns top-k most similar chunks for a given query vector.\nExamples: Pinecone, Weaviate, Qdrant, pgvector, ChromaDB..</li><li><span class=\"sd sd-evolving\"></span> <strong>Tools / MCP</strong> \u2014 Executable functions the LLM can call: APIs, file system, databases, code runner.\nMCP (Model Context Protocol) is the emerging standard for tool connectivity.\nThe agent loop depends on tools to take real-world actions..</li><li><span class=\"sd sd-evolving\"></span> <strong>Memory / State</strong> \u2014 Persistence layer for conversation history, user preferences, and intermediate agent state.\nTypes: in-context (in the prompt), external (DB/vector store), cached (KV cache).\nCritical for multi-turn conversations and long-running agent tasks..</li><li><span class=\"sd sd-evolving\"></span> <strong>Orchestrator</strong> \u2014 The coordination layer that routes tasks between agents, manages retry logic,\ntracks state, and enforces guardrails in a multi-agent system.\nExamples: LangGraph, CrewAI, AutoGen, custom state machines..</li></ul>", "<div class=\"slide-layer-num\">Layer 3</div><h2>AI PATTERNS</h2><ul><li><span class=\"sd sd-stable\"></span> <strong>RAG</strong> \u2014 Retrieval-Augmented Generation: retrieve relevant chunks from a knowledge base\nand inject them into the LLM's context window before generation.\nGrounds the answer in verifiable source documents.\n\u2192 See the RAG pattern map for full detail..</li><li><span class=\"sd sd-stable\"></span> <strong>Completion / Inline</strong> \u2014 The simplest pattern: send a prompt (file context, cursor position, instructions)\nto an LLM and return the generated text directly as a suggestion.\nNo retrieval, no tools \u2014 pure next-token prediction in a rich context.\nLatency is the key constraint: must feel instantaneous to the developer..</li><li><span class=\"sd sd-evolving\"></span> <strong>Agent Loop</strong> \u2014 The LLM is the brain of a loop: observe \u2192 think \u2192 act \u2192 observe.\nEach iteration the model reasons about its state, decides on a tool call,\nreceives the result, and decides the next step \u2014 until the goal is reached.\n\u2192 See the AI Agents map for full detail..</li><li><span class=\"sd sd-emerging\"></span> <strong>Multi-Agent</strong> \u2014 Multiple specialized agents collaborate: an orchestrator decomposes a task\nand dispatches subtasks to worker agents, then aggregates results.\nEnables parallelism, specialization, and fault isolation.\nKey challenge: coordination overhead and error propagation between agents..</li></ul>", "<div class=\"slide-layer-num\">Layer 2</div><h2>USE CASES</h2><ul><li><span class=\"sd sd-stable\"></span> <strong>Chat LLM (ChatGPT-like)</strong> \u2014 A user asks questions in natural language; the system retrieves relevant context\nfrom a knowledge base and generates a grounded answer.\nExamples: customer support bot, internal FAQ assistant, product documentation search.\n\u2192 Click to read full article..</li><li><span class=\"sd sd-stable\"></span> <strong>Conversational Assistant</strong> \u2014 A multi-turn dialogue system that maintains conversation history and persona.\nUnlike pure Q&A, it can handle ambiguous intent, ask clarifying questions,\nand maintain context across sessions via memory.\nExamples: sales assistant, onboarding guide, personal productivity agent..</li><li><span class=\"sd sd-stable\"></span> <strong>Code Completion</strong> \u2014 Inline code suggestions as the developer types, powered by the surrounding file context.\nRanges from single-line autocomplete to full function generation.\nExamples: GitHub Copilot inline suggestions, JetBrains AI completions, Tabnine.\nKey metric: acceptance rate (% of suggestions accepted by the dev)..</li><li><span class=\"sd sd-evolving\"></span> <strong>Agentic Coding</strong> \u2014 An AI agent that can read files, run tests, search docs, and make multi-step code changes\nwith minimal human intervention.</li><li><span class=\"sd sd-stable\"></span> <strong>Knowledge Search</strong> \u2014 An analyst queries a private corpus (internal reports, contracts, emails, wikis)\nin natural language and gets cited, traceable answers \u2014 not just search results.\nExamples: legal contract review, compliance Q&A, financial research assistant.\n\u2192 Click to read full article..</li><li><span class=\"sd sd-evolving\"></span> <strong>Report Generation</strong> \u2014 The AI gathers data from multiple sources (databases, APIs, documents), synthesizes it,\nand drafts a structured report.</li><li><span class=\"sd sd-evolving\"></span> <strong>Workflow Automation</strong> \u2014 An agent orchestrates a multi-step process end-to-end: reads triggers, calls APIs,\nmakes decisions, handles exceptions, and notifies stakeholders.\nExamples: automated PR review pipeline, incident triage, data pipeline orchestration.\n\u2192 Click to read full article..</li><li><span class=\"sd sd-emerging\"></span> <strong>Anomaly Detection</strong> \u2014 The AI continuously monitors logs, metrics, or streams and surfaces anomalies\nin natural language, with root cause hypothesis and suggested remediation.\nExamples: log analysis, security threat detection, performance regression alerts.\nKey challenge: low false-positive rate \u2014 alert fatigue kills adoption..</li></ul>", "<div class=\"slide-layer-num\">Layer 1</div><h2>PERSONAS</h2><ul><li><span class=\"sd sd-stable\"></span> <strong>End User</strong> \u2014 A non-technical user interacting with an AI-powered product.\nTypical contexts: customer support chat, internal helpdesk,\nconsumer apps (ChatGPT, Gemini, Claude.ai).\nGoals: get answers fast, without learning any tooling..</li><li><span class=\"sd sd-stable\"></span> <strong>Developer</strong> \u2014 A software engineer using AI to write, debug, review, and ship code faster.\nTypical contexts: VS Code + Copilot, Cursor, Claude Code, JetBrains AI Assistant.\nGoals: reduce boilerplate, catch bugs earlier, offload context-switching..</li><li><span class=\"sd sd-stable\"></span> <strong>Business Analyst</strong> \u2014 A knowledge worker querying internal documents, policies, or data to produce insights.\nTypical contexts: enterprise knowledge bases, legal/compliance review, financial research.\nGoals: find the right answer in a large corpus without reading everything manually..</li><li><span class=\"sd sd-evolving\"></span> <strong>Ops / SRE</strong> \u2014 An operations engineer automating workflows, monitoring infrastructure,\nor orchestrating multi-step processes with autonomous agents.\nTypical contexts: CI/CD pipelines, incident response, data pipelines, reporting automation.\nGoals: reduce manual toil, trigger the right action at the right time..</li></ul>", "<div class=\"slide-node-layer\">KEY STACK</div><h2><span class=\"sd sd-stable\"></span> LLM</h2><p class=\"node-desc\">The large language model at the core of every use case.<br>Choice depends on latency, cost, capability, and data privacy requirements.<br>Examples: GPT-4o, Claude 3.5/4, Gemini 2.0, Llama 3.3 (self-hosted).</p><span class=\"slide-status status-stable\">stable</span>", "<div class=\"slide-node-layer\">KEY STACK</div><h2><span class=\"sd sd-stable\"></span> Vector DB</h2><p class=\"node-desc\">Stores and indexes document embeddings for fast semantic search.<br>Returns top-k most similar chunks for a given query vector.<br>Examples: Pinecone, Weaviate, Qdrant, pgvector, ChromaDB.</p><span class=\"slide-status status-stable\">stable</span>", "<div class=\"slide-node-layer\">KEY STACK</div><h2><span class=\"sd sd-evolving\"></span> Tools / MCP</h2><p class=\"node-desc\">Executable functions the LLM can call: APIs, file system, databases, code runner.<br>MCP (Model Context Protocol) is the emerging standard for tool connectivity.<br>The agent loop depends on tools to take real-world actions.</p><span class=\"slide-status status-evolving\">evolving</span>", "<div class=\"slide-node-layer\">KEY STACK</div><h2><span class=\"sd sd-evolving\"></span> Memory / State</h2><p class=\"node-desc\">Persistence layer for conversation history, user preferences, and intermediate agent state.<br>Types: in-context (in the prompt), external (DB/vector store), cached (KV cache).<br>Critical for multi-turn conversations and long-running agent tasks.</p><span class=\"slide-status status-evolving\">evolving</span>", "<div class=\"slide-node-layer\">KEY STACK</div><h2><span class=\"sd sd-evolving\"></span> Orchestrator</h2><p class=\"node-desc\">The coordination layer that routes tasks between agents, manages retry logic,<br>tracks state, and enforces guardrails in a multi-agent system.<br>Examples: LangGraph, CrewAI, AutoGen, custom state machines.</p><span class=\"slide-status status-evolving\">evolving</span>", "<div class=\"slide-node-layer\">AI PATTERNS</div><h2><span class=\"sd sd-stable\"></span> RAG</h2><p class=\"node-desc\">Retrieval-Augmented Generation: retrieve relevant chunks from a knowledge base<br>and inject them into the LLM's context window before generation.<br>Grounds the answer in verifiable source documents.<br>\u2192 See the RAG pattern map for full detail.</p><span class=\"slide-status status-stable\">stable</span>", "<div class=\"slide-node-layer\">AI PATTERNS</div><h2><span class=\"sd sd-stable\"></span> Completion / Inline</h2><p class=\"node-desc\">The simplest pattern: send a prompt (file context, cursor position, instructions)<br>to an LLM and return the generated text directly as a suggestion.<br>No retrieval, no tools \u2014 pure next-token prediction in a rich context.<br>Latency is the key constraint: must feel instantaneous to the developer.</p><span class=\"slide-status status-stable\">stable</span>", "<div class=\"slide-node-layer\">AI PATTERNS</div><h2><span class=\"sd sd-evolving\"></span> Agent Loop</h2><p class=\"node-desc\">The LLM is the brain of a loop: observe \u2192 think \u2192 act \u2192 observe.<br>Each iteration the model reasons about its state, decides on a tool call,<br>receives the result, and decides the next step \u2014 until the goal is reached.<br>\u2192 See the AI Agents map for full detail.</p><span class=\"slide-status status-evolving\">evolving</span>", "<div class=\"slide-node-layer\">AI PATTERNS</div><h2><span class=\"sd sd-emerging\"></span> Multi-Agent</h2><p class=\"node-desc\">Multiple specialized agents collaborate: an orchestrator decomposes a task<br>and dispatches subtasks to worker agents, then aggregates results.<br>Enables parallelism, specialization, and fault isolation.<br>Key challenge: coordination overhead and error propagation between agents.</p><span class=\"slide-status status-emerging\">emerging</span>", "<div class=\"slide-node-layer\">USE CASES</div><h2><span class=\"sd sd-stable\"></span> Chat LLM (ChatGPT-like)</h2><p class=\"node-desc\">A user asks questions in natural language; the system retrieves relevant context<br>from a knowledge base and generates a grounded answer.<br>Examples: customer support bot, internal FAQ assistant, product documentation search.<br>\u2192 Click to read full article.</p><span class=\"slide-status status-stable\">stable</span>", "<div class=\"slide-node-layer\">USE CASES</div><h2><span class=\"sd sd-stable\"></span> Conversational Assistant</h2><p class=\"node-desc\">A multi-turn dialogue system that maintains conversation history and persona.<br>Unlike pure Q&A, it can handle ambiguous intent, ask clarifying questions,<br>and maintain context across sessions via memory.<br>Examples: sales assistant, onboarding guide, personal productivity agent.</p><span class=\"slide-status status-stable\">stable</span>", "<div class=\"slide-node-layer\">USE CASES</div><h2><span class=\"sd sd-stable\"></span> Code Completion</h2><p class=\"node-desc\">Inline code suggestions as the developer types, powered by the surrounding file context.<br>Ranges from single-line autocomplete to full function generation.<br>Examples: GitHub Copilot inline suggestions, JetBrains AI completions, Tabnine.<br>Key metric: acceptance rate (% of suggestions accepted by the dev).</p><span class=\"slide-status status-stable\">stable</span>", "<div class=\"slide-node-layer\">USE CASES</div><h2><span class=\"sd sd-evolving\"></span> Agentic Coding</h2><p class=\"node-desc\">An AI agent that can read files, run tests, search docs, and make multi-step code changes<br>with minimal human intervention. Goes beyond autocomplete \u2014 the agent plans and executes.<br>Examples: Cursor Agent, Claude Code, Devin, GitHub Copilot Workspace.<br>\u2192 Click to read full article.</p><span class=\"slide-status status-evolving\">evolving</span>", "<div class=\"slide-node-layer\">USE CASES</div><h2><span class=\"sd sd-stable\"></span> Knowledge Search</h2><p class=\"node-desc\">An analyst queries a private corpus (internal reports, contracts, emails, wikis)<br>in natural language and gets cited, traceable answers \u2014 not just search results.<br>Examples: legal contract review, compliance Q&A, financial research assistant.<br>\u2192 Click to read full article.</p><span class=\"slide-status status-stable\">stable</span>", "<div class=\"slide-node-layer\">USE CASES</div><h2><span class=\"sd sd-evolving\"></span> Report Generation</h2><p class=\"node-desc\">The AI gathers data from multiple sources (databases, APIs, documents), synthesizes it,<br>and drafts a structured report. Can include charts via code execution.<br>Examples: weekly business review, competitive intelligence digest, financial summary.<br>Key challenge: ensuring factual accuracy across multiple heterogeneous sources.</p><span class=\"slide-status status-evolving\">evolving</span>", "<div class=\"slide-node-layer\">USE CASES</div><h2><span class=\"sd sd-evolving\"></span> Workflow Automation</h2><p class=\"node-desc\">An agent orchestrates a multi-step process end-to-end: reads triggers, calls APIs,<br>makes decisions, handles exceptions, and notifies stakeholders.<br>Examples: automated PR review pipeline, incident triage, data pipeline orchestration.<br>\u2192 Click to read full article.</p><span class=\"slide-status status-evolving\">evolving</span>", "<div class=\"slide-node-layer\">USE CASES</div><h2><span class=\"sd sd-emerging\"></span> Anomaly Detection</h2><p class=\"node-desc\">The AI continuously monitors logs, metrics, or streams and surfaces anomalies<br>in natural language, with root cause hypothesis and suggested remediation.<br>Examples: log analysis, security threat detection, performance regression alerts.<br>Key challenge: low false-positive rate \u2014 alert fatigue kills adoption.</p><span class=\"slide-status status-emerging\">emerging</span>", "<div class=\"slide-node-layer\">PERSONAS</div><h2><span class=\"sd sd-stable\"></span> End User</h2><p class=\"node-desc\">A non-technical user interacting with an AI-powered product.<br>Typical contexts: customer support chat, internal helpdesk,<br>consumer apps (ChatGPT, Gemini, Claude.ai).<br>Goals: get answers fast, without learning any tooling.</p><span class=\"slide-status status-stable\">stable</span>", "<div class=\"slide-node-layer\">PERSONAS</div><h2><span class=\"sd sd-stable\"></span> Developer</h2><p class=\"node-desc\">A software engineer using AI to write, debug, review, and ship code faster.<br>Typical contexts: VS Code + Copilot, Cursor, Claude Code, JetBrains AI Assistant.<br>Goals: reduce boilerplate, catch bugs earlier, offload context-switching.</p><span class=\"slide-status status-stable\">stable</span>", "<div class=\"slide-node-layer\">PERSONAS</div><h2><span class=\"sd sd-stable\"></span> Business Analyst</h2><p class=\"node-desc\">A knowledge worker querying internal documents, policies, or data to produce insights.<br>Typical contexts: enterprise knowledge bases, legal/compliance review, financial research.<br>Goals: find the right answer in a large corpus without reading everything manually.</p><span class=\"slide-status status-stable\">stable</span>", "<div class=\"slide-node-layer\">PERSONAS</div><h2><span class=\"sd sd-evolving\"></span> Ops / SRE</h2><p class=\"node-desc\">An operations engineer automating workflows, monitoring infrastructure,<br>or orchestrating multi-step processes with autonomous agents.<br>Typical contexts: CI/CD pipelines, incident response, data pipelines, reporting automation.<br>Goals: reduce manual toil, trigger the right action at the right time.</p><span class=\"slide-status status-evolving\">evolving</span>", "<div class=\"slide-type-title\"><div class=\"slide-title-content\"><h2>Summary</h2><p class=\"stat\">21 concepts</p><p class=\"stat\">4 layers</p><p class=\"generated-from\">AI Use Cases</p></div></div>"], fr: ["<div class=\"slide-type-title\"><div class=\"slide-title-content\"><h1>Cas d'Usage IA</h1><p class=\"subtitle\">\u00c9cosyst\u00e8me IA / LLM</p></div></div>", "<div class=\"slide-layer-num\">Layer 4</div><h2>STACK CL\u00c9</h2><ul><li><span class=\"sd sd-stable\"></span> <strong>LLM</strong> \u2014 Le grand mod\u00e8le de langage au c\u0153ur de chaque cas d'usage.\nLe choix d\u00e9pend de la latence, du co\u00fbt, de la capacit\u00e9 et des exigences de confidentialit\u00e9.\nExemples : GPT-4o, Claude 3.5/4, Gemini 2.0, Llama 3.3 (auto-h\u00e9berg\u00e9)..</li><li><span class=\"sd sd-stable\"></span> <strong>Vector DB</strong> \u2014 Stocke et indexe les embeddings de documents pour la recherche s\u00e9mantique rapide.\nRetourne les top-k chunks les plus similaires pour un vecteur de requ\u00eate donn\u00e9.\nExemples : Pinecone, Weaviate, Qdrant, pgvector, ChromaDB..</li><li><span class=\"sd sd-evolving\"></span> <strong>Outils / MCP</strong> \u2014 Fonctions ex\u00e9cutables que le LLM peut appeler : APIs, syst\u00e8me de fichiers, BDD, ex\u00e9cuteur de code.\nMCP (Model Context Protocol) est le standard \u00e9mergent pour la connectivit\u00e9 des outils.\nLa boucle agent d\u00e9pend des outils pour effectuer des actions dans le monde r\u00e9el..</li><li><span class=\"sd sd-evolving\"></span> <strong>M\u00e9moire / \u00c9tat</strong> \u2014 Couche de persistance pour l'historique de conversation, les pr\u00e9f\u00e9rences utilisateur et l'\u00e9tat interm\u00e9diaire de l'agent.\nTypes : en contexte (dans le prompt), externe (BDD/vector store), cach\u00e9 (KV cache).\nCritique pour les conversations multi-tours et les t\u00e2ches d'agents longues..</li><li><span class=\"sd sd-evolving\"></span> <strong>Orchestrateur</strong> \u2014 La couche de coordination qui route les t\u00e2ches entre agents, g\u00e8re la logique de retry,\nsuit l'\u00e9tat et applique les guardrails dans un syst\u00e8me multi-agent.\nExemples : LangGraph, CrewAI, AutoGen, machines \u00e0 \u00e9tats personnalis\u00e9es..</li></ul>", "<div class=\"slide-layer-num\">Layer 3</div><h2>PATTERNS IA</h2><ul><li><span class=\"sd sd-stable\"></span> <strong>RAG</strong> \u2014 Retrieval-Augmented Generation : r\u00e9cup\u00e9rer les chunks pertinents d'une base de connaissance\net les injecter dans la fen\u00eatre de contexte du LLM avant la g\u00e9n\u00e9ration.\nAncre la r\u00e9ponse dans des documents sources v\u00e9rifiables.\n\u2192 Voir la carte du pattern RAG pour le d\u00e9tail complet..</li><li><span class=\"sd sd-stable\"></span> <strong>Compl\u00e9tion / Inline</strong> \u2014 Le pattern le plus simple : envoyer un prompt (contexte du fichier, position du curseur,\ninstructions) au LLM et retourner le texte g\u00e9n\u00e9r\u00e9 directement comme suggestion.\nPas de r\u00e9cup\u00e9ration, pas d'outils \u2014 pr\u00e9diction de token pur dans un contexte riche.\nLa latence est la contrainte cl\u00e9 : doit sembler instantan\u00e9 pour le d\u00e9veloppeur..</li><li><span class=\"sd sd-evolving\"></span> <strong>Boucle Agent</strong> \u2014 Le LLM est le cerveau d'une boucle : observer \u2192 r\u00e9fl\u00e9chir \u2192 agir \u2192 observer.\n\u00c0 chaque it\u00e9ration, le mod\u00e8le raisonne sur son \u00e9tat, d\u00e9cide d'un appel d'outil,\nre\u00e7oit le r\u00e9sultat, et d\u00e9cide l'\u00e9tape suivante \u2014 jusqu'\u00e0 atteindre le but.\n\u2192 Voir la carte AI Agents pour le d\u00e9tail complet..</li><li><span class=\"sd sd-emerging\"></span> <strong>Multi-Agent</strong> \u2014 Plusieurs agents sp\u00e9cialis\u00e9s collaborent : un orchestrateur d\u00e9compose une t\u00e2che\net dispatche les sous-t\u00e2ches \u00e0 des agents travailleurs, puis agr\u00e8ge les r\u00e9sultats.\nPermet le parall\u00e9lisme, la sp\u00e9cialisation et l'isolation des erreurs.\nD\u00e9fi cl\u00e9 : overhead de coordination et propagation des erreurs entre agents..</li></ul>", "<div class=\"slide-layer-num\">Layer 2</div><h2>CAS D'USAGE</h2><ul><li><span class=\"sd sd-stable\"></span> <strong>Chat LLM (type ChatGPT)</strong> \u2014 Un utilisateur pose des questions en langage naturel ; le syst\u00e8me r\u00e9cup\u00e8re le contexte\npertinent depuis une base de connaissance et g\u00e9n\u00e8re une r\u00e9ponse ancr\u00e9e.\nExemples : bot support client, assistant FAQ interne, recherche dans la documentation produit.\n\u2192 Cliquer pour lire l'article complet..</li><li><span class=\"sd sd-stable\"></span> <strong>Assistant Conversationnel</strong> \u2014 Un syst\u00e8me de dialogue multi-tours qui maintient l'historique et la persona.\nContrairement au Q&A pur, il g\u00e8re l'intention ambigu\u00eb, pose des questions de clarification,\net maintient le contexte entre sessions via la m\u00e9moire.\nExemples : assistant commercial, guide d'onboarding, agent de productivit\u00e9 personnelle..</li><li><span class=\"sd sd-stable\"></span> <strong>Compl\u00e9tion de Code</strong> \u2014 Suggestions de code inline pendant que le d\u00e9veloppeur tape, aliment\u00e9es par le contexte du fichier.\nVa de l'autocompl\u00e9tion ligne par ligne \u00e0 la g\u00e9n\u00e9ration de fonctions enti\u00e8res.\nExemples : suggestions inline GitHub Copilot, compl\u00e9tions JetBrains AI, Tabnine.\nM\u00e9trique cl\u00e9 : taux d'acceptation (% de suggestions accept\u00e9es par le dev)..</li><li><span class=\"sd sd-evolving\"></span> <strong>Coding Agentique</strong> \u2014 Un agent IA capable de lire des fichiers, ex\u00e9cuter des tests, chercher dans les docs,\net effectuer des modifications de code multi-\u00e9tapes avec peu d'intervention humaine.\nVa bien au-del\u00e0 de l'autocompl\u00e9tion \u2014 l'agent planifie et ex\u00e9cute.\nExemples : Cursor Agent, Claude Code, Devin, GitHub Copilot Workspace.\n\u2192 Cliquer pour lire l'article complet..</li><li><span class=\"sd sd-stable\"></span> <strong>Recherche dans la Connaissance</strong> \u2014 Un analyste interroge un corpus priv\u00e9 (rapports internes, contrats, emails, wikis)\nen langage naturel et obtient des r\u00e9ponses cit\u00e9es et tra\u00e7ables \u2014 pas juste des r\u00e9sultats de recherche.\nExemples : revue de contrats l\u00e9gaux, Q&A conformit\u00e9, assistant de recherche financi\u00e8re.\n\u2192 Cliquer pour lire l'article complet..</li><li><span class=\"sd sd-evolving\"></span> <strong>G\u00e9n\u00e9ration de Rapports</strong> \u2014 L'IA collecte des donn\u00e9es depuis plusieurs sources (bases de donn\u00e9es, APIs, documents),\nles synth\u00e9tise et r\u00e9dige un rapport structur\u00e9.</li><li><span class=\"sd sd-evolving\"></span> <strong>Automatisation de Workflows</strong> \u2014 Un agent orchestre un processus multi-\u00e9tapes de bout en bout : lit les d\u00e9clencheurs,\nappelle des APIs, prend des d\u00e9cisions, g\u00e8re les exceptions, notifie les parties prenantes.\nExemples : pipeline de revue PR automatis\u00e9e, triage d'incidents, orchestration de pipeline data.\n\u2192 Cliquer pour lire l'article complet..</li><li><span class=\"sd sd-emerging\"></span> <strong>D\u00e9tection d'Anomalies</strong> \u2014 L'IA surveille en continu des logs, m\u00e9triques ou flux et remonte les anomalies\nen langage naturel, avec hypoth\u00e8se de cause racine et rem\u00e9diation sugg\u00e9r\u00e9e.\nExemples : analyse de logs, d\u00e9tection de menaces s\u00e9curit\u00e9, alertes de r\u00e9gression perf.\nD\u00e9fi cl\u00e9 : faible taux de faux positifs \u2014 la fatigue aux alertes tue l'adoption..</li></ul>", "<div class=\"slide-layer-num\">Layer 1</div><h2>PERSONAS</h2><ul><li><span class=\"sd sd-stable\"></span> <strong>Utilisateur Final</strong> \u2014 Un utilisateur non technique interagissant avec un produit IA.\nContextes typiques : chat support client, helpdesk interne,\napps grand public (ChatGPT, Gemini, Claude.ai).\nObjectif : obtenir des r\u00e9ponses rapidement, sans apprendre d'outils..</li><li><span class=\"sd sd-stable\"></span> <strong>D\u00e9veloppeur</strong> \u2014 Un ing\u00e9nieur logiciel utilisant l'IA pour coder, d\u00e9boguer, relire et livrer plus vite.\nContextes typiques : VS Code + Copilot, Cursor, Claude Code, JetBrains AI Assistant.\nObjectif : r\u00e9duire le boilerplate, d\u00e9tecter les bugs plus t\u00f4t, r\u00e9duire les interruptions..</li><li><span class=\"sd sd-stable\"></span> <strong>Analyste M\u00e9tier</strong> \u2014 Un travailleur du savoir interrogeant des documents internes, politiques ou donn\u00e9es pour produire des insights.\nContextes typiques : bases de connaissance entreprise, revue l\u00e9gale/conformit\u00e9, recherche financi\u00e8re.\nObjectif : trouver la bonne r\u00e9ponse dans un grand corpus sans tout lire manuellement..</li><li><span class=\"sd sd-evolving\"></span> <strong>Ops / SRE</strong> \u2014 Un ing\u00e9nieur ops automatisant des workflows, surveillant l'infrastructure,\nou orchestrant des processus multi-\u00e9tapes avec des agents autonomes.\nContextes typiques : pipelines CI/CD, r\u00e9ponse aux incidents, pipelines data, automatisation de rapports.\nObjectif : r\u00e9duire les t\u00e2ches manuelles, d\u00e9clencher la bonne action au bon moment..</li></ul>", "<div class=\"slide-node-layer\">STACK CL\u00c9</div><h2><span class=\"sd sd-stable\"></span> LLM</h2><p class=\"node-desc\">Le grand mod\u00e8le de langage au c\u0153ur de chaque cas d'usage.<br>Le choix d\u00e9pend de la latence, du co\u00fbt, de la capacit\u00e9 et des exigences de confidentialit\u00e9.<br>Exemples : GPT-4o, Claude 3.5/4, Gemini 2.0, Llama 3.3 (auto-h\u00e9berg\u00e9).</p><span class=\"slide-status status-stable\">stable</span>", "<div class=\"slide-node-layer\">STACK CL\u00c9</div><h2><span class=\"sd sd-stable\"></span> Vector DB</h2><p class=\"node-desc\">Stocke et indexe les embeddings de documents pour la recherche s\u00e9mantique rapide.<br>Retourne les top-k chunks les plus similaires pour un vecteur de requ\u00eate donn\u00e9.<br>Exemples : Pinecone, Weaviate, Qdrant, pgvector, ChromaDB.</p><span class=\"slide-status status-stable\">stable</span>", "<div class=\"slide-node-layer\">STACK CL\u00c9</div><h2><span class=\"sd sd-evolving\"></span> Outils / MCP</h2><p class=\"node-desc\">Fonctions ex\u00e9cutables que le LLM peut appeler : APIs, syst\u00e8me de fichiers, BDD, ex\u00e9cuteur de code.<br>MCP (Model Context Protocol) est le standard \u00e9mergent pour la connectivit\u00e9 des outils.<br>La boucle agent d\u00e9pend des outils pour effectuer des actions dans le monde r\u00e9el.</p><span class=\"slide-status status-evolving\">evolving</span>", "<div class=\"slide-node-layer\">STACK CL\u00c9</div><h2><span class=\"sd sd-evolving\"></span> M\u00e9moire / \u00c9tat</h2><p class=\"node-desc\">Couche de persistance pour l'historique de conversation, les pr\u00e9f\u00e9rences utilisateur et l'\u00e9tat interm\u00e9diaire de l'agent.<br>Types : en contexte (dans le prompt), externe (BDD/vector store), cach\u00e9 (KV cache).<br>Critique pour les conversations multi-tours et les t\u00e2ches d'agents longues.</p><span class=\"slide-status status-evolving\">evolving</span>", "<div class=\"slide-node-layer\">STACK CL\u00c9</div><h2><span class=\"sd sd-evolving\"></span> Orchestrateur</h2><p class=\"node-desc\">La couche de coordination qui route les t\u00e2ches entre agents, g\u00e8re la logique de retry,<br>suit l'\u00e9tat et applique les guardrails dans un syst\u00e8me multi-agent.<br>Exemples : LangGraph, CrewAI, AutoGen, machines \u00e0 \u00e9tats personnalis\u00e9es.</p><span class=\"slide-status status-evolving\">evolving</span>", "<div class=\"slide-node-layer\">PATTERNS IA</div><h2><span class=\"sd sd-stable\"></span> RAG</h2><p class=\"node-desc\">Retrieval-Augmented Generation : r\u00e9cup\u00e9rer les chunks pertinents d'une base de connaissance<br>et les injecter dans la fen\u00eatre de contexte du LLM avant la g\u00e9n\u00e9ration.<br>Ancre la r\u00e9ponse dans des documents sources v\u00e9rifiables.<br>\u2192 Voir la carte du pattern RAG pour le d\u00e9tail complet.</p><span class=\"slide-status status-stable\">stable</span>", "<div class=\"slide-node-layer\">PATTERNS IA</div><h2><span class=\"sd sd-stable\"></span> Compl\u00e9tion / Inline</h2><p class=\"node-desc\">Le pattern le plus simple : envoyer un prompt (contexte du fichier, position du curseur,<br>instructions) au LLM et retourner le texte g\u00e9n\u00e9r\u00e9 directement comme suggestion.<br>Pas de r\u00e9cup\u00e9ration, pas d'outils \u2014 pr\u00e9diction de token pur dans un contexte riche.<br>La latence est la contrainte cl\u00e9 : doit sembler instantan\u00e9 pour le d\u00e9veloppeur.</p><span class=\"slide-status status-stable\">stable</span>", "<div class=\"slide-node-layer\">PATTERNS IA</div><h2><span class=\"sd sd-evolving\"></span> Boucle Agent</h2><p class=\"node-desc\">Le LLM est le cerveau d'une boucle : observer \u2192 r\u00e9fl\u00e9chir \u2192 agir \u2192 observer.<br>\u00c0 chaque it\u00e9ration, le mod\u00e8le raisonne sur son \u00e9tat, d\u00e9cide d'un appel d'outil,<br>re\u00e7oit le r\u00e9sultat, et d\u00e9cide l'\u00e9tape suivante \u2014 jusqu'\u00e0 atteindre le but.<br>\u2192 Voir la carte AI Agents pour le d\u00e9tail complet.</p><span class=\"slide-status status-evolving\">evolving</span>", "<div class=\"slide-node-layer\">PATTERNS IA</div><h2><span class=\"sd sd-emerging\"></span> Multi-Agent</h2><p class=\"node-desc\">Plusieurs agents sp\u00e9cialis\u00e9s collaborent : un orchestrateur d\u00e9compose une t\u00e2che<br>et dispatche les sous-t\u00e2ches \u00e0 des agents travailleurs, puis agr\u00e8ge les r\u00e9sultats.<br>Permet le parall\u00e9lisme, la sp\u00e9cialisation et l'isolation des erreurs.<br>D\u00e9fi cl\u00e9 : overhead de coordination et propagation des erreurs entre agents.</p><span class=\"slide-status status-emerging\">emerging</span>", "<div class=\"slide-node-layer\">CAS D'USAGE</div><h2><span class=\"sd sd-stable\"></span> Chat LLM (type ChatGPT)</h2><p class=\"node-desc\">Un utilisateur pose des questions en langage naturel ; le syst\u00e8me r\u00e9cup\u00e8re le contexte<br>pertinent depuis une base de connaissance et g\u00e9n\u00e8re une r\u00e9ponse ancr\u00e9e.<br>Exemples : bot support client, assistant FAQ interne, recherche dans la documentation produit.<br>\u2192 Cliquer pour lire l'article complet.</p><span class=\"slide-status status-stable\">stable</span>", "<div class=\"slide-node-layer\">CAS D'USAGE</div><h2><span class=\"sd sd-stable\"></span> Assistant Conversationnel</h2><p class=\"node-desc\">Un syst\u00e8me de dialogue multi-tours qui maintient l'historique et la persona.<br>Contrairement au Q&A pur, il g\u00e8re l'intention ambigu\u0 "slide-status status-stable\">stable</span>", "<div class=\"slide-node-layer\">CAS D'USAGE</div><h2><span class=\"sd sd-evolving\"></span> G\u00e9n\u00e9ration de Rapports</h2><p class=\"node-desc\">L'IA collecte des donn\u00e9es depuis plusieurs sources (bases de donn\u00e9es, APIs, documents),<br>les synth\u00e9tise et r\u00e9dige un rapport structur\u00e9. Peut inclure des graphiques via ex\u00e9cution de code.<br>Exemples : revue m\u00e9tier hebdomadaire, digest de veille concurrentielle, synth\u00e8se financi\u00e8re.<br>D\u00e9fi cl\u00e9 : assurer la pr\u00e9cision factuelle sur des sources h\u00e9t\u00e9rog\u00e8nes multiples.</p><span class=\"slide-status status-evolving\">evolving</span>", "<div class=\"slide-node-layer\">CAS D'USAGE</div><h2><span class=\"sd sd-evolving\"></span> Automatisation de Workflows</h2><p class=\"node-desc\">Un agent orchestre un processus multi-\u00e9tapes de bout en bout : lit les d\u00e9clencheurs,<br>appelle des APIs, prend des d\u00e9cisions, g\u00e8re les exceptions, notifie les parties prenantes.<br>Exemples : pipeline de revue PR automatis\u00e9e, triage d'incidents, orchestration de pipeline data.<br>\u2192 Cliquer pour lire l'article complet.</p><span class=\"slide-status status-evolving\">evolving</span>", "<div class=\"slide-node-layer\">CAS D'USAGE</div><h2><span class=\"sd sd-emerging\"></span> D\u00e9tection d'Anomalies</h2><p class=\"node-desc\">L'IA surveille en continu des logs, m\u00e9triques ou flux et remonte les anomalies<br>en langage naturel, avec hypoth\u00e8se de cause racine et rem\u00e9diation sugg\u00e9r\u00e9e.<br>Exemples : analyse de logs, d\u00e9tection de menaces s\u00e9curit\u00e9, alertes de r\u00e9gression perf.<br>D\u00e9fi cl\u00e9 : faible taux de faux positifs \u2014 la fatigue aux alertes tue l'adoption.</p><span class=\"slide-status status-emerging\">emerging</span>", "<div class=\"slide-node-layer\">PERSONAS</div><h2><span class=\"sd sd-stable\"></span> Utilisateur Final</h2><p class=\" tif</h2><p class=\"stat\">21 concepts</p><p class=\"stat\">4 couches</p><p class=\"generated-from\">Cas d'Usage IA</p></div></div>"] };
let lang = 'en', cur = 0;
function slides() { return ALL_SLIDES[lang]; }
function render() {
  document.getElementById('slide-content').innerHTML = slides()[cur];
  document.getElementById('counter').textContent = (cur+1) + ' / ' + slides().length;
  document.getElementById('prev').disabled = cur === 0;
  document.getElementById('next').disabled = cur === slides().length - 1;
  document.getElementById('progress').style.width = ((cur+1)/slides().length*100) + '%';
}
function go(d) { cur = Math.max(0, Math.min(slides().length-1, cur+d)); render(); }
function setLang(l) {
  lang = l; cur = 0;
  document.querySelectorAll('#lang-toggle .lang-btn').forEach(b => b.classList.toggle('active', b.textContent === l.toUpperCase()));
  render();
}
document.getElementById('prev').onclick = () => go(-1);
document.getElementById('next').onclick = () => go(1);
document.addEventListener('keydown', e => {
  if (e.key==='ArrowRight'||e.key==='ArrowDown') go(1);
  if (e.key==='ArrowLeft'||e.key==='ArrowUp') go(-1);
});
render();
</script>

<script>
(function () {
  // Dropdowns: click to toggle (touch + keyboard); hover handled in CSS on desktop.
  document.querySelectorAll('.sh-group > .sh-link').forEach(function (btn) {
    btn.addEventListener('click', function (e) {
      e.stopPropagation();
      var g = btn.parentElement, open = !g.classList.contains('open');
      document.querySelectorAll('.sh-group.open').forEach(function (o) { o.classList.remove('open'); });
      g.classList.toggle('open', open);
      btn.setAttribute('aria-expanded', open);
    });
  });
  document.addEventListener('click', function (e) {
    if (!e.target.closest('.sh-group')) document.querySelectorAll('.sh-group.open').forEach(function (o) { o.classList.remove('open'); });
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      document.querySelectorAll('.sh-group.open').forEach(function (o) { o.classList.remove('open'); });
      document.body.classList.remove('sh-menu-open');
    }
  });

  // Theme
  window.mmiaToggleTheme = function () {
    var dark = document.documentElement.getAttribute('data-theme') !== 'dark';
    if (dark) document.documentElement.setAttribute('data-theme', 'dark');
    else document.documentElement.removeAttribute('data-theme');
    try { localStorage.setItem('mmia-theme', dark ? 'dark' : 'light'); } catch (e) {}
    window.dispatchEvent(new CustomEvent('mmia-themechange', { detail: { dark: dark } }));
  };

  // Language memory: wrap the page's setLang, then restore the saved choice.
  if (typeof window.setLang === 'function') {
    var pageSetLang = window.setLang;
    window.setLang = function (l) {
      try { localStorage.setItem('mmia-lang', l); } catch (e) {}
      document.documentElement.lang = l;
      var r = pageSetLang.apply(this, arguments);
      document.querySelectorAll('.site-header [data-en], .site-footer [data-en]').forEach(function (el) {
        el.textContent = l === 'fr' ? (el.dataset.fr || el.dataset.en) : el.dataset.en;
      });
      document.querySelectorAll('.lang-btn').forEach(function (b) { b.classList.toggle('active', b.dataset.lang === l); });
      return r;
    };
    var saved = null;
    try { saved = localStorage.getItem('mmia-lang'); } catch (e) {}
    if (!saved) saved = (navigator.language || '').toLowerCase().indexOf('fr') === 0 ? 'fr' : 'en';
    if (saved !== 'en') window.setLang(saved);
  }
})();
</script>
